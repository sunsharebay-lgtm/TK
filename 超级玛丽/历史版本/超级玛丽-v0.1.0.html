  .tbtn { position:absolute; pointer-events:auto; border-radius:50%;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.25);
    color:rgba(255,255,255,.75); font-size:22px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px); -webkit-tap-highlight-color:transparent; }
  .tbtn.on { background:rgba(255,255,255,.32); color:#fff; }
  #bL{ left:max(12px,env(safe-area-inset-left)); bottom:86px; width:64px;height:64px;}

'use strict';
const U = {
  clamp:(v,a,b)=>v<a?a:v>b?b:v,
  lerp:(a,b,t)=>a+(b-a)*t,
  approach:(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t),
  rand:(a,b)=>a+Math.random()*(b-a),
  randi:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  hash(n){ n=Math.imul(n^(n>>>16),2246822519); n=Math.imul(n^(n>>>13),3266489917); return ((n^(n>>>16))>>>0)/4294967296; },
  aabb:(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y,
  pad:(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0')
};

const INP = {
  keys:{}, just:{}, anyKey:false,
  map:{
    left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'],
    down:['ArrowDown','KeyS'],
    up:['ArrowUp','KeyW'],
    jump:['Space','ArrowUp','KeyK'],
    run:['KeyL','ShiftLeft','ShiftRight'],
    pause:['KeyP','Escape'], mute:['KeyM'], confirm:['Enter','Space','KeyK']
  },
  init(){
    const dn=e=>{
      this.anyKey=true;
      if(e.code==='F5'||(e.ctrlKey&&e.code==='KeyR'))return;
      for(const k in this.map) if(this.map[k].includes(e.code)){
        if(!this.keys[k])this.just[k]=true; this.keys[k]=true; e.preventDefault();
      }
      A.unlock();
    };
    const up=e=>{ for(const k in this.map) if(this.map[k].includes(e.code)) this.keys[k]=false; };
    addEventListener('keydown',dn,{passive:false});
    addEventListener('keyup',up);
    addEventListener('blur',()=>{ this.keys={}; });
    this.initTouch();
    this.initGamepad();
  },
  press(k){ return !!this.just[k]; },
  endFrame(){ this.just={}; },
  bindBtn(id,k){
    const el=document.getElementById(id); if(!el)return;
    const on=e=>{ e.preventDefault(); if(!this.keys[k])this.just[k]=true; this.keys[k]=true; el.classList.add('on'); A.unlock(); };
    const off=e=>{ e.preventDefault(); this.keys[k]=false; el.classList.remove('on'); };
    el.addEventListener('pointerdown',on);
    el.addEventListener('pointerup',off);
    el.addEventListener('pointercancel',off);
    el.addEventListener('pointerleave',off);
  },
  initTouch(){
    const show=()=>{ const tc=document.getElementById('tc'); if(tc)tc.style.display='block'; removeEventListener('touchstart',show); };
    addEventListener('touchstart',show,{once:true});
    this.bindBtn('bL','left'); this.bindBtn('bR','right');
    this.bindBtn('bD','down'); this.bindBtn('bA','jump'); this.bindBtn('bB','run');
    const cv=document.getElementById('cv');
    if(cv) cv.addEventListener('pointerdown',()=>{ this.anyKey=true; A.unlock(); });
    const fs=document.getElementById('fs');
    if(fs) fs.addEventListener('click',()=>{
      const w=document.getElementById('wrap');
      if(!document.fullscreenElement){ (w.requestFullscreen||w.webkitRequestFullscreen).call(w); }
      else document.exitFullscreen();
    });
  },
  gpPrev:{},
  initGamepad(){},
  pollGamepad(){
    if(!navigator.getGamepads)return;
    const gps=navigator.getGamepads();
    const seen=new Set();
    for(const gp of gps){
      if(!gp)continue;
      const id=String(gp.index);
      seen.add(id);
      const ax=gp.axes[0]||0;
      const held={
        left:ax<-.4||!!(gp.buttons[14]&&gp.buttons[14].pressed),
        right:ax>.4||!!(gp.buttons[15]&&gp.buttons[15].pressed),
        jump:!!(gp.buttons[0]&&gp.buttons[0].pressed),
        run:!!(gp.buttons[2]&&gp.buttons[2].pressed)||!!(gp.buttons[1]&&gp.buttons[1].pressed)
      };
      for(const k of ['left','right','jump','run']){
        if(held[k]&&!this.gpPrev[id+'|'+k])this.just[k]=true;
        this.keys[k]=this.keys[k]||held[k];
      }
      const st=!!(gp.buttons[9]&&gp.buttons[9].pressed);
      if(st&&!this.gpPrev[id+'|pause'])this.just.pause=true;
      this.gpPrev[id+'|left']=held.left; this.gpPrev[id+'|right']=held.right;
      this.gpPrev[id+'|jump']=held.jump; this.gpPrev[id+'|run']=held.run;
      this.gpPrev[id+'|pause']=st;
    }
    for(const k of Object.keys(this.gpPrev)){
      if(!seen.has(k.split('|')[0]))delete this.gpPrev[k];
    }
  }
};
const A = {
  ctx:null, master:null, sfxG:null, musG:null,
  muted:(()=>{try{return localStorage.getItem('spl_mute')==='1'}catch(e){return false}})(),
  tempoMult:1,
  curKey:null, stepIdx:0, nextT:0, timer:null, noiseBuf:null,

  unlock(){
    if(this.ctx){ if(this.ctx.state==='suspended'){ try{this.ctx.resume();}catch(e){} } return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:.55;
      this.master.connect(this.ctx.destination);
      this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=.9; this.sfxG.connect(this.master);
      this.musG=this.ctx.createGain(); this.musG.gain.value=.5; this.musG.connect(this.master);
    }catch(e){ this.ctx=null; }
  },
  toggleMute(){
    this.muted=!this.muted;
    try{localStorage.setItem('spl_mute',this.muted?'1':'0');}catch(e){}
    if(this.master)this.master.gain.value=this.muted?0:.55;
  },

  tone(o){
    if(!this.ctx||!o)return;
    try{
      const c=this.ctx, t=c.currentTime+(o.delay||0), dur=o.t||.1;
      const osc=c.createOscillator(), g=c.createGain();
      osc.type=o.type||'square';
      osc.frequency.setValueAtTime(Math.max(1,o.f0||440),t);
      if(o.f1&&Math.abs(o.f1-(o.f0||440))>1)
        osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1),t+dur);
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(o.v||.2,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      osc.connect(g); g.connect(o.dest||this.sfxG);
      osc.start(t); osc.stop(t+dur+.03);
    }catch(e){}
  },
  noise(o){
    if(!this.ctx)return;
    try{
      const c=this.ctx;
      if(!this.noiseBuf){
        const len=c.sampleRate|0;
        this.noiseBuf=c.createBuffer(1,len,c.sampleRate);
        const d=this.noiseBuf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      }
      const t=c.currentTime+(o.delay||0), dur=o.t||.1;
      const src=c.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
      const fl=c.createBiquadFilter();
      fl.type=o.ftype||'lowpass'; fl.frequency.value=o.f||1000; fl.Q.value=o.q||.8;
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(o.v||.2,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      src.connect(fl); fl.connect(g); g.connect(this.sfxG);
      src.start(t); src.stop(t+dur+.03);
    }catch(e){}
  },
  freqOf(midi){ return 440*Math.pow(2,(midi-69)/12); },

  sfx(name){
    if(!this.ctx)return;
    switch(name){
      case 'jump': this.tone({f0:200,f1:640,t:.16,v:.2}); break;
      case 'bigjump': this.tone({f0:150,f1:480,t:.2,v:.22}); break;
      case 'bump': this.tone({type:'triangle',f0:130,f1:70,t:.09,v:.32}); break;
      case 'stomp':
        this.noise({t:.09,v:.28,f:500});
        this.tone({type:'sine',f0:260,f1:80,t:.12,v:.25});
        break;
      case 'coin':
        this.tone({f0:988,t:.05,v:.15});
        this.tone({f0:1319,t:.32,v:.18,delay:.05});
        break;
      case 'breakBlock':
        this.noise({t:.16,v:.3,f:900,ftype:'bandpass'});
        this.tone({f0:220,f1:70,t:.14,v:.18});
        break;
      case 'itemRise': {
        const fs=[160,240,340,470,630,800,980];
        fs.forEach((f,i)=>this.tone({f0:f,t:.05,v:.11,delay:i*.048}));
        break;
      }
      case 'power': {
        [72,76,79,84,88,91].forEach((m,i)=>this.tone({f0:this.freqOf(m),t:.06,v:.13,delay:i*.05}));
        break;
      }
      case 'pipe': this.tone({f0:620,f1:130,t:.34,v:.18}); break;
      case 'fire': this.tone({type:'sawtooth',f0:520,f1:140,t:.13,v:.12}); break;
      case 'kick':
        this.noise({t:.04,v:.2,f:2500,ftype:'highpass'});
        this.tone({f0:240,f1:330,t:.07,v:.17});
        break;
      case 'flagpole': this.tone({f0:1150,f1:230,t:.75,v:.11}); break;
      case 'tick': this.tone({f0:1050,t:.03,v:.06}); break;
      case 'fireworkBoom':
        this.noise({t:.35,v:.28,f:350});
        this.tone({type:'sine',f0:200,f1:50,t:.3,v:.22});
        break;
      case 'select': this.tone({f0:720,f1:900,t:.05,v:.11}); break;
      case 'pauseBlip': this.tone({type:'triangle',f0:520,t:.06,v:.14}); break;
    }
  },

  jingle(seq){
    if(!this.ctx)return;
    let d=0;
    for(const it of seq){
      if(it[0]>0){
        this.tone({f0:this.freqOf(it[0]),t:it[1],v:it[2]||.16,delay:d});
        if(it[3]) this.tone({f0:this.freqOf(it[3]),t:it[1],v:.1,delay:d});
      }
      d+=it[1];
    }
  },
  jClear(){ this.jingle([[67,.09],[72,.09],[76,.09],[79,.09],[84,.14],[0,.05],[88,.34]]); },
  jDeath(){ this.jingle([[69,.13],[64,.13],[60,.19],[0,.05],[57,.3]]); },
  jGameOver(){ this.jingle([[60,.26],[55,.26],[52,.26],[48,.62]]); },
  jOneUp(){ this.jingle([[76,.08],[79,.08],[84,.08],[88,.08],[91,.2]]); },
  jWarning(){ this.jingle([[81,.08],[0,.07],[81,.08],[0,.07],[81,.1]]); },

  noteMidi(s){
    const m=/^([A-G])([#b]?)(\d)$/.exec(s);
    if(!m)return null;
    const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
    return 12*(parseInt(m[3])+1)+base;
  },
  parseTrack(s){
    const tk=s.trim().split(/\s+/);
    const ev=new Array(tk.length).fill(null);
    for(let i=0;i<tk.length;i++){
      const t=tk[i];
      if(t==='.'||t==='-')continue;
      if(t.length===1&&'KSHksh'.includes(t)){ ev[i]={d:t}; continue; }
      const m=this.noteMidi(t);
      if(m==null)continue;
      let len=1,j=i+1;
      while(j<tk.length&&tk[j]==='-'){len++;j++;}
      ev[i]={m,len};
    }
    return ev;
  },

  buildSongs(){
    for(const k in this.songs){
      const sg=this.songs[k];
      let maxLen=0;
      const tracks=sg.tracks.map(tr=>{
        let ev=this.parseTrack(tr.s);
        if(tr.shift>0){
          const n=new Array(ev.length+tr.shift).fill(null);
          for(let i=0;i<ev.length;i++)n[i+tr.shift]=ev[i];
          ev=n;
        }
        maxLen=Math.max(maxLen,ev.length);
        return {w:tr.w,v:tr.v,ev};
      });
      sg.tracks=tracks.map(tr=>{
        while(tr.ev.length<maxLen)tr.ev.push(null);
        return tr;
      });
      sg.len=maxLen;
    }
  },

  playMusic(key){
    if(this.curKey===key&&this.timer)return;
    this.stopMusic();
    this.curKey=key;
    if(!this.ctx)return;
    const sg=this.songs[key]; if(!sg)return;

const SR=13;
const PX=16;
const LVD=[];

function Builder(cols){
  const R=CFG.ROWS;
  const g=new Uint8Array(cols*R);
  const sp=[],warps=[];
  const o={
    cols,g,spawns:sp,warps,flagCol:0,castleCol:0,cpCol:0,
    set(c,r,t){ if(c>=0&&c<cols&&r>=0&&r<R)g[r*cols+c]=t; },
    get(c,r){ return g[r*cols+c]; },
    rect(c0,c1,r0,r1,t){ for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++)o.set(c,r,t); },
    ground(c0,c1){ o.rect(c0,c1,SR,R-1,TL.GTOP); for(let c=c0;c<=c1;c++)o.set(c,R-1,TL.GFILL); },
    ceiling(){ o.rect(0,cols-1,0,1,TL.GTOP); },
    row(c0,c1,r,t){ o.rect(c0,c1,r,r,t); },
    wallCol(c){ o.rect(c,c,0,SR-1,TL.STONE); },
    pipe(c,h,opt){
      opt=opt||{};
      const top=SR-h;
      o.set(c,top,TL.PIPE_TL); o.set(c+1,top,TL.PIPE_TR);
      for(let r=top+1;r<SR;r++){ o.set(c,r,TL.PIPE_BL); o.set(c+1,r,TL.PIPE_BR); }
      if(opt.plant)sp.push({t:'plant',x:(c+1)*PX,y:top*PX});
      if(opt.warp)warps.push({a:opt.a||0,col:c,row:top,dest:opt.warp});
      return o;
    },
    stairsUp(c,h){ for(let i=0;i<h;i++)o.rect(c+i,c+i,SR-1-i,SR-1,TL.STONE); },
    stairsDown(c,h){ for(let i=0;i<h;i++)o.rect(c+h-1-i,c+h-1-i,SR-1-i,SR-1,TL.STONE); },
    coins(c0,c1,r){ for(let c=c0;c<=c1;c++)o.spawn('coin',c*PX+2,r*PX+1); },
    coinArc(cx,cy,n){
      for(let i=0;i<n;i++){
        const dx=i-(n-1)/2;
        const lift=Math.round((1-(dx*dx)/(((n/2)*(n/2))||1))*2);
        o.spawn('coin',(cx+dx)*PX+2,(cy-lift)*PX+1);
      }
    },
    plat(c0,c1,r){ o.rect(c0,c1,r,r,TL.PLAT); },
    pillar(c,h){ o.rect(c,c,SR-h,SR-1,TL.STONE); },
    flag(c){
      for(let r=SR-2;r>=4;r--)o.set(c,r,TL.POLE);
      o.set(c,3,TL.POLE_TOP);
      o.flagCol=c;
    },
    castle(c){ o.castleCol=c; },
    checkpoint(c){ o.cpCol=c; },
    lava(c0,c1){ o.rect(c0,c1,SR,R-1,TL.LAVA_T); for(let c=c0;c<=c1;c++)o.set(c,R-1,TL.LAVA_B); },
    spawn(t,x,y,e){ sp.push(Object.assign({t,x,y},e||{})); }
  };
  return o;
}

function areaOf(b){
  return { grid:b.g, cols:b.cols, rows:CFG.ROWS, spawns:b.spawns,
           flagCol:b.flagCol, castleCol:b.castleCol, cpX:b.cpCol*PX,
           warps:b.warps };
}

function entTileAt(area,c,r){
  if(r>=area.rows)return TL.EMPTY;
  if(c<0||c>=area.cols)return TL.STONE;
  if(r<0)return TL.EMPTY;
  return area.grid[r*area.cols+c];
}

function moveAndCollide(e,area,opt){
  opt=opt||{};
  e.hitWallL=false; e.hitWallR=false; e.hitHead=false; e.headCell=null;
  const T=CFG.TILE;
  const sideSolid=t=>isSolid(t)||t===TL.PLAT;
  e.x+=e.vx;
  let c0,c1,r0,r1,t;
  if(e.vx>0){
    c1=Math.floor((e.x+e.w)/T); c0=c1;
    r0=Math.floor(e.y/T); r1=Math.floor((e.y+e.h-.01)/T);
    for(let r=r0;r<=r1;r++){
      t=entTileAt(area,c1,r);
      if(sideSolid(t)){
        e.x=c1*T-e.w-.01; e.vx=opt.bounceX?-e.vx:0; e.hitWallR=true; break;
      }
    }
  }else if(e.vx<0){
    c0=Math.floor(e.x/T); c1=c0;
    r0=Math.floor(e.y/T); r1=Math.floor((e.y+e.h-.01)/T);
    for(let r=r0;r<=r1;r++){
      t=entTileAt(area,c0,r);
      if(sideSolid(t)){
        e.x=(c0+1)*T+.01; e.vx=opt.bounceX?-e.vx:0; e.hitWallL=true; break;
      }
    }
  }
  const prevBot=e.y+e.h;
  e.y+=e.vy;
  e.onGround=false;
  if(e.vy>0){
    r1=Math.floor((e.y+e.h)/T);
    c0=Math.floor((e.x+.01)/T); c1=Math.floor((e.x+e.w-.01)/T);
    for(let c=c0;c<=c1;c++){
      t=entTileAt(area,c,r1);
      if(isSolid(t)||(t===TL.PLAT&&prevBot<=r1*T+.01)){
        e.y=r1*T-e.h; e.vy=0; e.onGround=true; break;
      }
    }
  }else if(e.vy<0){
    r0=Math.floor(e.y/T);
    c0=Math.floor((e.x+.01)/T); c1=Math.floor((e.x+e.w-.01)/T);
    let best=null,bestOv=0;
    for(let c=c0;c<=c1;c++){
      t=entTileAt(area,c,r0);
      const sol=isSolid(t)||(opt.player&&t===TL.HIDDEN);
      if(sol){
        const ov=Math.min(e.x+e.w,(c+1)*T)-Math.max(e.x,c*T);
        if(!best||ov>bestOv){best={c,r:r0,t};bestOv=ov;}
      }
    }
    if(best){
      e.y=(best.r+1)*T+.01; e.vy=0; e.hitHead=true; e.headCell=best;
    }
  }
}

class Foe{
  constructor(x,y,w,h){
    this.type='foe';
    this.x=x;this.y=y;this.w=w;this.h=h;
    this.vx=-.45;this.vy=0;
    this.active=false;this.dead=false;this.remove=false;
    this.squashT=0;this.flip=false;this.fvy=0;
    this.animT=U.randi(0,30);
  }
  activate(){ this.active=true; }
  baseUpdate(G){
    if(this.flip){
      this.vy+=.38; this.y+=this.vy; this.x+=this.vx;
      if(this.y>CFG.ROWS*16+80)this.remove=true;
      return false;
    }
    if(this.squashT>0){
      this.squashT--;
      if(this.squashT<=0)this.remove=true;
      return false;
    }
    if(!this.active){
      const cam=G.cam.x;
      if(this.x<cam+G.viewW+48)this.activate();
      else return false;
    }
    if(this.x+this.w<G.cam.x-96||this.x>G.cam.x+G.viewW+160){
      if(this.y>CFG.ROWS*16+40)this.remove=true;
      return true;
    }
    this.animT++;
    return true;
  }
  physics(G){
    this.vy=Math.min(this.vy+.42,CFG.MAX_FALL);
    moveAndCollide(this,G.area());
    if(this.hitWallL)this.vx=Math.abs(this.vx);
    if(this.hitWallR)this.vx=-Math.abs(this.vx);
    if(this.y>CFG.ROWS*16+40)this.remove=true;
  }
  stompScore(chain){
    const tbl=[100,200,400,500,800,1000,2000,4000,8000];
    if(chain>=tbl.length){ G.addLife(); return '1UP'; }
    return tbl[chain];
  }
  flipDie(G,vxDir,score){
    if(this.dead)return;
    this.dead=true;this.flip=true;
    this.vy=-4.6;this.vx=(vxDir||0)||1.2;
    A.sfx('kick');
    if(score!=null)G.popScore(this.x,this.y,String(score));
  }
  onStomp(G){ this.flipDie(G,G.player.face,100); return true; }
  onTouch(G,p){ p.hurt(); }
  onFire(G){
    this.flipDie(G,G.player.face,200);
    G.popScore(this.x,this.y,'200');
  }
  draw(){}
}

class Goomba extends Foe{
  constructor(x,y){ super(x,y,13,13); this.type='goomba'; this.vx=-.45; }
  update(G){
    if(!this.baseUpdate(G))return;
    if(this.dead&&this.flip)return;
    this.physics(G);
  }
  onStomp(G,chain){
    this.squashT=26;this.dead=true;this.vx=0;
    A.sfx('stomp');
    const s=this.stompScore(chain||0);
    G.addScore(s,this.x,this.y);
    return CFG.STOMP_BOUNCE;
  }
  draw(ctx,f){
    if(this.squashT>0){ ctx.drawImage(ART.F.goombaFlat,this.x-1,this.y+6,15,7); return; }
    if(this.flip){
      ctx.save();ctx.translate(this.x+7,this.y+7);ctx.scale(1,-1);
      ctx.drawImage(ART.F.goombaA,-7,-7,14,14);ctx.restore();return;
    }
    ctx.drawImage((Math.floor(this.animT/9)%2)?ART.F.goombaB:ART.F.goombaA,this.x-1,this.y-1,15,14);
  }
}

class Koopa extends Foe{
  constructor(x,y,winged){
    super(x,y,13,17);
    this.type='koopa'; this.winged=!!winged;
    this.state=this.winged?'wing':'walk';
    this.vx=-.4;
    this.shellT=0;this.moveShell=false;
  }
  becomeShell(){
    this.state='shell';this.moveShell=false;this.shellT=520;
    this.h=13;const dy=17-13;this.y+=dy;this.vx=0;
  }
  kick(dir){
    this.state='shell';this.moveShell=true;this.shellT=0;
    this.vx=dir*CFG.SHELL_SPEED;
    A.sfx('kick');
  }
  update(G){
    if(!this.baseUpdate(G))return;
    if(this.state==='shell'){
      if(this.moveShell){
        this.physics(G);
        if(this.hitWallL||this.hitWallR){ A.sfx('bump'); }
        G.shellVsFoes(this);
      }else{
        this.physics(G);
        this.vx=0;
        this.shellT--;
        if(this.shellT<=60&&!this.wakeWiggle)this.wakeWiggle=true;
        if(this.shellT<=0){
          if(!U.aabb(this,G.player.expBox())){
            this.state='walk';this.h=17;this.y-=4;this.vx=-.4;
            this.moveShell=false;this.wakeWiggle=false;
          }else this.shellT=30;
        }
      }
      return;
    }
    if(this.state==='wing'){
      this.physics(G);
      if(this.onGround)this.vy=-4.9;
    }else{
      this.physics(G);
    }
  }
  onStomp(G,chain){
    if(this.state==='shell'&&this.moveShell){
      this.moveShell=false;this.vx=0;this.shellT=520;
      A.sfx('stomp');
      return CFG.STOMP_BOUNCE;
    }
    if(this.state==='shell'){
      const dir=G.player.x+G.player.w/2<this.x+this.w/2?1:-1;
      this.kick(dir);
      G.addScore(400,this.x,this.y);
      return CFG.STOMP_BOUNCE_HI;
    }
    A.sfx('stomp');
    if(this.winged){
      this.winged=false;this.state='walk';
      const s=this.stompScore(chain||0);
      G.addScore(s,this.x,this.y);
      return CFG.STOMP_BOUNCE;
    }
    this.becomeShell();
    const s=this.stompScore(chain||0);
    G.addScore(s,this.x,this.y);
    return CFG.STOMP_BOUNCE;
  }
  onTouch(G,p){
    if(this.state==='shell'){
      if(this.moveShell){
        p.hurt();
      }else{
        const dir=p.x+p.w/2<this.x+this.w/2?1:-1;
        this.kick(dir);
        G.addScore(400,this.x,this.y);
      }
      return;
    }
    p.hurt();
  }
  onFire(G){ this.flipDie(G,G.player.face,200); }
  draw(ctx,f){
    const fl=this.flip;
    if(this.state==='shell'){
      if(fl){
        ctx.save();ctx.translate(this.x+7,this.y+7);ctx.scale(1,-1);
        ctx.drawImage(ART.F.shell,-8,-7,16,14);ctx.restore();
      }else{
        ctx.drawImage(this.wakeWiggle&&(Math.floor(f/4)%2)?ART.F.shellWake:ART.F.shell,this.x-1,this.y-1,17,14);
      }
      return;
    }
    if(fl){
      ctx.save();ctx.translate(this.x+8,this.y+10);ctx.scale(1,-1);
      ctx.drawImage(ART.F.koopaA,-8,-10,16,20);ctx.restore();
      return;
    }
    if(this.winged){
      const wf=Math.floor(this.animT/8)%2;
      ctx.drawImage(wf?ART.F.wingB:ART.F.wingA,this.x+(this.vx>0?10:-4),this.y-2,10,8);
    }
    const img=(Math.floor(this.animT/9)%2)?ART.F.koopaB:ART.F.koopaA;
    if(this.vx>0){
      ctx.save();ctx.translate(this.x+8,this.y);ctx.scale(-1,1);
      ctx.drawImage(img,-8,-3,17,21);ctx.restore();
    }else ctx.drawImage(img,this.x-1,this.y-3,17,21);
  }
}

class Plant extends Foe{
  constructor(x,y){
    super(x,y-22,14,22);
    this.type='plant';
    this.baseY=y;
    this.ph='hide';this.pt=U.randi(20,70);
    this.emerge=0;
    this.active=true;this.noGrav=true;
  }
  update(G){
    this.animT++;
    const p=G.player;
    const near=Math.abs(p.x+p.w/2-(this.x+7))<44;
    if(this.ph==='hide'){
      if(!near&&p.form!==99){ this.pt--; if(this.pt<=0){this.ph='rise';} }
    }else if(this.ph==='rise'){
      this.emerge+=.033;
      if(this.emerge>=1){this.emerge=1;this.ph='up';this.pt=110;}
    }else if(this.ph==='up'){
      this.pt--; if(this.pt<=0)this.ph='sink';
    }else{
      this.emerge-=.033;
      if(this.emerge<=0){this.emerge=0;this.ph='hide';this.pt=90;}
    }
    this.y=this.baseY-this.emerge*22;
    if(this.emerge<=0)this.noTouch=true;else this.noTouch=false;
    if(this.y>CFG.ROWS*16+80)this.remove=true;
  }
  onStomp(G){ return null; }
  onTouch(G,p){ if(this.emerge>.25)p.hurt(); }
  onFire(G){ this.dead=true;this.flip=true;this.vy=-4;this.vx=1;A.sfx('kick');G.addScore(200,this.x,this.y); }
  draw(ctx,f){
    if(this.emerge<=0)return;
    ctx.drawImage(Math.floor(f/12)%2?ART.F.plantB:ART.F.plantA,this.x-1,this.y-1,16,23);
  }
}

class Item{
  constructor(x,y,w,h){
    this.type='item';this.x=x;this.y=y;this.w=w;this.h=h;
    this.vx=0;this.vy=0;this.emergeT=32;this.remove=false;
    this.fromY=y;
  }
  emerging(){
    if(this.emergeT<=0)return false;
    this.emergeT--;
    const k=(32-this.emergeT)/32;
    this.y=this.fromY-k*this.h;
    return true;
  }
  drawEmerge(ctx,img,dw,dh){
    ctx.save();
    ctx.beginPath();
    ctx.rect(this.x-2,this.fromY-this.h-1,this.w+4,this.h+1);
    ctx.clip();
    ctx.drawImage(img,this.x,this.y,dw,dh);
    ctx.restore();
  }
  physics(G){

class Mover{
  constructor(x,y,o){
    this.type='mover';
    this.x=x;this.y=y;this.w=o.w||44;this.h=8;
    this.axis=o.axis||'x';this.range=o.range||64;
    this.speed=o.speed||.6;
    this.phase=Math.random()*6.28;
    this.bx=x;this.by=y;
    this.dx=0;this.dy=0;
    this.remove=false;
    if(this.axis==='x')this.x=this.bx+Math.sin(this.phase)*this.range;
    else this.y=this.by+Math.sin(this.phase)*this.range;
  }
  update(G){
    this.phase+=this.speed/this.range*2.4;
    if(this.axis==='x'){
      const nx=this.bx+Math.sin(this.phase)*this.range;
      this.dx=nx-this.x;this.dy=0;this.x=nx;
    }else{
      const ny=this.by+Math.sin(this.phase)*this.range;
      this.dy=ny-this.y;this.dx=0;this.y=ny;
    }
  }
  draw(ctx,f){
    const g=ctx.createLinearGradient(this.x,this.y,this.x,this.y+8);
    g.addColorStop(0,'#ffd45a');g.addColorStop(1,'#c98a1a');
    ctx.fillStyle=g;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(this.x,this.y,this.w,8,3);
    else ctx.rect(this.x,this.y,this.w,8);
    ctx.fill();
    ctx.fillStyle='#fff2b0';
    ctx.fillRect(this.x+3,this.y+1,this.w-6,2);
  }
}

class FireBallEnt{

    this.t=0;this.remove=false;this.explodeT=0;
  }
  update(G){
    if(this.explodeT>0){
      this.explodeT--;
      if(this.explodeT<=0)this.remove=true;
      return;
    }
    this.t++;
    this.vy=Math.min(this.vy+.3,5);
    moveAndCollide(this,G.area(),{bounceX:false});
    if(this.hitWallL||this.hitWallR||this.hitHead){ this.boom(G); return; }
    if(this.onGround)this.vy=-3.5;
    if(this.t>260||this.y>CFG.ROWS*16+40||this.x<G.cam.x-40||this.x>G.cam.x+G.viewW+40)this.remove=true;
    for(const f of G.ents){
      if(f===this||!(f instanceof Foe))continue;
      if(f.dead||!f.active)continue;
      if(f instanceof Plant&&f.emerge<=.2)continue;
      if(U.aabb(this,f)){ f.onFire(G); this.boom(G); break; }
    }
  }
  boom(G){
    this.explodeT=8;
    G.sparkle(this.x+3,this.y+3,'#ffb040');
  }
  draw(ctx,f){
    if(this.explodeT>0){
      ctx.globalAlpha=this.explodeT/8;
      ctx.fillStyle='#ffdf80';
      ctx.beginPath();ctx.arc(this.x+3,this.y+3,6*(1-this.explodeT/10)+3,0,7);ctx.fill();
      ctx.globalAlpha=1;return;
    }
    ctx.drawImage(ART.I.fireball[Math.floor(f/4)%2],this.x-1,this.y-1,9,9);
  }
}

class Player{
  constructor(x,y){

    this.growT=0;this.growMode='';
    this.pipeT=null;
    this.flagPhase=null;

      A.sfx('power');
    }
    G.addScore(1000,this.x,this.y);
  }
  getStar(){
    this.starT=CFG.STAR_TIME;
    A.sfx('power');
    A.playMusic('star');
    G.addScore(1000,this.x,this.y);
  }
  update(G){
    if(this.growT>0){
      this.growT--;
      if(this.growT===0){
        if(this.growMode==='grow')this.setForm(1);
        else if(this.growMode==='fire')this.setForm(2);
        this.growMode='';
      }
      return;
    }
    if(this.dead){
      this.deadT++;
      if(this.deadT>14){
        this.vy=Math.min(this.vy+.4,7);
        this.y+=this.vy;
      }
      return;
    }
    if(this.pipeT){
      const pt=this.pipeT;
      pt.t++;
      if(pt.phase==='in'){
        this.y+=.8;
        if(pt.t>=30)G.finishPipeIn();
      }else{
        this.y-=.75;
        if(pt.t>=32){ this.pipeT=null; this.y=pt.standY; }
      }
      return;
    }
    if(this.flagPhase){
      if(this.flagPhase==='slide'){
        this.y+=2.1;
        const baseY=(SR)*16-this.h;
        if(this.y>=baseY){
          this.y=baseY;
          this.flagPhase='hop';
          this.hopT=10;
        }
        return;
      }
      if(this.flagPhase==='hop'){
        this.hopT--;
        this.vy=-2.4;this.y+=this.vy;
        this.x+=1;
        if(this.hopT<=0)this.flagPhase='walkoff';
        return;
      }
      if(this.flagPhase==='walkoff'){
        this.vx=1.15;
        this.animDist+=Math.abs(this.vx);
        this.x+=this.vx;
        this.vy=Math.min(this.vy+.46,CFG.MAX_FALL);
        moveAndCollide(this,G.area());
        if(!G.walkedOff&&this.x>G.castleDoorX){
          G.walkedOff=true;
          this.hidden=true;
          G.startClear();
        }
        return;
      }
    }

    const K=INP.keys,J=INP.just;

    const wantCrouch=K.down&&this.form>0&&this.onGround;
    this.crouch=wantCrouch;

    let ax=0;
    const L=K.left,R=K.right;
    if(L&&!R&&!this.crouch)ax=-1;
    if(R&&!L&&!this.crouch)ax=1;

    const maxSpd=K.run?CFG.MAX_RUN:CFG.MAX_WALK;
    const acc=K.run?CFG.ACC_RUN:CFG.ACC_WALK;

    this.skid=false;
    if(ax!==0){
      if(Math.sign(this.vx)===-ax&&Math.abs(this.vx)>.35){
        this.vx=U.approach(this.vx,0,CFG.SKID);
        this.skid=true;
        if(this.onGround&&Math.floor(G.tick%5)===0)
          G.puff(this.x+this.w/2,this.y+this.h-2,false);
      }else{
        this.vx=U.approach(this.vx,ax*maxSpd,acc);
      }
      this.face=ax;
    }else{
      if(this.onGround)this.vx=U.approach(this.vx,0,CFG.FRICTION);
    }

    if(J.jump)this.jbuf=CFG.JBUF;
    else if(this.jbuf>0)this.jbuf--;

    if(K.jump&&this.vy<0)this.jumpHeld=true;
    else if(!K.jump){
      if(this.jumpHeld&&this.vy<CFG.JUMP_CUT)this.vy=CFG.JUMP_CUT;
      this.jumpHeld=false;
    }

    if(this.jbuf>0&&(this.onGround||this.coyote>0)){
      this.doJump(G);
    }

    const g=(this.vy<0&&this.jumpHeld)?CFG.GRAV_HOLD:CFG.GRAV;
    this.vy=Math.min(this.vy+g,CFG.MAX_FALL);

    const wasGround=this.onGround;
    const fallV=this.vy;
    this.prevBot=this.y+this.h;
    moveAndCollide(this,G.area(),{player:true});
    if(this.hitHead&&this.headCell)G.bumpBlock(this.headCell.c,this.headCell.r);

    for(const mv of G.movers){
      const top=mv.y;
      if(this.vy>=0&&this.x+this.w>mv.x&&this.x<mv.x+mv.w&&
         this.prevBot<=top+Math.max(2,mv.dy+1)&&this.y+this.h>=top&&this.y+this.h<=top+10){
        this.y=top-this.h;this.vy=0;this.onGround=true;
        this.x+=mv.dx;this.y+=mv.dy;
      }
    }

    if(this.onGround){
      this.coyote=CFG.COYOTE;this.combo=0;
      if(!wasGround&&fallV>3.4){
        G.puff(this.x+this.w/2,this.y+this.h,true);
        this.landT=9;
      }
    }else if(this.coyote>0)this.coyote--;

    if(this.x<0){this.x=0;this.vx=0;}
    if(this.x+this.w>G.pxW()){this.x=G.pxW()-this.w;this.vx=0;}

    if(this.y>CFG.ROWS*16+28){ this.die(); return; }
    const lavaRow=Math.floor((this.y+this.h-2)/16);
    const lavaL=entTileAt(G.area(),Math.floor((this.x+2)/16),lavaRow);
    const lavaR=entTileAt(G.area(),Math.floor((this.x+this.w-2)/16),lavaRow);
    if(lavaL===TL.LAVA_T||lavaL===TL.LAVA_B||lavaR===TL.LAVA_T||lavaR===TL.LAVA_B){ this.starT=0; this.die(); return; }

    if(this.starT>0){
      this.starT--;
      if(this.starT===0)A.playMusic(G.curMusic());
      if(this.starT>0&&this.starT%4===0)
        G.sparkle(this.x+U.rand(0,this.w),this.y+U.rand(0,this.h),'#fff2b0');
    }
    if(this.invT>0)this.invT--;
    if(this.landT>0)this.landT--;
    if(this.stretchT>0)this.stretchT--;
    if(this.throwCd>0)this.throwCd--;
    if(this.throwT>0)this.throwT--;

    if(J.run&&this.form===2&&this.fireCount()<CFG.FIRE_MAX&&this.throwCd<=0){
      G.spawnFireball(this);
      this.throwT=9;this.throwCd=13;
    }
    this.fireHeldPrev=K.run;

    this.animDist+=Math.abs(this.vx)*(this.onGround?1:.4);
  }
  fireCount(){ return G.ents.filter(e=>e.type==='fireball'&&e.explodeT<=0).length; }
  poseName(){
    if(this.dead)return ['dead','small'];
    if(this.growT>0){
      const flipPhase=Math.floor(this.growT/5)%2===0;
      if(this.growMode==='grow')return flipPhase?['idle','small']:['idle','big'];
      if(this.growMode==='shrink')return flipPhase?['idle','small']:['idle','big'];
      if(this.growMode==='fire')return flipPhase?['idle','big']:['idle','fire'];
    }
    if(this.pipeT)return ['jump',this.form>0?'big':'small'];
    if(this.flagPhase==='slide')return ['skid',this.form>0?'big':'small'];
    if(this.flagPhase==='hop'||this.flagPhase==='walkoff'){
      const moving=this.flagPhase==='walkoff';
      if(moving){
        const fi=Math.floor(this.animDist/7)%3;
        return [['walk1','walk2','walk3'][fi],this.form>0?'big':'small'];
      }
      return ['jump',this.form>0?'big':'small'];
    }
    if(this.crouch)return ['crouch','big'];
    if(!this.onGround)return ['jump',this.form>0?'big':'small'];
    if(this.skid)return ['skid',this.form>0?'big':'small'];
    if(Math.abs(this.vx)>.18){
      const fi=Math.floor(this.animDist/7)%3;
      return [['walk1','walk2','walk3'][fi],this.form>0?'big':'small'];
    }
    return ['idle',this.form>0?'big':'small'];
  }
  palName(){
    if(this.starT>0){
      const seq=['norm','st1','st2','st1'];
      return seq[Math.floor(G.tick/3)%seq.length];
    }
    if(this.form===2&&!(this.growT>0&&this.growMode==='shrink'))return 'fire';
    if(this.growT>0&&this.growMode==='fire'&&Math.floor(this.growT/5)%2)return 'fire';
    return 'norm';
  }
  draw(ctx,f){
    if(this.hidden)return;
    if(this.invT>0&&!this.dead&&Math.floor(f/3)%2)return;
    const [pose,sizeKey]=this.poseName();
    const pk=this.palName();
    const key=sizeKey==='fire'?'big_'+pose+'_'+(pk==='fire'?'fire':pk):sizeKey+'_'+pose+'_'+pk;
    const img=ART.H[key]||ART.H[sizeKey+'_'+pose+'_norm']||ART.H['small_idle_norm'];
    const dw=img.width/ART.SS,dh=img.height/ART.SS;
    const cx=this.x+this.w/2;
    const ox=cx-dw/2+(dw>this.w+2?-this.face*0.5:0);
    const oy=this.y+this.h-dh+1;
    let sy=1,sx=1;
    if(this.landT>0){const k=this.landT/9;sy=1-.14*k;sx=1+.10*k;}
    else if(this.stretchT>0&&!this.onGround){const k=this.stretchT/9;sy=1+.10*k;sx=1-.08*k;}
    ctx.save();
    if(this.face<0){
      ctx.translate(cx*2,0);ctx.scale(-1,1);
    }
    if(sx!==1||sy!==1){
      ctx.translate(cx,this.y+this.h);
      ctx.scale(sx,sy);
      ctx.translate(-cx,-(this.y+this.h));
    }
    ctx.drawImage(img,this.face<0?(cx-dw/2):ox,oy,dw,dh);
    ctx.restore();
  }
}
const G={
  state:'boot',paused:false,tick:0,
  canvas:null,ctx:null,dpr:1,Z:2,offX:0,offY:0,
  viewW:420,viewH:CFG.VIEW_H,
  cssW:800,cssH:450,
  levelIdx:0,lives:3,score:0,coins:0,hiscore:0,unlocked:1,
  player:null,level:null,areas:[],warps:[],curArea:0,
  ents:[],fx:[],movers:[],bumpAnims:new Map(),
  cam:{x:0},
  timeLeft:300,timeAcc:0,warned:false,
  freeze:0,shakeT:0,
  cpReached:false,flagAnim:0,walkedOff:false,castleDoorX:0,
  cardT:0,clearT:0,menuSel:0,pickLevel:0,howOpen:false,fadeA:1,fadeDir:-1,fadeCb:null,
  overT:0,titleCam:0,

  init(){
    this.canvas=document.getElementById('cv');
    this.ctx=this.canvas.getContext('2d');
    try{
      this.hiscore=parseInt(localStorage.getItem('spl_hi')||'0')||0;
      this.unlocked=Math.max(1,parseInt(localStorage.getItem('spl_unlock')||'1')||1);
    }catch(e){}
    addEventListener('resize',()=>this.resize());
    this.resize();
    ART.build();
    INP.init();
    this.state='title';
    A.unlock();
  },

  resize(){
    this.dpr=Math.min(devicePixelRatio||1,2);
    this.cssW=innerWidth;this.cssH=innerHeight;
    this.canvas.width=Math.floor(this.cssW*this.dpr);
    this.canvas.height=Math.floor(this.cssH*this.dpr);
    this.canvas.style.width=this.cssW+'px';
    this.canvas.style.height=this.cssH+'px';
    const z=Math.min(this.cssW/this.viewW,this.cssH/this.viewH);
    this.Z=z;
    this.offX=(this.cssW-this.viewW*z)/2;
    this.offY=(this.cssH-this.viewH*z)/2;
  },

  saveHi(){
    if(this.score>this.hiscore){
      this.hiscore=this.score;
      try{localStorage.setItem('spl_hi',String(this.hiscore));}catch(e){}
    }
  },
  unlockNext(){
    if(this.levelIdx+2>this.unlocked){
      this.unlocked=Math.min(LV.defs.length,this.levelIdx+2);
      try{localStorage.setItem('spl_unlock',String(this.unlocked));}catch(e){}
    }
  },

  newGame(){
    this.lives=3;this.score=0;this.coins=0;this.cpReached=false;
    this.loadLevel(this.pickLevel);
  },
  loadLevel(i,respawn){
    this.levelIdx=i;
    this.level=LV.build(i);
    this.areas=this.level.areas;
    this.warps=this.level.warps;
    this.curArea=0;
    this.timeLeft=this.level.time;this.timeAcc=0;this.warned=false;
    this.ents=[];this.fx=[];this.movers=[];this.bumpAnims.clear();this.multiLeft.clear();
    const ar=this.areas[0];
    for(const s of ar.spawns)this.spawnEnt(s);
    if(respawn&&this.cpReached&&ar.cpX>0){
      this.player=new Player(ar.cpX,(SR-2)*PX-14);
      this.cam.x=U.clamp(ar.cpX-this.viewW*.38,0,this.pxW()-this.viewW);
    }else{
      this.cpReached=false;
      this.player=new Player(40,(SR-2)*PX-14);
      this.cam.x=0;
    }
    this.walkedOff=false;
    this.state='card';this.cardT=0;
    A.stopMusic();A.tempoMult=1;
  },
  spawnEnt(s){
    if(s.t==='goomba')this.ents.push(new Goomba(s.x,s.y));
    else if(s.t==='koopa')this.ents.push(new Koopa(s.x,s.y,false));
    else if(s.t==='para')this.ents.push(new Koopa(s.x,s.y,true));
    else if(s.t==='plant')this.ents.push(new Plant(s.x,s.y));
    else if(s.t==='coin')this.ents.push(new StaticCoin(s.x,s.y));
    else if(s.t==='mover'){
      const m=new Mover(s.x,s.y,s);this.movers.push(m);
    }
    else if(s.t==='firebar'){
      this.ents.push(new FireBar(s.x+8,s.y+8,s));
    }
  },

  area(a){ return this.areas[a===undefined?this.curArea:a]; },
  grid(){ return this.area().grid; },
  pxW(a){ return (this.area(a).cols)*PX; },
  curMusic(){ return LV.defs[this.levelIdx].music; },
  theme(){ return LV.defs[this.levelIdx].theme; },

  step(){
    INP.pollGamepad();
    this.update();
    INP.endFrame();
  },

  update(){
    this.tick++;
    if(INP.press('mute')){ A.toggleMute(); }
    switch(this.state){
      case 'title': this.upTitle(); break;
      case 'card': this.upCard(); break;
      case 'play': this.upPlay(); break;
      case 'clear': this.upClear(); break;
      case 'gameover':
        this.overT++;
        if(this.overT>40&&(INP.press('confirm')||INP.press('pause'))){ A.sfx('select'); this.toTitle(); }
        break;
      case 'win':
        this.winFx();
        for(const f of this.fx)f.update(this);
        this.fx=this.fx.filter(f=>!f.remove);
        if(INP.press('confirm')){ A.sfx('select'); this.toTitle(); }
        break;
    }
    if(this.fadeDir!==0){
      this.fadeA+=this.fadeDir*.05;
      if(this.fadeA<=0){this.fadeA=0;this.fadeDir=0;}
      else if(this.fadeA>=1){this.fadeA=1;if(this.fadeCb){const cb=this.fadeCb;this.fadeCb=null;cb.call(this);}}
    }
  },
  fadeOut(cb){ this.fadeDir=1;this.fadeCb=cb; },
  fadeIn(){ this.fadeDir=-1; },
  toTitle(){ this.state='title';this.menuSel=0;A.stopMusic();this.fadeIn(); },

  upTitle(){
    this.titleCam+=.6;
    const n=this.unlocked>1?3:2;
    if(INP.just.up){ this.menuSel=(this.menuSel+n-1)%n; A.sfx('select'); }
    if(INP.just.down){ this.menuSel=(this.menuSel+1)%n; A.sfx('select'); }
    if(this.menuSel===2){
      if(INP.just.left){ this.pickLevel=Math.max(0,this.pickLevel-1);A.sfx('select'); }
      if(INP.just.right){ this.pickLevel=Math.min(this.unlocked-1,this.pickLevel+1);A.sfx('select'); }
    }
    if(this.howOpen){
      if(INP.press('confirm')||INP.press('pause')){ this.howOpen=false;A.sfx('select'); }
      return;
    }
    if(INP.press('confirm')){
      if(this.menuSel===1){ this.howOpen=true;A.sfx('select'); }
      else{
        A.sfx('select');
        this.fadeOut(()=>this.newGame());
      }
    }
  },
  upCard(){
    this.cardT++;
    if(this.cardT>90){
      this.state='play';
      A.playMusic(this.curMusic());
      this.fadeIn();
    }
  },

  upPlay(){
    if(INP.press('pause')){
      this.paused=!this.paused;
      A.sfx('pauseBlip');
      if(this.paused)A.pauseMusic();else A.resumeMusic();
    }
    if(this.paused)return;
    if(this.freeze>0){ this.freeze--; this.player.update(this); return; }
    for(const m of this.movers)m.update(this);
    const ar=this.area();
    if(!this.cpReached&&ar.cpX>0&&this.player.x>ar.cpX&&!this.player.dead){
      this.cpReached=true;
      this.sparkle(this.player.x+5,this.player.y-4,'#7ee3ff');
      A.sfx('select');
    }
    this.tryPipeEnter();
    this.player.update(this);
    this.checkFlagGrab();
    for(const e of this.ents)e.update(this);
    this.collidePlayer();
    for(const e of this.ents)if(e.remove)e.gone=true;
    this.ents=this.ents.filter(e=>!e.gone);
    for(const f of this.fx)f.update(this);
    this.fx=this.fx.filter(f=>!f.remove);
    for(const b of this.bumpAnims.values()){
      b.t++;
    }
    for(const [k,b] of this.bumpAnims)if(b.t>12)this.bumpAnims.delete(k);
    this.camera();
    this.timerTick();
    if(this.player.dead&&this.player.deadT>150&&this.player.y>this.viewH+80)this.afterDeath();
  },

  afterDeath(){
    this.lives--;
    this.saveHi();
    if(this.lives<0){
      this.state='gameover';this.overT=0;
      A.jGameOver();
    }else{
      this.loadLevel(this.levelIdx,true);
    }
  },

  timerTick(){
    this.timeAcc++;
    if(this.timeAcc>=CFG.TICK_FRAMES){
      this.timeAcc=0;
      this.timeLeft--;
      if(this.timeLeft===100&&!this.warned){ this.warned=true;A.jWarning();A.tempoMult=1.28; }
      if(this.timeLeft<=0){ this.timeLeft=0;this.player.die(); }
    }
  },

  camera(){
    const p=this.player;
    const maxX=this.pxW()-this.viewW;
    let target=p.x-this.viewW*.38;
    target=U.clamp(target,0,Math.max(0,maxX));
    if(p.flagPhase==='walkoff'||p.flagPhase==='hop'){
      target=U.clamp(target,Math.min(this.cam.x,maxX),maxX);
    }
    this.cam.x+=(target-this.cam.x)*.16;
    if(Math.abs(target-this.cam.x)<.4)this.cam.x=target;
    this.cam.x=U.clamp(this.cam.x,0,Math.max(0,maxX));
  },

  collidePlayer(){
    const p=this.player;
    if(p.dead||p.pipeT)return;
    for(const f of this.ents){
      if(f instanceof Foe){
        if(!f.active||f.dead&&f.flip||f.squashT>0)continue;
        if(f instanceof Plant&&f.emerge<=.25)continue;
        if(!U.aabb({x:p.x+1,y:p.y,w:p.w-2,h:p.h},f))continue;
        if(p.starT>0){
          f.flipDie(this,p.face,200);
          continue;
        }
        const stomping=p.vy>0&&p.prevBot<=f.y+f.h*.55;
        if(stomping){
          const res=f.onStomp(this,p.combo);
          if(res!==null&&res!==undefined){
            const held=INP.keys.jump;
            p.bounce(held?CFG.STOMP_BOUNCE_HI:res||CFG.STOMP_BOUNCE);
            p.combo++;
            this.puff(p.x+p.w/2,f.y,false);
          }else{
            f.onTouch(this,p);
          }
        }else{
          f.onTouch(this,p);
        }
      }else if(f.type==='item'){
        if(!U.aabb({x:p.x,y:p.y,w:p.w,h:p.h},{x:f.x,y:f.y,w:f.w,h:f.h}))continue;
        if(f.emergeT>10)continue;
        f.collect(this);
      }
    }
  },

  shellVsFoes(shell){
    if(shell.chain===undefined)shell.chain=0;
    for(const f of this.ents){
      if(f===shell||!(f instanceof Foe))continue;
      if(f.dead&&f.flip)continue;
      if(f.squashT>0)continue;
      if(f instanceof Plant&&f.emerge<=.25)continue;
      if(!U.aabb(shell,{x:f.x,y:f.y,w:f.w,h:f.h}))continue;
      const tbl=[400,800,1000,2000,4000,8000];
      if(shell.chain<tbl.length){
        this.addScore(tbl[shell.chain],f.x,f.y);
      }else{
        this.addLife();
      }
      shell.chain++;
      f.flipDie(this,Math.sign(shell.vx)||1,null);
    }
  },

  bumpBlock(c,r){
    const t=entTileAt(this.area(),c,r);
    const key=c+','+r;
    if(t===TL.Q_COIN){
      this.setTile(c,r,TL.USED);
      this.bumpAnims.set(key,{c,r,t:0});
      const cp=new CoinPop(c*16+1,(r-1)*16);
      this.ents.push(cp);
      this.getCoin(c*16,r*16);
      A.sfx('coin');
      return;
    }
    if(t===TL.Q_POWER){
      this.setTile(c,r,TL.USED);
      this.bumpAnims.set(key,{c,r,t:0});
      A.sfx('itemRise');
      if(this.player.form===0)
        this.ents.push(new Shroom(c*16+1,r*16));
      else
        this.ents.push(new Flower(c*16+1,r*16));
      return;
    }
    if(t===TL.Q_STAR){
      this.setTile(c,r,TL.USED);
      this.bumpAnims.set(key,{c,r,t:0});
      A.sfx('itemRise');
      this.ents.push(new StarItm(c*16+1,r*16));
      return;
    }
    if(t===TL.BRICK_COIN){
      let left=6;
      if(this.multiLeft.has(key))left=this.multiLeft.get(key);
      left--;
      this.multiLeft.set(key,left);
      const cp=new CoinPop(c*16+1,(r-1)*16);
      this.ents.push(cp);
      this.getCoin(c*16,r*16);
      A.sfx('coin');
      this.bumpAnims.set(key,{c,r,t:0});
      if(left<=0)this.setTile(c,r,TL.USED);
      return;
    }
    if(t===TL.HIDDEN){
      this.setTile(c,r,TL.USED);
      this.bumpAnims.set(key,{c,r,t:0});
      A.sfx('itemRise');
      this.ents.push(new Shroom(c*16+1,r*16,true));
      return;
    }
    if(t===TL.BRICK){
      if(this.player.form>0){
        this.setTile(c,r,TL.EMPTY);
        A.sfx('breakBlock');
        this.addScore(50,null);
        this.shakeT=5;
        const cx=c*16+8,cy=r*16+8;
        for(const [vx,vy] of [[-1.4,-5],[1.4,-5],[-.9,-2.6],[.9,-2.6]])
          this.fx.push(new Debris(cx,cy,vx,vy));
        this.killOnTop(c,r);
      }else{
        this.bumpAnims.set(key,{c,r,t:0});
        A.sfx('bump');

      return;
    }
    A.sfx('bump');
  },
  multiLeft:new Map(),
  setTile(c,r,t){
    const ar=this.area();
    if(c>=0&&c<ar.cols&&r>=0&&r<ar.rows)ar.grid[r*ar.cols+c]=t;
  },
  killOnTop(c,r){
    const box={x:c*16,y:(r-1)*16,w:16,h:16};
    for(const f of this.ents){
      if(!(f instanceof Foe))continue;
      if(f.dead&&f.flip)continue;
      if(U.aabb(box,{x:f.x,y:f.y,w:f.w,h:f.h})){
        f.flipDie(this,1,100);
        this.addScore(100,f.x,f.y);
      }
    }
  },

  getCoin(x,y){
    this.coins++;
    this.addScore(200,null);
    this.sparkle(x+7,y,'#fff2b0');
    A.sfx('coin');
    if(this.coins>=100){
      this.coins-=100;
      this.addLife();
    }
  },
  addScore(n,x,y){
    this.score+=n;
    if(x!=null)this.popScore(x,y,String(n));
    this.saveHi();
  },
  popScore(x,y,txt){ this.fx.push(new ScorePop(x,y,txt)); },
  addLife(){
    this.lives++;
    A.jOneUp();
    this.popScore(this.player?this.player.x:this.cam.x+100,this.player?this.player.y-10:120,'1UP');
  },
  puff(x,y,big){ this.fx.push(new DustPuff(x,y,big)); },
  sparkle(x,y,c){ this.fx.push(new SparkleFx(x,y,c)); },
  spawnFireball(p){
    const fx=p.face>0?p.x+p.w:p.x-7;
    const fy=p.form>0?p.y+6:p.y+4;
    this.ents.push(new FireBallEnt(fx,fy,p.face));
    A.sfx('fire');
  },

  tryPipeEnter(){
    const p=this.player;
    if(!p.onGround||!INP.keys.down||p.pipeT)return;
    const feetR=Math.floor((p.y+p.h+1)/16);
    const cx=p.x+p.w/2;
    const warps=this.warps.filter(w=>w.a===this.curArea);
    for(const w of warps){
      if(w.row!==feetR)continue;
      if(cx>w.col*16+3&&cx<w.col*16+29){
        p.vx=0;p.vy=0;p.crouch=false;
        p.pipeT={phase:'in',t:0,warp:w};
        A.sfx('pipe');
        return;
      }
    }
  },
  finishPipeIn(){
    const p=this.player;
    const dest=p.pipeT.warp.dest;
    this.curArea=dest.a;
    const ar=this.area();
    this.ents=[];
    this.movers=[];
    this.fx=[];
    this.bumpAnims.clear();
    for(const s of ar.spawns)this.spawnEnt(s);
    if(dest.mode==='drop'){
      p.x=dest.x-p.w/2;
      p.y=-30;
      p.vy=0;p.pipeT=null;
      this.cam.x=U.clamp(p.x-this.viewW*.38,0,Math.max(0,this.pxW()-this.viewW));
    }else{
      p.x=dest.x-p.w/2;
      p.y=dest.y+16;
      p.vy=0;
      p.pipeT={phase:'out',t:0,standY:dest.y-p.h};
      this.cam.x=U.clamp(p.x-this.viewW*.38,0,Math.max(0,this.pxW()-this.viewW));
      A.sfx('pipe');
    }
  },

  checkFlagGrab(){
    const p=this.player;
    if(p.dead||p.flagPhase||p.pipeT)return;
    const fc=this.area().flagCol;
    if(!fc)return;
    const poleX=fc*16;
    if(p.x+p.w>poleX+5&&p.x<poleX+12){
      p.flagPhase='slide';
      p.x=poleX-9;
      p.vx=0;p.vy=0;p.face=1;
      const hAbove=(SR)*16-(p.y+p.h);
      let pts=100;
      if(hAbove>=110)pts=5000;else if(hAbove>=80)pts=2000;
      else if(hAbove>=52)pts=800;else if(hAbove>=26)pts=400;
      this.addScore(pts,p.x,p.y-8);
      A.stopMusic();
      A.sfx('flagpole');
      const cc=this.area().castleCol;
      this.castleDoorX=cc*16+34;
    }
  },

  startClear(){
    this.state='clear';
    this.clearT=0;
    this.tallyTime=this.timeLeft;
    this.fireDone=false;
    this.fwCount=-1;
    this.fwNext=0;
    A.stopMusic();
    A.jClear();
    this.saveHi();
    this.unlockNext();
  },
  upClear(){
    this.clearT++;
    for(const f of this.fx)f.update(this);
    this.fx=this.fx.filter(f=>!f.remove);
    const t=this.clearT;
    if(t>60&&this.timeLeft>0){
      const drain=Math.min(3,this.timeLeft);
      this.timeLeft-=drain;
      this.score+=drain*50;
      if(t%5===0)A.sfx('tick');
      return;
    }
    if(t>60&&this.timeLeft<=0&&this.fwCount<0){
      const lastDigit=this.tallyTime%10;
      this.fwCount=[1,3,6].includes(lastDigit)?lastDigit:0;
      this.fwNext=t+20;
      if(this.fwCount===0)this.fwNext=t;
    }
    if(this.fwCount>0&&t>=this.fwNext){
      const cc=this.area().castleCol;
      this.firework(cc*16+40+U.rand(-30,30),60+U.rand(-20,20));
      this.fwCount--;this.fwNext=t+26;
      A.sfx('fireworkBoom');
    }
    if(this.fwCount===0&&t>this.fwNext+60){
      this.advanceLevel();
    }
  },
  firework(x,y){
    const cols=['#ff5a5a','#ffd94a','#7ee36a','#59c8f2','#c77dff'];
    const c=cols[U.randi(0,cols.length-1)];
    for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2,sp=U.rand(.8,1.8);
      this.fx.push(new FwSpark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,c));
    }
  },
  advanceLevel(){
    if(this.levelIdx+1<LV.defs.length){
      this.fadeDir=1;
      this.fadeCb=()=>{ this.cpReached=false; this.loadLevel(this.levelIdx+1); };
    }else{
      this.state='win';
      this.fadeA=1;this.fadeDir=-1;
    }
  },
  winFx(){
    if(this.tick%50===0){
      const x=U.rand(60,this.viewW-60),y=U.rand(40,140);
      this.firework(x,y);
      A.sfx('fireworkBoom');
    }
  },

  render(){ RND.draw(this); }
};

class FwSpark{
  constructor(x,y,vx,vy,c){
    this.type='fw';this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.c=c;this.t=0;this.remove=false;
  }
  update(G){
    this.t++;this.x+=this.vx;this.y+=this.vy;this.vy+=.04;
    if(this.t>46)this.remove=true;
  }
  draw(ctx){
    ctx.globalAlpha=Math.max(0,1-this.t/46);
    ctx.fillStyle=this.c;
    ctx.fillRect(this.x-1.5,this.y-1.5,3,3);
    ctx.globalAlpha=1;
  }
}
const RND={
  skyCache:new Map(),
  vig:null,

  draw(G){
    const ctx=G.ctx,dpr=G.dpr,dz=G.Z*dpr;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,G.canvas.width,G.canvas.height);
    if(G.state==='title'){ this.title(G,ctx); this.fade(G,ctx); return; }
    if(G.state==='card'){ this.card(G,ctx); this.fade(G,ctx); return; }
    if(G.state==='gameover'){ this.gameover(G,ctx); this.fade(G,ctx); return; }
    if(G.state==='win'){ this.win(G,ctx); this.fade(G,ctx); return; }

    let sx=0,sy=0;
    if(G.shakeT>0){ G.shakeT--; sx=Math.sin(G.tick*1.7)*2; sy=Math.cos(G.tick*2.3)*1.5; }
    const camX=G.cam.x;

    ctx.setTransform(dpr,0,0,dpr,G.offX*dpr,G.offY*dpr);
    ctx.scale(G.Z,G.Z);
    this.sky(G,ctx);

    ctx.translate(-camX+sx,-sy);
    this.deco(G,ctx,camX);
    this.castleBack(G,ctx,camX);
    this.plants(G,ctx,camX);
    this.tiles(G,ctx,camX);
    this.movers(G,ctx,camX);
    this.ents(G,ctx,camX);
    this.player(G,ctx);
    this.fxLayer(G,ctx,camX);
    this.poleFlag(G,ctx,camX);

    ctx.setTransform(dpr,0,0,dpr,G.offX*dpr,G.offY*dpr);
    ctx.scale(G.Z,G.Z);
    this.vignette(G,ctx);
    this.hud(G,ctx);
    if(G.paused)this.pauseOv(G,ctx);
    ctx.setTransform(1,0,0,1,0,0);
    this.fade(G,ctx);
  },

  fade(G,ctx){
    if(G.fadeA>0){
      ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
      ctx.globalAlpha=Math.min(1,G.fadeA);
      ctx.fillStyle='#000';
      ctx.fillRect(0,0,G.cssW,G.cssH);
      ctx.globalAlpha=1;
    }
  },

  sky(G,ctx){
    const th=G.theme();
    let g=this.skyCache.get(th);
    if(!g){
      g=ctx.createLinearGradient(0,0,0,CFG.VIEW_H);
      const stops=ART.themes[th].sky;
      g.addColorStop(0,stops[0]);
      g.addColorStop(1,stops[1]);
      this.skyCache.set(th,g);
    }
    ctx.fillStyle=g;
    ctx.fillRect(-8,-8,G.viewW+16,CFG.VIEW_H+16);
  },

  stripW(G,ctx,img,f,y,alpha,camX){
    const w=img.width/ART.SS,h=img.height/ART.SS;
    const m=w;
    const n0=Math.floor((camX*f-m)/w),n1=Math.floor((camX*f+G.viewW+m)/w);
    if(alpha!==undefined)ctx.globalAlpha=alpha;
    for(let n=n0;n<=n1;n++){
      const wx=n*w+(1-f)*camX;
      ctx.drawImage(img,wx,y,w,h);
    }
    ctx.globalAlpha=1;
  },

  clouds(G,ctx,camX,tint){
    const drift=G.tick*.05;
    const span=170;
    for(let k=0;k<3;k++){
      const img=ART.B['cloud'+k];
      const s=k===1?1:(k===0?.8:.7);
      const y=16+k*20;
      const f=.22+.06*k;
      const dr=drift*(k+1)*.6;
      const m=span;
      const n0=Math.floor((camX*f+dr-m)/span),n1=Math.floor((camX*f+dr+G.viewW+m)/span);
      for(let n=n0;n<=n1;n++){
        const hx=U.hash(n*17+k*31);
        const wx=n*span+hx*(span-70)+(1-f)*camX-dr;
        ctx.drawImage(img,wx,y,img.width/ART.SS*s,img.height/ART.SS*s);
      }
    }
  },

  layerCells(G,camX,span,f,cb){
    const m=60;
    const n0=Math.floor((camX*f-m)/span),n1=Math.floor((camX*f+G.viewW+m)/span);
    for(let n=n0;n<=n1;n++) cb(n*span+(1-f)*camX,n);
  },

  deco(G,ctx,camX){
    const th=G.theme();
    const gy=(SR)*16;
    if(th==='day'){
      this.clouds(G,ctx,camX,null);
      this.stripW(G,ctx,ART.B.hills,.22,gy-62,.95,camX);
      this.stripW(G,ctx,ART.B.bush,.55,gy-26,undefined,camX);
    }else if(th==='cave'){
      this.stripW(G,ctx,ART.B.stalactites,.3,-4,1,camX);
      this.layerCells(G,camX,140,.45,(wx,n)=>{
        const hx=U.hash(n*53+7);
        const pulse=.5+.5*Math.sin(G.tick*.05+n*2);
        const y=gy-24-hx*30;
        ctx.globalAlpha=.3+.35*pulse;
        ctx.drawImage(ART.B.glowCool,wx-5,y-14,22,22);
        ctx.globalAlpha=.9;
        ctx.fillStyle='#7ee3ff';
        ctx.beginPath();
        ctx.moveTo(wx,y);ctx.lineTo(wx+3,y-7);ctx.lineTo(wx+6,y);
        ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;
      });
    }else if(th==='dusk'){
      ctx.globalAlpha=.9;
      ctx.drawImage(ART.B.glowWarm,camX+G.viewW*.72-46,6,92,92);
      ctx.globalAlpha=1;
      ctx.fillStyle='#ffd28a';
      ctx.beginPath();ctx.arc(camX+G.viewW*.72,52,13,0,7);ctx.fill();
      this.stripW(G,ctx,ART.B.mountains,.18,gy-108,.9,camX);
      this.clouds(G,ctx,camX,null);
    }else{
      this.layerCells(G,camX,120,.4,(wx,n)=>{
        const hx=U.hash(n*29+13);
        const flick=.5+.5*Math.sin(G.tick*.11+n*1.7);
        const y=30+hx*40;
        ctx.globalAlpha=.35+.4*flick;
        ctx.drawImage(ART.B.glowWarm,wx-14,y-14,28,28);
        ctx.globalAlpha=1;
        ctx.fillStyle='#ffcf7a';
        ctx.fillRect(wx-1.5,y-4,3,8);
      });
    }
  },

  castleBack(G,ctx,camX){
    const ar=G.area();
    const cc=ar.castleCol;
    if(!cc)return;
    ctx.drawImage(ART.B.castle,cc*16,SR*16-80,80,80);
  },

  plants(G,ctx,camX){
    for(const e of G.ents){
      if(e instanceof Plant&&e.x>camX-40&&e.x<camX+G.viewW+40)e.draw(ctx,G.tick);
    }
  },

  tiles(G,ctx,camX){
    const th=ART.TS[G.theme()];
    const ar=G.area();
    const c0=Math.max(0,Math.floor(camX/16)-1);
    const c1=Math.min(ar.cols-1,Math.ceil((camX+G.viewW)/16)+1);
    const qf=Math.floor(G.tick/9)%3;
    const lavaOff=Math.floor(G.tick/8)%2;
    for(let c=c0;c<=c1;c++){
      for(let r=0;r<ar.rows;r++){
        const t=ar.grid[r*ar.cols+c];
        if(!t||t===TL.HIDDEN)continue;
        let dy=0;
        const bk=G.bumpAnims.get(c+','+r);
        if(bk)dy=-Math.sin(Math.PI*bk.t/12)*6;
        const x=c*16,y=r*16+dy;
        switch(t){
          case TL.GTOP:
            ctx.drawImage(th[1],x,y);
            // 坑边警示：左右相邻为空（无底深坑）的地面，画黄黑警示条
            const gL=(c-1>=0)&&ar.grid[r*ar.cols+c-1]===TL.EMPTY;
            const gR=(c+1<ar.cols)&&ar.grid[r*ar.cols+c+1]===TL.EMPTY;
            if(gL||gR){
              const sx=(gL&&!gR)?x:(gR&&!gL)?x+11:x;
              const sw=(gL&&gR)?16:5;
              ctx.fillStyle='#ffd23a'; ctx.fillRect(sx,y,sw,4);
              ctx.fillStyle='#1a1a1a';
              for(let i=0;i<sw;i+=4) ctx.fillRect(sx+i,y,2,4);
              ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(sx,y+4,sw,1);
            }
            break;
          case TL.GFILL: ctx.drawImage(th[2],x,y);break;
          case TL.STONE: ctx.drawImage(th[3],x,y);break;
          case TL.BRICK: case TL.BRICK_COIN: ctx.drawImage(th[4],x,y);break;
          case TL.Q_COIN: case TL.Q_POWER: case TL.Q_STAR: ctx.drawImage(th.q[qf],x,y);break;
          case TL.USED: ctx.drawImage(th[9],x,y);break;
          case TL.PIPE_TL: ctx.drawImage(th[10],x,y);break;
          case TL.PIPE_TR: ctx.drawImage(th[11],x,y);break;
          case TL.PIPE_BL: ctx.drawImage(th[12],x,y);break;
          case TL.PIPE_BR: ctx.drawImage(th[13],x,y);break;
          case TL.PLAT: ctx.drawImage(th[14],x,y);break;
          case TL.POLE:
            ctx.fillStyle='#b9c2c9';ctx.fillRect(x+7,y,2,16);
            ctx.fillStyle='#eef2f5';ctx.fillRect(x+7,y,1,16);
            break;
          case TL.POLE_TOP:
            ctx.fillStyle='#b9c2c9';ctx.fillRect(x+7,y+6,2,10);
            ctx.fillStyle='#ffd23e';
            ctx.beginPath();ctx.arc(x+8,y+4,4,0,7);ctx.fill();
            ctx.fillStyle='#fff2b0';
            ctx.beginPath();ctx.arc(x+6.8,y+2.8,1.4,0,7);ctx.fill();
            break;
          case TL.LAVA_T:
            ctx.drawImage(th.lavaTop,x,y+(lavaOff?1:0));
            break;
          case TL.LAVA_B:
            ctx.drawImage(th.lavaBody,x,y);
            break;
        }
      }
    }
  },
  movers(G,ctx,camX){
    for(const m of G.movers){
      if(m.x+m.w<camX-40||m.x>camX+G.viewW+40)continue;
      m.draw(ctx,G.tick);
    }
  },

  ents(G,ctx,camX){
    for(const e of G.ents){
      if(e instanceof Plant)continue;
      if(e.x!==undefined&&(e.x+40<camX||e.x>camX+G.viewW+40)&&!(e instanceof FireBar))continue;
      e.draw(ctx,G.tick);
    }
  },

  player(G,ctx){
    const p=G.player;
    if(!p)return;
    p.draw(ctx,G.tick);
  },

  fxLayer(G,ctx,camX){
    for(const f of G.fx)f.draw(ctx);
  },

  poleFlag(G,ctx,camX){
    const ar=G.area();
    const fc=ar.flagCol;
    if(!fc)return;
    const p=G.player;
    let prog=0;
    if(p&&p.flagPhase==='slide'){
      prog=U.clamp(((p.y+p.h)-4*16)/((SR-1)*16-4*16-14),0,1);
      G.flagProg=prog;
    }else if(p&&(p.flagPhase==='hop'||p.flagPhase==='walkoff'))prog=1;
    else prog=G.flagProg||0;
    const fy=4*16+prog*((SR-1)*16-4*16-12);
    ctx.drawImage(ART.M.flag,fc*16-12,fy,13,10);
  },

  vignette(G,ctx){
    if(!this._vg){
      const vg=ctx.createRadialGradient(G.viewW/2,CFG.VIEW_H/2,CFG.VIEW_H*.55,G.viewW/2,CFG.VIEW_H/2,CFG.VIEW_H*.95);
      vg.addColorStop(0,'rgba(0,0,10,0)');
      vg.addColorStop(1,'rgba(0,0,20,.28)');
      this._vg=vg;
    }
    ctx.fillStyle=this._vg;
    ctx.fillRect(0,0,G.viewW,CFG.VIEW_H);
  },

  txt(ctx,s,x,y,size,color,align,bold){
    ctx.font=(bold?'bold ':'')+size+'px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign=align||'left';
    ctx.textBaseline='top';
    ctx.lineWidth=size>=10?3:2;
    ctx.strokeStyle='rgba(10,10,25,.85)';
    ctx.strokeText(s,x,y);
    ctx.fillStyle=color||'#fff';
    ctx.fillText(s,x,y);
  },

  hud(G,ctx){
    const th=G.theme();
    const dark=th==='cave'||th==='castle';
    const c1=dark?'#fff':'#fff';
    this.txt(ctx,'SCORE',8,5,6,'rgba(255,255,255,.75)');
    this.txt(ctx,U.pad(G.score,6),8,13,9,c1);
    ctx.drawImage(ART.I.coin[Math.floor(G.tick/7)%4],86,12,10,10);
    this.txt(ctx,'×'+U.pad(G.coins,2),97,13,9,c1);
    this.txt(ctx,'WORLD',150,5,6,'rgba(255,255,255,.75)');
    this.txt(ctx,LV.defs[G.levelIdx].name.split(' ')[0],152,13,9,c1);
    this.txt(ctx,'TIME',215,5,6,'rgba(255,255,255,.75)');
    const warn=G.timeLeft<=100&&Math.floor(G.tick/16)%2===0;
    this.txt(ctx,U.pad(Math.max(0,G.timeLeft),3),216,13,9,warn?'#ff6a5a':c1);
    ctx.drawImage(ART.H['small_idle_norm'],250,11,11,11);
    this.txt(ctx,'×'+Math.max(0,G.lives),262,13,9,c1);
    if(G.timeLeft<=100&&!G.warnedShown){}
  },

  pauseOv(G,ctx){
    ctx.fillStyle='rgba(8,10,25,.62)';
    ctx.fillRect(0,0,G.viewW,CFG.VIEW_H);
    this.txt(ctx,'PAUSED',G.viewW/2,92,20,'#fff','center',true);
    this.txt(ctx,'P 键继续 · M 键音效开关',G.viewW/2,124,8,'rgba(255,255,255,.85)','center');
  },

  card(G,ctx){
    ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
    const z=G.Z;
    ctx.translate(G.offX,G.offY);
    ctx.scale(z,z);
    this.txt(ctx,'WORLD '+LV.defs[G.levelIdx].name.split(' ')[0],G.viewW/2,86,16,'#fff','center',true);
    this.txt(ctx,LV.defs[G.levelIdx].name.split(' ').slice(1).join(' '),G.viewW/2,110,9,'rgba(255,255,255,.8)','center');
    ctx.drawImage(ART.H['small_idle_norm'],G.viewW/2-22,132,14,14);
    this.txt(ctx,'× '+G.lives,G.viewW/2+2,134,11,'#fff');
  },

  title(G,ctx){
    const dpr=G.dpr,dz=G.Z*dpr;
    ctx.setTransform(dz,0,0,dz,G.offX*dpr,G.offY*dpr);
    const savedTheme=G.theme?null:null;
    let g=this.skyCache.get('titleSky');
    if(!g){
      g=ctx.createLinearGradient(0,0,0,240);
      g.addColorStop(0,'#63b4f5');g.addColorStop(1,'#9fd8ff');
      this.skyCache.set('titleSky',g);
    }
    ctx.fillStyle=g;ctx.fillRect(-8,-8,G.viewW+16,256);
    const tc=G.titleCam;
    this.cloudsTitle(G,ctx,tc);
    this.tileStripT(ART.B.hills,.5,178,tc,ctx);
    this.tileStripT(ART.B.bush,1,214,tc,ctx);
    ctx.fillStyle=ART.themes.day.ground[2];
    ctx.fillRect(-8,224,G.viewW+16,32);
    ctx.fillStyle=ART.themes.day.ground[0];
    ctx.fillRect(-8,222,G.viewW+16,5);
    for(let i=0;i<5;i++){
      const gx=(i*97+tc*.9)%(G.viewW+80)-40;
      const fr=Math.floor(G.tick/7+i)%4;
      ctx.drawImage(ART.I.coin[fr],gx,120+(i%2)*18,13,13);
    }
    const gi=Math.floor(tc/2)%(G.viewW+120)-60;
    ctx.drawImage(Math.floor(G.tick/9)%2?ART.F.goombaA:ART.F.goombaB,gi,208,17,17);
    const bob=Math.sin(G.tick*.05)*2;
    ctx.save();
    ctx.translate(G.viewW*.78,196+bob);
    const hi=ART.H['big_idle_norm'];
    ctx.drawImage(hi,-8,-30,hi.width/ART.SS,hi.height/ART.SS);
    ctx.restore();

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.translate(G.offX,G.offY);
    ctx.scale(G.Z,G.Z);
    const cx=G.viewW/2;
    ctx.fillStyle='rgba(12,16,38,.42)';
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(cx-118,26,236,74,10);ctx.fill();}
    else ctx.fillRect(cx-118,26,236,74);
    this.txt(ctx,'SUPER MARIO',cx,38,21,'#ffe27a','center',true);
    this.txt(ctx,'超 级 像 素 大 陆',cx,68,12,'#fff','center');
    const items=['开 始 游 戏','操 作 说 明'];
    if(G.unlocked>1)items.push('选关 ◀ '+LV.defs[G.pickLevel].name.split(' ')[0]+' ▶');
    items.forEach((s,i)=>{
      const sel=G.menuSel===i;
      this.txt(ctx,(sel?'▶ ':'')+s,cx,118+i*17,sel?11:9,sel?'#ffe27a':'rgba(255,255,255,.82)','center',sel);
    });
    this.txt(ctx,'HI '+U.pad(G.hiscore,6),cx,180,8,'#ffd94a','center');
    this.txt(ctx,'方向键/WASD 移动 · K/空格 跳 · L/Shift 冲刺&火球 · 下蹲/进管 ↓',cx,204,6.5,'rgba(255,255,255,.75)','center');
    if(G.howOpen){
      ctx.fillStyle='rgba(8,10,25,.88)';
      ctx.fillRect(30,40,G.viewW-60,160);
      this.txt(ctx,'操 作 说 明',cx,52,13,'#ffe27a','center',true);
      const lines=[
        '←→/AD 移动      Z/J/空格/↑ 跳跃(长按跳更高)',
        'X/K/Shift 冲刺 · 火力状态发射火球',
        '↓ 下蹲 · 站在特定水管上按 ↓ 进入',
        '顶砖块获得金币和道具 · 蘑菇变大 ·',
        '火焰花发射火球 · 星星短暂无敌',
        '踩扁敌人 · 踢龟壳连击 · 集满100金币奖命',
        '',
        '按 Enter/Z 返回'
      ];
      lines.forEach((l,i)=>this.txt(ctx,l,cx,76+i*13,7.5,'#fff','center'));
    }
  },

  tileStripT(img,parallax,y,cam,ctx){
    const w=img.width/ART.SS;
    let ox=-((cam*parallax)%w);
    for(let x=ox;x<G.viewW+w;x+=w)ctx.drawImage(img,x,y,w,img.height/ART.SS);
  },
  cloudsTitle(G,ctx,tc){
    const span=300;
    for(let k=0;k<4;k++){
      const hx=U.hash(k*37+5);
      let x=(k*span+hx*200-tc*.3)%(span*3);
      if(x<-70)x+=span*3;
      const img=ART.B['cloud'+(k%3)];
      ctx.drawImage(img,x% (span*3),16+k*20,img.width/ART.SS,img.height/ART.SS);
    }
  },

  gameover(G,ctx){
    ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
    ctx.translate(G.offX,G.offY);
    ctx.scale(G.Z,G.Z);
    this.txt(ctx,'GAME OVER',G.viewW/2,92,22,'#ff6a5a','center',true);
    this.txt(ctx,'得分 '+U.pad(G.score,6)+'   金币 ×'+G.coins,G.viewW/2,128,9,'#fff','center');
    if(G.overT>40){
      if(Math.floor(G.tick/22)%2===0)
        this.txt(ctx,'按 Enter 返回标题',G.viewW/2,156,8,'rgba(255,255,255,.85)','center');
    }
  },

  win(G,ctx){
    ctx.setTransform(dzSafe(G),0,0,dzSafe(G),G.offX*G.dpr,G.offY*G.dpr);
    let g=this.skyCache.get('winSky');
    if(!g){
      g=ctx.createLinearGradient(0,0,0,240);
      g.addColorStop(0,'#1c1440');g.addColorStop(1,'#4a2058');
      this.skyCache.set('winSky',g);
    }
    ctx.fillStyle=g;ctx.fillRect(0,0,G.viewW,CFG.VIEW_H);
    for(const f of G.fx)f.draw(ctx);
    ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
    ctx.translate(G.offX,G.offY);
    ctx.scale(G.Z,G.Z);
    this.txt(ctx,'通 关 达 成 !',G.viewW/2,66,22,'#ffe27a','center',true);
    this.txt(ctx,'感谢游玩 SUPER MARIO',G.viewW/2,102,9,'#fff','center');
    this.txt(ctx,'最终得分 '+U.pad(G.score,6),G.viewW/2,126,10,'#ffd94a','center');
    this.txt(ctx,'金币 ×'+G.coins+'   剩余生命 ×'+Math.max(0,G.lives),G.viewW/2,146,8,'rgba(255,255,255,.85)','center');
    if(Math.floor(G.tick/22)%2===0)
      this.txt(ctx,'按 Enter 返回标题',G.viewW/2,176,8,'rgba(255,255,255,.85)','center');
    G.winFxTick=(G.winFxTick||0)+1;
  }
};
function dzSafe(G){return G.Z*G.dpr;}
(function(){
  let last=0,acc=0;
  function frame(t){
    requestAnimationFrame(frame);
    if(!last)last=t;
    let dt=t-last;last=t;
    if(dt>100)dt=100;
    acc+=dt;
    let n=0;
    while(acc>=CFG.STEP&&n<4){
      try{ G.step(); }catch(e){ console.error(e); }
      acc-=CFG.STEP;n++;
    }
    if(n===4)acc=0;
    try{ G.render(); }catch(e){ console.error(e); }
  }
  function boot(){
    G.init();
    requestAnimationFrame(frame);
  }
  window.__SPL={G,A,INP,LV,ART,U};
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
