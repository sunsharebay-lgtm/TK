<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="粉丝资源：视频里提到的网址、模板、口令与可复制资料集中展示。">
  <title>粉丝资源 · 创意空间</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: rgba(14, 23, 36, .86);
      --panel-strong: #111d2d;
      --ink: #edf4ff;
      --muted: #8da0b9;
      --line: rgba(139, 169, 208, .2);
      --cyan: #43e8ff;
      --amber: #ffb347;
      --green: #5ce08a;
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 560px at 78% -8%, rgba(37, 109, 145, .25), transparent 68%),
        radial-gradient(760px 520px at 12% 110%, rgba(200, 130, 60, .14), transparent 70%),
        linear-gradient(155deg, #0a111c 0%, var(--bg) 55%, #090d16 100%);
      overflow-x: hidden;
    }

    .shell {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: #061018;
      background: var(--cyan);
      clip-path: polygon(0 0, 100% 0, 100% 76%, 76% 100%, 0 100%);
      font-size: 11px;
      font-weight: 900;
    }

    .system-status {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, .6fr);
      gap: clamp(28px, 6vw, 64px);
      align-items: end;
      padding: clamp(30px, 6vw, 58px) 0 36px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--amber);
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 560px;
      margin: 0;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .hero-copy {
      max-width: 460px;
      margin: 14px 0 0;
      color: var(--muted);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.75;
    }

    .readout {
      padding: 16px 20px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(24, 42, 60, .86), rgba(9, 16, 27, .72));
    }

    .readout-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .readout-number {
      display: block;
      margin: 10px 0 6px;
      color: var(--cyan);
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
    }

    .readout-note {
      color: var(--ink);
      font-size: 11px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
    }

    .resources {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resource-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: border-color .2s ease, background .2s ease;
    }

    .resource-card:hover,
    .resource-card:focus-within {
      border-color: rgba(67, 232, 255, .72);
      background: var(--panel-strong);
    }

    .resource-number {
      flex: 0 0 auto;
      min-width: 28px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .resource-date {
      color: var(--amber);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .resource-main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .resource-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      letter-spacing: 0;
    }

    .resource-summary {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
    }

    .resource-open {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      flex: 0 0 auto;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-decoration: none;
      white-space: nowrap;
    }

    .resource-open:hover,
    .resource-open:focus-visible {
      color: var(--ink);
    }

    .resource-empty {
      padding: 20px;
      border: 1px dashed rgba(141, 160, 185, .28);
      color: var(--muted);
      text-align: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
    }

    .resource-tools { display: flex; align-items: end; gap: 12px; margin-bottom: 12px; }
    .search-field { display: flex; flex: 1; flex-direction: column; gap: 8px; min-width: 0; }
    .search-field label { color: var(--muted); font-size: 12px; }
    .search-field input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--ink); font: inherit; font-size: 16px; }
    .resource-action { padding: 10px 14px; border: 1px solid var(--cyan); background: var(--panel); color: var(--cyan); cursor: pointer; font: inherit; font-size: 12px; }
    .resource-status { margin: 12px 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 32px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--ink);
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        align-items: start;
      }
      .resource-main {
        flex-direction: column;
        gap: 2px;
      }
      .resource-title,
      .resource-summary {
        white-space: normal;
      }
      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 540px) {
      .resource-card { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; padding: 14px; }
      .resource-main { grid-column: 1 / -1; }
      .resource-open { grid-column: 1 / -1; justify-self: start; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
  <link rel="stylesheet" href="./styles/common.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../创意空间首页/" aria-label="返回创意空间首页">
        <span class="brand-mark">创</span>
        <span>创意空间 // CREATIVE SPACE</span>
      </a>
      <div class="system-status"><span aria-hidden="true">●</span>&nbsp;FAN RESOURCES</div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">粉丝资源 / Fan Resources</p>
        <h1 id="page-title">资料<br><span>一站直达</span></h1>
        <p class="hero-copy">视频里提到的网址、模板、口令和可复制文字，都会统一整理到这里。每条资源带固定编号，方便按号查找。</p>
      </div>
      <aside class="readout" aria-label="资源状态">
        <span class="readout-label">已收录资源</span>
        <strong class="readout-number" id="resource-count">—</strong>
        <span class="readout-note">持续整理中</span>
      </aside>
    </section>

    <section aria-labelledby="resources-title">
      <div class="section-heading">
        <h2 id="resources-title">全部资源 / ALL RESOURCES</h2>
        <p>点击进入完整资料页</p>
      </div>
      <div class="resource-tools" id="resource-tools" hidden>
        <div class="search-field" role="search">
          <label for="resource-search">查找资源</label>
          <input type="search" id="resource-search" placeholder="输入编号或关键词，例如 06、Codex" aria-controls="resources-grid" autocomplete="off">
        </div>
        <button class="resource-action" id="clear-search" type="button" hidden>清空搜索</button>
      </div>
      <p class="resource-status" id="resources-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">正在加载资源…</p>
      <button class="resource-action" id="retry-resources" type="button" hidden>重新加载</button>
      <div class="resources" id="resources-grid" aria-busy="true"></div>
      <noscript><p class="resource-empty">请启用 JavaScript 后查看资源目录；已收藏的资料页仍可直接打开和手动复制文字。</p></noscript>
    </section>

    <footer class="footer">
      <span>粉丝资源 · 创意空间</span>
      <a href="../创意空间首页/">返回创意空间首页 ↗</a>
    </footer>
  </main>
  <script src="./scripts/catalog.js"></script>
  <script src="./scripts/resources.js"></script>
</body>
</html>
