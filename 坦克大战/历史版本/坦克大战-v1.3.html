<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0a0e17">
<title>钢铁防线 · 坦克大战 v1.3</title>
<style>
/* ============================================================
   钢铁防线 — 现代化坦克大战
   单文件 / 无依赖 / Canvas + WebAudio
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#05070d; --bg1:#0a0e17; --bg2:#111726;
  --ink:#e8eef7; --ink-dim:#8fa0bd; --ink-faint:#54637f;
  --steel:#5f7593;
  --amber:#ffb347; --amber-hot:#ffd88a;
  --cyan:#43e8ff; --cyan-dim:#1b7f92;
  --red:#ff4d5e; --green:#5ce08a; --violet:#a78bfa;
  --line:rgba(140,170,215,.16);
  --glass:rgba(18,26,42,.72);
  --font: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg0)}
body{
  font-family:var(--font),"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 700px at 50% -10%, #16233c 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 110%, #1a1430 0%, transparent 55%),
    linear-gradient(180deg,#070b13 0%,#05070d 100%);
  touch-action:none;user-select:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
}
/* 背景网格 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.30;
  background-image:
    linear-gradient(rgba(120,170,230,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,170,230,.055) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 45%,#000 30%,transparent 100%);
}
/* 环境光斑 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 50% 50%, rgba(67,232,255,.05), transparent 70%);
}

#stage{position:relative;z-index:2;display:flex;align-items:center;justify-content:center}

/* ---------- 机柜外壳 ---------- */
#cabinet{
  position:relative;border-radius:20px;padding:14px;
  background:linear-gradient(165deg,#1b2437 0%,#0d1320 45%,#0a0f1a 100%);
  box-shadow:
    0 0 0 1px rgba(150,185,235,.14),
    0 0 0 6px rgba(8,12,20,.9),
    0 0 0 7px rgba(150,185,235,.08),
    0 40px 90px -20px rgba(0,0,0,.9),
    0 0 130px -30px rgba(67,232,255,.28),
    inset 0 1px 0 rgba(255,255,255,.07);
}
/* 机柜螺丝 */
.screw{position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8ea3c4,#39435a 60%,#1b2231);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.6),0 1px 1px rgba(255,255,255,.06)}
.screw.tl{top:6px;left:6px}.screw.tr{top:6px;right:6px}
.screw.bl{bottom:6px;left:6px}.screw.br{bottom:6px;right:6px}

#screenwrap{
  position:relative;border-radius:12px;overflow:hidden;
  background:#04060b;
  box-shadow:inset 0 0 0 1px rgba(140,175,225,.18), inset 0 0 60px rgba(0,0,0,.85);
}
canvas#game{display:block;image-rendering:auto;background:#0b1018}

/* CRT 效果层 */
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
#fx.scan::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0px,rgba(0,0,0,.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;opacity:.55;
}
#fx::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 92% 88% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0;transition:opacity .09s linear}

/* ---------- 覆盖面板 ---------- */
.panel{
  position:absolute;inset:0;z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(12,18,32,.90),rgba(4,6,11,.97));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  padding:22px;gap:14px;animation:panelIn .3s cubic-bezier(.2,.9,.3,1);
}
.panel.on{display:flex}
@keyframes panelIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

.logo{line-height:1;letter-spacing:.10em;font-weight:800}
.logo .l1{
  display:block;font-size:13px;letter-spacing:.52em;color:var(--cyan);
  text-shadow:0 0 14px rgba(67,232,255,.6);margin-bottom:10px;
}
.logo .l2{
  display:block;font-size:46px;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 0%,#ffd88a 42%,#ff9d3c 70%,#c2571a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,160,60,.42));
}
.logo .l3{
  display:block;font-size:11px;letter-spacing:.40em;color:var(--ink-faint);margin-top:12px;
}
.tagline{font-size:11px;color:var(--ink-dim);letter-spacing:.22em}

.menu{display:flex;flex-direction:column;gap:8px;margin-top:6px;min-width:240px}
.mi{
  position:relative;padding:11px 18px;border-radius:10px;cursor:pointer;
  font-size:13px;letter-spacing:.18em;color:var(--ink-dim);
  border:1px solid var(--line);background:rgba(18,26,42,.5);
  transition:all .16s ease;display:flex;align-items:center;justify-content:center;gap:10px;
}
.mi:hover{color:var(--ink);border-color:rgba(67,232,255,.4);background:rgba(24,38,58,.7)}
.mi.sel{
  color:#06131a;font-weight:700;
  background:linear-gradient(180deg,#7ff0ff,#2ec7e6);
  border-color:#8ff5ff;
  box-shadow:0 0 24px rgba(67,232,255,.42), inset 0 1px 0 rgba(255,255,255,.6);
}
.mi.sel::before{content:"▶";position:absolute;left:12px;font-size:10px}
.mi small{opacity:.75;font-size:10px;letter-spacing:.1em}

.hint{font-size:10px;color:var(--ink-faint);letter-spacing:.16em;line-height:1.9}
.hint b{color:var(--cyan);font-weight:600}
kbd{
  display:inline-block;min-width:19px;padding:2px 6px;margin:0 1px;border-radius:5px;
  background:linear-gradient(180deg,#2b374d,#182234);color:#cfe0f7;
  border:1px solid rgba(150,185,235,.24);border-bottom-width:2px;
  font-size:10px;font-family:var(--font);
}

.bigmsg{font-size:34px;letter-spacing:.16em;font-weight:800}
.bigmsg.win{color:var(--green);text-shadow:0 0 30px rgba(92,224,138,.5)}
.bigmsg.lose{color:var(--red);text-shadow:0 0 30px rgba(255,77,94,.5)}

/* 战绩表 */
.score-table{
  display:grid;grid-template-columns:auto auto auto;gap:6px 18px;
  font-size:11px;color:var(--ink-dim);letter-spacing:.1em;
  background:rgba(10,16,28,.6);border:1px solid var(--line);border-radius:10px;padding:14px 20px;
}
.score-table .hd{color:var(--cyan);font-size:10px;letter-spacing:.2em}
.score-table .vv{color:var(--amber);text-align:right}
.score-table .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;color:var(--ink)}

/* 帮助表 */
.help-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;text-align:left;
  font-size:10.5px;color:var(--ink-dim);letter-spacing:.08em;line-height:1.95;
  background:rgba(10,16,28,.55);border:1px solid var(--line);border-radius:12px;padding:16px 20px;
  max-width:520px;
}
.help-grid h4{color:var(--cyan);font-size:10px;letter-spacing:.26em;margin-bottom:4px;font-weight:600}
.help-grid .pw{display:flex;align-items:center;gap:8px;margin:1px 0}
.help-grid .pw i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* 超级按键口令 */
.super-title{font-size:13px;letter-spacing:.38em;color:var(--amber-hot);text-shadow:0 0 16px rgba(255,179,71,.35)}
.super-input{width:min(260px,80vw);padding:11px 13px;border:1px solid rgba(67,232,255,.42);border-radius:8px;
  background:rgba(4,9,17,.92);color:var(--ink);outline:none;text-align:center;letter-spacing:.18em;font:12px var(--font);
  box-shadow:0 0 22px rgba(67,232,255,.12),inset 0 0 16px rgba(0,0,0,.35);user-select:text;-webkit-user-select:text;pointer-events:auto}
.super-input:focus{border-color:var(--cyan);box-shadow:0 0 26px rgba(67,232,255,.28),inset 0 0 16px rgba(0,0,0,.35)}
.super-actions{display:flex;gap:8px}.super-actions button{min-width:88px;padding:8px 13px;border:1px solid var(--line);border-radius:7px;background:rgba(24,38,58,.72);color:var(--ink);font:11px var(--font);cursor:pointer;pointer-events:auto}
.super-actions button.primary{border-color:rgba(67,232,255,.58);background:linear-gradient(180deg,#7ff0ff,#2ec7e6);color:#06131a;font-weight:700}
.super-actions button:hover{filter:brightness(1.12)}
.super-status{min-height:18px;color:var(--red);font-size:10px;letter-spacing:.12em}

/* Toast */
#toast{
  position:absolute;left:50%;top:16px;transform:translate(-50%,-18px);z-index:30;
  padding:7px 16px;border-radius:20px;font-size:11px;letter-spacing:.18em;
  background:rgba(10,16,28,.9);border:1px solid rgba(67,232,255,.4);color:var(--cyan);
  opacity:0;transition:all .25s cubic-bezier(.2,.9,.3,1);pointer-events:none;white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.6);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 关卡过场 */
#stagecard{
  position:absolute;inset:0;z-index:22;display:none;
  align-items:center;justify-content:center;background:#8a8f99;
}
#stagecard.on{display:flex}
#stagecard .txt{font-size:26px;letter-spacing:.22em;color:#101520;font-weight:800}
.shutter{position:absolute;left:0;width:100%;height:50%;background:#8a8f99;z-index:1}
.shutter.top{top:0}.shutter.bot{bottom:0}

/* ---------- 触屏控制 ---------- */
#touch{position:fixed;inset:0;z-index:40;display:none;pointer-events:none}
#touch.on{display:block}
.tpad{
  position:absolute;bottom:26px;left:22px;width:150px;height:150px;pointer-events:auto;
  border-radius:50%;background:radial-gradient(circle,rgba(30,44,68,.42),rgba(14,20,32,.26));
  border:1px solid rgba(150,185,235,.2);touch-action:none;
}
.tpad .nub{
  position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(67,232,255,.6),rgba(30,120,150,.45));
  border:1px solid rgba(150,225,255,.5);box-shadow:0 0 22px rgba(67,232,255,.35);
}
.tbtn{
  position:absolute;pointer-events:auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;letter-spacing:.1em;color:#cfe6ff;touch-action:none;
  background:radial-gradient(circle at 35% 30%,rgba(46,64,96,.6),rgba(18,26,42,.55));
  border:1px solid rgba(150,185,235,.28);box-shadow:0 4px 18px rgba(0,0,0,.5);
}
.tbtn:active,.tbtn.hit{background:radial-gradient(circle at 35% 30%,rgba(255,180,80,.75),rgba(180,90,20,.6));color:#12161f}
#tFire{right:26px;bottom:34px;width:92px;height:92px;font-size:14px;font-weight:700}
#tPause{right:22px;top:22px;width:44px;height:44px;font-size:11px}
#tSuper{left:22px;top:22px;width:54px;height:44px;border-radius:12px;font-size:10px}
#tCheats{
  position:absolute;left:22px;top:78px;display:none;grid-template-columns:repeat(2,58px);gap:7px;
  pointer-events:auto;
}
#tCheats.on{display:grid}
.tcheat{
  height:34px;border:1px solid rgba(150,185,235,.28);border-radius:8px;pointer-events:auto;
  background:rgba(18,28,46,.82);color:#cfe6ff;font:10px var(--font);letter-spacing:.08em;
  box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none;
}
.tcheat:active,.tcheat.hit{background:#d98a34;color:#111722;border-color:#ffd38a}
.panel-action{
  min-width:116px;padding:9px 16px;border:1px solid rgba(67,232,255,.5);border-radius:8px;
  background:linear-gradient(180deg,#72eafa,#2ebedb);color:#07141b;font:700 11px var(--font);
  letter-spacing:.14em;cursor:pointer;pointer-events:auto;box-shadow:0 7px 24px rgba(18,170,205,.18);
}
.panel-action.secondary{background:rgba(24,38,58,.82);color:var(--ink);border-color:var(--line);box-shadow:none}
.panel-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}

/* ---------- 底部信息条 ---------- */
#footer{
  position:fixed;bottom:8px;left:0;width:100%;text-align:center;z-index:3;
  font-size:9.5px;letter-spacing:.24em;color:rgba(120,145,185,.42);pointer-events:none;
}
#rotate{
  position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:var(--bg0);color:var(--ink-dim);font-size:12px;letter-spacing:.2em;text-align:center;padding:30px;
}
@media (max-width:900px){ #footer{display:none} }
@media (max-height:500px) and (orientation:landscape){
  .panel{padding:10px;gap:8px}
  .logo .l1{font-size:9px;letter-spacing:.42em;margin-bottom:5px}
  .logo .l2{font-size:31px}
  .logo .l3{font-size:8px;letter-spacing:.30em;margin-top:6px}
  .tagline{font-size:9px}
  .menu{gap:4px;margin-top:2px;min-width:220px}
  .mi{padding:6px 12px;font-size:10px}
  .mi small{font-size:8px}
  .hint{font-size:8px;line-height:1.4}
  .panel-action{padding:7px 12px;min-width:100px;font-size:10px}
  #pClear{justify-content:center;gap:6px;overflow:auto;padding-block:8px}
  #pClear .bigmsg{font-size:19px}
  #pClear .score-table{padding:8px 14px;gap:4px 14px;font-size:9px}
}
@media (max-height:360px) and (orientation:landscape){
  .tpad{left:12px;bottom:14px;width:110px;height:110px}
  .tpad .nub{width:48px;height:48px;margin:-24px 0 0 -24px}
  #tSuper{left:12px;top:12px;width:50px;height:40px}
  #tCheats{left:12px;top:60px;grid-template-columns:repeat(2,52px);gap:5px}
  .tcheat{height:30px;font-size:9px}
  #tFire{right:14px;bottom:20px;width:78px;height:78px;font-size:12px}
  #tPause{right:12px;top:12px;width:40px;height:40px;font-size:10px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="cabinet">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div id="screenwrap">
      <canvas id="game" width="576" height="448"></canvas>
      <div id="fx" class="scan"></div>
      <div id="flash"></div>

      <!-- 标题 -->
      <div class="panel on" id="pTitle">
        <div class="logo">
          <span class="l1">坦 克 大 战</span>
          <span class="l2">钢 铁 防 线</span>
          <span class="l3">坦 克 营 指 挥 官 &nbsp;·&nbsp; 版 本 <span id="gameVersionBadge"></span></span>
        </div>
        <div class="menu" id="menu"></div>
        <div class="hint">
          <kbd>↑</kbd><kbd>↓</kbd> 选择 &nbsp; <kbd>Enter</kbd> 确定 &nbsp; <kbd>H</kbd> 帮助 &nbsp; <kbd>Q</kbd> 超级按键
        </div>
      </div>

      <!-- 帮助 -->
      <div class="panel" id="pHelp">
        <div class="l1" style="font-size:12px;letter-spacing:.4em;color:var(--cyan)">操 作 说 明</div>
        <div class="help-grid" id="helpGrid"></div>
        <div class="hint"><kbd>Esc</kbd> / <kbd>H</kbd> 返回</div>
      </div>

      <!-- 超级按键口令 -->
      <div class="panel" id="pSuper">
        <div class="super-title">超 级 按 键</div>
        <div class="hint">请输入授权口令，解锁后本页面内持续有效</div>
        <input class="super-input" id="superCode" type="text" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="超级按键口令" placeholder="llapi.org">
        <div class="super-actions"><button class="primary" id="superSubmit">解 锁</button><button id="superCancel">取 消</button></div>
        <div class="super-status" id="superStatus"></div>
        <div class="hint"><kbd>Enter</kbd> 确认 &nbsp; <kbd>Esc</kbd> 返回</div>
      </div>

      <!-- 暂停 -->
      <div class="panel" id="pPause">
        <div class="bigmsg" style="color:var(--cyan)">暂 停</div>
        <div class="panel-actions"><button class="panel-action" id="pauseResumeBtn">继 续</button><button class="panel-action secondary" id="pauseRestartBtn">重开本关</button><button class="panel-action secondary" id="pauseTitleBtn">返回标题</button></div>
        <div class="hint"><kbd>P</kbd> 继续 &nbsp;·&nbsp; <kbd>R</kbd> 重开本关 &nbsp;·&nbsp; <kbd>Esc</kbd> 回标题</div>
      </div>

      <!-- 关卡结算 -->
      <div class="panel" id="pClear">
        <div class="bigmsg win" id="clearTitle">关 卡 达 成</div>
        <div id="clearBody"></div>
        <button class="panel-action" id="nextStageBtn">进 入 下 一 关</button>
        <div class="hint"><kbd>Enter</kbd> 继续</div>
      </div>

      <!-- 游戏结束 -->
      <div class="panel" id="pOver">
        <div class="bigmsg lose">基 地 沦 陷</div>
        <div id="overBody"></div>
        <button class="panel-action" id="overTitleBtn">返 回 标 题</button>
        <div class="hint"><kbd>Enter</kbd> 返回标题</div>
      </div>

      <!-- 通关 -->
      <div class="panel" id="pWin">
        <div class="bigmsg win">全 线 肃 清</div>
        <div id="winBody"></div>
        <button class="panel-action" id="winTitleBtn">返 回 标 题</button>
        <div class="hint"><kbd>Enter</kbd> 返回标题</div>
      </div>

      <div id="stagecard"><div class="txt" id="stageTxt">第 1 关</div></div>
      <div id="toast"></div>
    </div>
  </div>
</div>

<div id="touch">
  <div class="tpad" id="tPad"><div class="nub" id="tNub"></div></div>
  <div class="tbtn" id="tSuper">超级</div>
  <div id="tCheats" aria-label="超级按键">
    <button class="tcheat" id="tFreeze">冻结</button>
    <button class="tcheat" id="tBase">基地</button>
    <button class="tcheat" id="tPower">火力</button>
    <button class="tcheat" id="tClear">清场</button>
  </div>
  <div class="tbtn" id="tFire">开火</div>
  <div class="tbtn" id="tPause">暂停</div>
</div>

<div id="footer">钢铁防线 v1.3 · 单文件画布引擎 · 程序化像素美术 · 原创芯片音源</div>
<div id="rotate">请 横 屏 游 玩<br><span style="font-size:10px;opacity:.6">请旋转设备</span></div>
<output id="diagnostics" hidden></output>

<script>
"use strict";
/* ============================================================
   P1 · 常量 / 工具 / 输入
   ============================================================ */
const GAME_VERSION = "1.3";
const VW = 576, VH = 448;          // 逻辑分辨率
const G  = 16;                      // 地形格边长(半格,原版 quarter*2)
const GN = 26;                      // 战场 26x26 格
const FS = GN * G;                  // 战场像素 416
const FX = 16, FY = 16;             // 战场左上角
const SBX = FX + FS + 8, SBW = 120; // 侧栏
const TS = 32;                      // 坦克尺寸 2x2 格
const STEP = 1 / 60;

// 地形
const TE = { EMPTY:0, BRICK:1, STEEL:2, WATER:3, TREE:4, ICE:5, BASE:6, BORDER:7 };

// 方向 0上 1右 2下 3左
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const OPP = [2, 3, 0, 1];

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const sign  = (v)=> v<0?-1:(v>0?1:0);
const TAU   = Math.PI*2;

let _seed = (Math.random()*0xffffffff)>>>0;
function srand(s){ _seed = (s>>>0)||1; }
function rnd(){ // mulberry32
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed>>>15), 1 | _seed);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
  return ((t ^ (t>>>14))>>>0) / 4294967296;
}
const rndi   = (n)=> (rnd()*n)|0;
const rrange = (a,b)=> a + rnd()*(b-a);
const pick   = (arr)=> arr[(rnd()*arr.length)|0];
const chance = (p)=> rnd() < p;

function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* ---------------- 输入 ---------------- */
const Input = {
  keys:Object.create(null), pressed:Object.create(null),
  // 两位玩家的方向/开火状态
  pads:[
    {up:0,dn:0,lf:0,rt:0,fire:0,firePressed:0},
    {up:0,dn:0,lf:0,rt:0,fire:0,firePressed:0}
  ],
  touch:{active:false, dx:0, dy:0, fire:0, firePressed:0},
  anyPressed:false,
  _prevGP:[{},{}],

  init(){
    addEventListener("keydown", e=>{
      const k = e.code;
      if(!this.keys[k]) this.pressed[k] = 1;
      this.keys[k] = 1;
      this.anyPressed = true;
      const textEntry = e.target && e.target.matches?.("input, textarea, select, [contenteditable='true']");
      if(!textEntry && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","Enter","KeyP","Tab","Slash"].includes(k)) e.preventDefault();
    }, {passive:false});
    addEventListener("keyup", e=>{ this.keys[e.code] = 0; });
    addEventListener("blur", ()=>{ this.keys = Object.create(null); });
    this.initTouch();
  },

  down(k){ return !!this.keys[k]; },
  hit(k){ return !!this.pressed[k]; },
  hitAny(...ks){ return ks.some(k=>this.pressed[k]); },

  initTouch(){
    const padEl = document.getElementById("tPad");
    const nub   = document.getElementById("tNub");
    const fire  = document.getElementById("tFire");
    const pause = document.getElementById("tPause");
    const superBtn = document.getElementById("tSuper");
    if(!padEl) return;
    let pid = null, cx=0, cy=0, R=52;

    const start = (e)=>{
      const t = e.changedTouches ? e.changedTouches[0] : e;
      pid = t.identifier !== undefined ? t.identifier : "m";
      const r = padEl.getBoundingClientRect();
      cx = r.left + r.width/2; cy = r.top + r.height/2; R = r.width/2 - 18;
      move(e); e.preventDefault();
    };
    const move = (e)=>{
      if(pid === null) return;
      let t = null;
      if(e.changedTouches){ for(const c of e.changedTouches) if(c.identifier === pid) t = c; }
      else t = e;
      if(!t) return;
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const d = Math.hypot(dx,dy) || 1;
      const cl = Math.min(d, R);
      nub.style.transform = `translate(${dx/d*cl}px,${dy/d*cl}px)`;
      if(d > 14){ this.touch.active = true; this.touch.dx = dx/d; this.touch.dy = dy/d; }
      else { this.touch.active = false; this.touch.dx = 0; this.touch.dy = 0; }
      e.preventDefault();
    };
    const end = (e)=>{
      pid = null; nub.style.transform = "";
      this.touch.active=false; this.touch.dx=0; this.touch.dy=0;
    };
    padEl.addEventListener("touchstart", start, {passive:false});
    padEl.addEventListener("touchmove",  move,  {passive:false});
    padEl.addEventListener("touchend",   end);
    padEl.addEventListener("touchcancel",end);
    // 兼容桌面窄视口与混合输入设备
    padEl.addEventListener("pointerdown", e=>{ if(e.pointerType === "mouse") start(e); }, {passive:false});
    padEl.addEventListener("pointermove", e=>{ if(e.pointerType === "mouse") move(e); }, {passive:false});
    padEl.addEventListener("pointerup",   e=>{ if(e.pointerType === "mouse") end(e); });
    padEl.addEventListener("pointercancel",e=>{ if(e.pointerType === "mouse") end(e); });
    padEl.addEventListener("mouseleave",   e=>{ if(e.pointerType === "mouse") end(e); });

    const bind = (el, on, off)=>{
      const begin = e=>{ on(); el.classList.add("hit"); e.preventDefault(); };
      const finish = e=>{ off&&off(); el.classList.remove("hit"); };
      el.addEventListener("touchstart", begin, {passive:false});
      el.addEventListener("touchend",   finish);
      el.addEventListener("touchcancel",finish);
      el.addEventListener("pointerdown", e=>{ if(e.pointerType === "mouse") begin(e); }, {passive:false});
      el.addEventListener("pointerup",   e=>{ if(e.pointerType === "mouse") finish(e); });
      el.addEventListener("pointercancel",e=>{ if(e.pointerType === "mouse") finish(e); });
    };
    bind(fire,  ()=>{ this.touch.fire=1; this.touch.firePressed=1; }, ()=>{ this.touch.fire=0; });
    bind(pause, ()=>{ this.pressed["KeyP"]=1; });
    bind(superBtn, ()=>Game.openSuperPrompt());
    bind(document.getElementById("tFreeze"), ()=>Game.useSuperAction("freeze"));
    bind(document.getElementById("tBase"),   ()=>Game.useSuperAction("base"));
    bind(document.getElementById("tPower"),  ()=>Game.useSuperAction("power"));
    bind(document.getElementById("tClear"),  ()=>Game.useSuperAction("clear"));

    // 触屏设备自动显示，同时兼容窄横屏设备模拟视口
    const touchLayout = matchMedia("(pointer:coarse)").matches || navigator.maxTouchPoints > 0 || (innerWidth <= 1000 && innerHeight <= 600);
    if(touchLayout) document.getElementById("touch").classList.add("on");
  },

  // 手柄
  pollGamepads(){
    if(!navigator.getGamepads) return;
    const gps = navigator.getGamepads();
    for(let i=0;i<2;i++){
      const gp = gps[i];
      const p  = this.pads[i];
      p.gpUp=p.gpDn=p.gpLf=p.gpRt=0; p.gpFire=0;
      if(!gp) continue;
      const ax = gp.axes[0]||0, ay = gp.axes[1]||0, DZ=0.4;
      const b = (n)=> gp.buttons[n] && gp.buttons[n].pressed;
      p.gpUp = (ay<-DZ || b(12))?1:0;
      p.gpDn = (ay> DZ || b(13))?1:0;
      p.gpLf = (ax<-DZ || b(14))?1:0;
      p.gpRt = (ax> DZ || b(15))?1:0;
      const f = (b(0)||b(1)||b(2)||b(3)||b(7))?1:0;
      p.gpFire = f;
      if(f && !this._prevGP[i].f) p.gpFirePressed = 1;
      this._prevGP[i].f = f;
      if(b(9) && !this._prevGP[i].s) this.pressed["KeyP"] = 1;
      this._prevGP[i].s = b(9);
    }
  },

  // 汇总玩家输入 (idx 0/1)
  // exclusive=true 时(双人局)玩家1 只认 WASD，方向键留给玩家2
  read(idx, useTouch, exclusive){
    const p = this.pads[idx];
    let up,dn,lf,rt,fire,fp;
    if(idx === 0){
      const arrow = !exclusive;
      up = this.down("KeyW")||(arrow&&this.down("ArrowUp"))   ||p.gpUp;
      dn = this.down("KeyS")||(arrow&&this.down("ArrowDown")) ||p.gpDn;
      lf = this.down("KeyA")||(arrow&&this.down("ArrowLeft")) ||p.gpLf;
      rt = this.down("KeyD")||(arrow&&this.down("ArrowRight"))||p.gpRt;
      fire = this.down("Space")||this.down("KeyJ")||this.down("KeyK")||p.gpFire;
      fp   = this.hit("Space")||this.hit("KeyJ")||this.hit("KeyK")||p.gpFirePressed;
      if(useTouch){
        const t = this.touch;
        if(t.active){
          if(Math.abs(t.dx) > Math.abs(t.dy)){ if(t.dx>0) rt=1; else lf=1; }
          else { if(t.dy>0) dn=1; else up=1; }
        }
        fire = fire || t.fire; fp = fp || t.firePressed;
      }
    } else {
      up = this.down("ArrowUp")   ||p.gpUp;
      dn = this.down("ArrowDown") ||p.gpDn;
      lf = this.down("ArrowLeft") ||p.gpLf;
      rt = this.down("ArrowRight")||p.gpRt;
      fire = this.down("Numpad0")||this.down("ShiftRight")||this.down("Slash")||this.down("KeyL")||p.gpFire;
      fp   = this.hit("Numpad0")||this.hit("ShiftRight")||this.hit("Slash")||this.hit("KeyL")||p.gpFirePressed;
    }
    return {up:!!up, dn:!!dn, lf:!!lf, rt:!!rt, fire:!!fire, firePressed:!!fp};
  },

  endFrame(){
    this.pressed = Object.create(null);
    this.touch.firePressed = 0;
    this.anyPressed = false;
    for(const p of this.pads) p.gpFirePressed = 0;
  }
};

/* ============================================================
   P2 · 音频引擎（WebAudio 程序化芯片音）
   ============================================================ */
const Snd = {
  ctx:null, master:null, musicGain:null, sfxGain:null,
  ready:false, muted:Save.data.mute||false,
  _engine:null, _engineOn:false, _engineTarget:0,
  _seq:null, _track:null, _step:0, _next:0, _timer:null,

  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();   this.sfxGain.gain.value = 1.0;   this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.42; this.musicGain.connect(this.master);
      this.ready = true;
    }catch(e){ this.ready = false; }
  },
  resume(){
    if(!this.ctx) this.init();
    if(this.ctx && this.ctx.state === "suspended"){ try{ this.ctx.resume(); }catch(e){} }
  },
  setMute(m){
    this.muted = m; Save.data.mute = m; Save.save();
    if(this.master) try{ this.master.gain.value = m ? 0 : 0.55; }catch(e){}
  },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },

  /* --- 基础发声 --- */
  tone(o){
    if(!this.ready || this.muted) return;
    try{
      const t0 = this.now() + (o.delay||0);
      const osc = this.ctx.createOscillator();
      const g   = this.ctx.createGain();
      osc.type = o.type || "square";
      osc.frequency.setValueAtTime(o.f, t0);
      if(o.f2 !== undefined){
        if(o.exp) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2), t0 + (o.dur||0.1));
        else      osc.frequency.linearRampToValueAtTime(o.f2, t0 + (o.dur||0.1));
      }
      const vol = (o.v===undefined?0.2:o.v);
      const a = o.a===undefined?0.004:o.a;
      const d = o.dur||0.1;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0+a);
      if(o.hold){ g.gain.setValueAtTime(vol, t0+d-0.02); }
      g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
      let node = osc;
      if(o.lp){
        const f = this.ctx.createBiquadFilter();
        f.type="lowpass"; f.frequency.value=o.lp;
        node.connect(f); node = f;
      }
      node.connect(g); g.connect(o.bus || this.sfxGain);
      osc.start(t0); osc.stop(t0+d+0.02);
    }catch(e){}
  },
  noise(o){
    if(!this.ready || this.muted) return;
    try{
      const t0 = this.now() + (o.delay||0);
      const dur = o.dur||0.14;
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const dat = buf.getChannelData(0);
      let last = 0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        // 一阶低通让噪声更"厚"
        last = last*0.55 + w*0.45;
        dat[i] = (o.raw ? w : last);
      }
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const g = this.ctx.createGain();
      const vol = o.v===undefined?0.25:o.v;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      let node = src;
      if(o.lp!==undefined || o.hp!==undefined){
        const f = this.ctx.createBiquadFilter();
        if(o.hp!==undefined){ f.type="highpass"; f.frequency.setValueAtTime(o.hp,t0); }
        else { f.type="lowpass"; f.frequency.setValueAtTime(o.lp,t0);
               if(o.lp2!==undefined) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.lp2), t0+dur); }
        f.Q.value = o.q||1;
        node.connect(f); node = f;
      }
      node.connect(g); g.connect(this.sfxGain);
      src.start(t0); src.stop(t0+dur+0.02);
    }catch(e){}
  },

  /* --- 音效库 --- */
  sfx(name){

      case "expSmall":

      case "expBig":

        break;

        [1047,1319,1568,2093].forEach((f,i)=> this.tone({f, dur:0.1, v:0.11, type:"square", delay:i*0.045}));

      case "hitArmor":

        break;
      case "pause":

        this.tone({f:660, dur:0.09, v:0.10, type:"square", delay:0.07});
        break;
      case "menu":

        break;
      case "select":
        this.tone({f:660, dur:0.06, v:0.10, type:"square"});
        this.tone({f:990, dur:0.09, v:0.10, type:"square", delay:0.06});
        break;
    }
  },

  /* --- 引擎循环声 --- */
  engineStart(){
    if(!this.ready || this.muted || this._engine) return;
    try{
      const o1 = this.ctx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = 42;
      const o2 = this.ctx.createOscillator(); o2.type = "square";   o2.frequency.value = 63;
      const f  = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 320; f.Q.value = 3;
      const g  = this.ctx.createGain(); g.gain.value = 0.0001;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfxGain);
      o1.start(); o2.start();
      this._engine = {o1,o2,f,g};
    }catch(e){}
  },
  engineStop(){
    if(!this._engine) return;
    try{
      const e = this._engine;
      e.g.gain.setTargetAtTime(0.0001, this.now(), 0.05);
      const o1=e.o1,o2=e.o2;
      setTimeout(()=>{ try{o1.stop();o2.stop();}catch(_){} }, 220);
    }catch(e){}
    this._engine = null;
  },
  engineSet(moving){
    if(!this._engine) return;
    try{
      const t = this.now();
      const e = this._engine;
      e.g.gain.setTargetAtTime(moving?0.055:0.028, t, 0.06);
      e.o1.frequency.setTargetAtTime(moving?70:40, t, 0.08);
      e.o2.frequency.setTargetAtTime(moving?105:60, t, 0.08);
      e.f.frequency.setTargetAtTime(moving?520:300, t, 0.08);
    }catch(e){}
  },

  /* --- 音乐序列器 --- */
  music(track){
    if(this._track === track) return;
    this.stopMusic();
    if(!this.ready || this.muted || !track) return;
    const T = MUSIC[track];
    if(!T) return;
    this._track = track; this._step = 0;
    this._next = this.now() + 0.08;
    const spb = 60 / T.bpm / T.div;
    const tick = ()=>{
      if(!this.ready || this._track !== track) return;
      try{
        const t = this.now();
        while(this._next < t + 0.16){
          this._playStep(T, this._step, this._next);
          this._next += spb;
          this._step++;
          if(this._step >= T.len){ if(T.loop === false){ this.stopMusic(); return; } this._step = 0; }
        }
      }catch(e){}
    };
    tick();
    this._timer = setInterval(tick, 30);
  },
  stopMusic(){
    if(this._timer){ clearInterval(this._timer); this._timer = null; }
    this._track = null;
  },
  _playStep(T, s, when){
    const bus = this.musicGain;
    for(const ch of T.ch){
      const n = ch.p[s % ch.p.length];
      if(!n || n === "-") continue;
      if(ch.drum){
        if(n === "k"){ this.noise({dur:0.10, v:0.24, lp:220, delay:Math.max(0,when-this.now())});
                       this.tone({f:120,f2:44,dur:0.11,v:0.20,type:"sine",exp:true,bus, delay:Math.max(0,when-this.now())}); }
        else if(n === "s"){ this.noise({dur:0.11, v:0.17, hp:1400, delay:Math.max(0,when-this.now())}); }
        else if(n === "h"){ this.noise({dur:0.035, v:0.07, hp:6500, delay:Math.max(0,when-this.now())}); }
        continue;
      }
      const f = NOTE[n];
      if(!f) continue;
      this.tone({
        f: f * (ch.oct||1), dur: (ch.dur||0.12), v: (ch.v||0.09),
        type: ch.type||"square", bus, delay: Math.max(0, when - this.now()),
        f2: ch.slide ? f*(ch.oct||1)*ch.slide : undefined, exp:true
      });
    }
  }
};

/* 音名表 */
const NOTE = (()=>{
  const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const o = {};
  for(let oct=1; oct<=7; oct++){
    for(let i=0;i<12;i++){
      o[names[i]+oct] = 440 * Math.pow(2, (oct*12+i - 57)/12);
    }
  }
  return o;
})();

/* ============================================================
   P3 · 像素美术：画布工具 / 位图字体 / 坦克精灵
   ============================================================ */
function mkCanvas(w,h){
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  if(x) x.imageSmoothingEnabled = false;
  return {c, x};
}
function rr(x, X,Y,W,H,R){ // 圆角矩形路径
  const r = Math.min(R, W/2, H/2);
  x.beginPath();
  x.moveTo(X+r, Y);
  x.lineTo(X+W-r, Y); x.quadraticCurveTo(X+W, Y, X+W, Y+r);
  x.lineTo(X+W, Y+H-r); x.quadraticCurveTo(X+W, Y+H, X+W-r, Y+H);
  x.lineTo(X+r, Y+H); x.quadraticCurveTo(X, Y+H, X, Y+H-r);
  x.lineTo(X, Y+r); x.quadraticCurveTo(X, Y, X+r, Y);
  x.closePath();
}
function vgrad(x, X,Y,W,H, stops){
  const g = x.createLinearGradient(X,Y,X,Y+H);
  for(const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
function hgrad(x, X,Y,W,H, stops){
  const g = x.createLinearGradient(X,Y,X+W,Y);
  for(const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}
// 旋转 90° 的整数倍（无损）
function rotSprite(src, deg){
  const w = src.width, h = src.height;
  const {c,x} = mkCanvas(w,h);
  x.save(); x.translate(w/2,h/2); x.rotate(deg*Math.PI/180); x.drawImage(src,-w/2,-h/2); x.restore();
  return c;
}

  "x":[0x44,0x28,0x10,0x28,0x44]
};
function txtW(s, sc, sp){ sc=sc||1; sp=(sp===undefined?1:sp); return s.length*(5*sc+sp*sc) - sp*sc; }
function drawTxt(x, s, X, Y, col, sc, sp){
  sc = sc||1; sp = (sp===undefined?1:sp);
  x.fillStyle = col;
  let cx = X;
  s = String(s).toUpperCase();
  for(let i=0;i<s.length;i++){
    const g = FONT5x7[s[i]] || FONT5x7["?"];
    for(let c=0;c<5;c++){
      const col8 = g[c];
      if(!col8){ continue; }
      for(let r=0;r<7;r++){
        if(col8 & (1<<r)) x.fillRect(cx + c*sc, Y + r*sc, sc, sc);
      }
    }
    cx += (5+sp)*sc;
  }
  return cx - X - sp*sc;
}
function drawTxtC(x, s, CX, Y, col, sc, sp){
  const w = txtW(s, sc, sp);
  return drawTxt(x, s, Math.round(CX - w/2), Y, col, sc, sp);
}
// Canvas 的像素字库只覆盖拉丁字符；中文 UI 使用系统字体绘制，保持布局稳定。
function hasCjk(s){ return /[^\x00-\x7F]/.test(String(s)); }
function uiTextWidth(x, s, sc, sp){
  sc = sc || 1; sp = (sp === undefined ? 1 : sp);
  if(!hasCjk(s)) return txtW(s, sc, sp);
  x.save();
  x.font = `${Math.max(9, Math.round(10*sc))}px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`;
  const w = x.measureText(String(s)).width;
  x.restore();
  return w;
}
function drawUiText(x, s, X, Y, col, sc, sp){
  sc = sc || 1; sp = (sp === undefined ? 1 : sp);
  if(!hasCjk(s)) return drawTxt(x, s, X, Y, col, sc, sp);
  x.save();
  x.fillStyle = col;
  x.font = `${Math.max(9, Math.round(10*sc))}px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`;
  x.textBaseline = "top";
  x.fillText(String(s), X, Y);
  const w = x.measureText(String(s)).width;
  x.restore();
  return w;
}
function drawUiTextC(x, s, CX, Y, col, sc, sp){
  const w = uiTextWidth(x, s, sc, sp);
  return drawUiText(x, s, Math.round(CX - w/2), Y, col, sc, sp);
}

/* 绘制一辆朝上的坦克 (32x32) */
function paintTank(x, sk, tread, style){
  x.clearRect(0,0,TS,TS);
  const L = 2, R = TS-2;

  // ---- 履带 ----
  const trW = 7;
  for(const tx of [L, R-trW]){
    // 履带底板
    rr(x, tx, 3, trW, TS-6, 2);
    x.fillStyle = vgrad(x, tx,3,trW,TS-6, [[0,"#1b2130"],[0.5,sk.tread],[1,"#151a26"]]);
    x.fill();
    // 履带节
    for(let i=0;i<8;i++){
      const yy = 4 + ((i*4 + (tread?2:0)) % (TS-8));
      x.fillStyle = sk.treadHi;
      x.fillRect(tx+1, 3+yy%(TS-8), trW-2, 1);
    }
    // 侧向高光
    x.fillStyle = "rgba(255,255,255,.16)";
    x.fillRect(tx, 4, 1, TS-8);
    x.fillStyle = "rgba(0,0,0,.35)";
    x.fillRect(tx+trW-1, 4, 1, TS-8);
    // 导轮
    x.fillStyle = "rgba(0,0,0,.45)";
    x.fillRect(tx+1, 4, trW-2, 2);
    x.fillRect(tx+1, TS-8, trW-2, 2);
  }

  // ---- 车体 ----
  const bx = L+trW, bw = TS - 2*(2+trW);
  rr(x, bx, 6, bw, TS-12, 3);
  x.fillStyle = hgrad(x, bx,6,bw,TS-12, [[0,sk.dark],[0.32,sk.base],[0.62,sk.base],[1,sk.dark]]);
  x.fill();
  // 车体上缘高光
  x.fillStyle = "rgba(255,255,255,.30)";
  x.fillRect(bx+2, 7, bw-4, 1);
  // 车体分板线
  x.fillStyle = "rgba(0,0,0,.28)";
  x.fillRect(bx+1, 13, bw-2, 1);
  x.fillRect(bx+1, TS-13, bw-2, 1);
  // 前装甲斜面
  x.fillStyle = sk.light;
  x.globalAlpha = 0.35;
  x.fillRect(bx+2, 8, bw-4, 3);
  x.globalAlpha = 1;
  // 铆钉
  x.fillStyle = sk.trim;
  x.fillRect(bx+1, 9, 1, 1); x.fillRect(bx+bw-2, 9, 1, 1);
  x.fillRect(bx+1, TS-10, 1, 1); x.fillRect(bx+bw-2, TS-10, 1, 1);

  // ---- 炮塔 ----
  const cx = TS/2, cy = TS/2 + 2;
  x.beginPath(); x.arc(cx, cy, 6.2, 0, TAU);
  const rg = x.createRadialGradient(cx-2, cy-2, 1, cx, cy, 7);
  rg.addColorStop(0, sk.light); rg.addColorStop(0.45, sk.base); rg.addColorStop(1, sk.dark);
  x.fillStyle = rg; x.fill();
  x.strokeStyle = "rgba(0,0,0,.4)"; x.lineWidth = 1; x.stroke();
  // 舱盖
  x.beginPath(); x.arc(cx, cy, 2.4, 0, TAU);
  x.fillStyle = sk.trim; x.fill();
  x.fillStyle = "rgba(255,255,255,.22)";
  x.fillRect(cx-2, cy-2, 2, 1);

  // ---- 炮管 ----
  const gw = style === "power" ? 5 : 4;
  const gl = style === "power" ? 14 : 12;
  x.fillStyle = vgrad(x, 0, cy-gl, 0, gl, [[0,sk.dark],[1,sk.base]]);
  x.fillStyle = hgrad(x, cx-gw/2, 0, gw, 0, [[0,sk.dark],[0.4,sk.light],[1,sk.dark]]);
  x.fillRect(Math.round(cx-gw/2), cy-gl, gw, gl);
  // 炮口
  x.fillStyle = "#12161f";
  x.fillRect(Math.round(cx-gw/2), cy-gl, gw, 2);
  x.fillStyle = "rgba(255,255,255,.35)";
  x.fillRect(Math.round(cx-gw/2), cy-gl+2, 1, gl-3);

  // ---- 类型标识 ----
  if(style === "fast"){ // 速度条纹
    x.fillStyle = "rgba(255,255,255,.5)";
    x.fillRect(bx+2, TS-12, bw-4, 1);
    x.fillRect(bx+3, TS-10, bw-6, 1);
  } else if(style === "armor"){ // 附加装甲块
    x.fillStyle = sk.dark;
    x.fillRect(bx-1, 12, 2, 8); x.fillRect(bx+bw-1, 12, 2, 8);
    x.fillStyle = "rgba(255,255,255,.2)";
    x.fillRect(bx-1, 12, 2, 1); x.fillRect(bx+bw-1, 12, 2, 1);
  } else if(style === "power"){ // 加长炮管配重
    x.fillStyle = sk.dark;
    x.fillRect(cx-3, cy-9, 6, 3);
  }
  // 底部投影微暗
  x.fillStyle = "rgba(0,0,0,.18)";
  x.fillRect(3, TS-4, TS-6, 2);
}

/* 精灵仓库 */
const SPR = { tanks:{}, terrain:{}, items:{}, misc:{} };

function buildTankSprites(){
  for(const key in TANK_SKINS){
    const sk = TANK_SKINS[key];
    let style = "basic";
    if(key === "fast") style = "fast";
    else if(key === "power") style = "power";
    else if(key.startsWith("armor")) style = "armor";
    else if(key === "p1" || key === "p2") style = "player";
    const dirs = [];
    for(let t=0;t<2;t++){
      const {c,x} = mkCanvas(TS,TS);
      paintTank(x, sk, t, style);
      // 0=上 1=右 2=下 3=左
      dirs.push([c, rotSprite(c,90), rotSprite(c,180), rotSprite(c,270)]);
    }
    SPR.tanks[key] = dirs; // [treadFrame][dir]
  }
}

/* ============================================================
   P4 · 地形 / 基地 / 道具 / 子弹 精灵
   ============================================================ */
function buildTerrain(){
  /* --- 砖块 16x16（渲染时按 8x8 子块裁剪） --- */
  {
    const {c,x} = mkCanvas(G,G);
    x.fillStyle = "#4a1e10"; x.fillRect(0,0,G,G);           // 灰缝
    const rows = 4, rh = 4;
    for(let r=0;r<rows;r++){
      const off = (r%2) ? -4 : 0;
      for(let bx = off; bx < G; bx += 8){
        const w = 7, h = rh-1;
        const X = bx, Y = r*rh;
        // 砖面
        const g = x.createLinearGradient(X,Y,X,Y+h);
        g.addColorStop(0,"#c4643a"); g.addColorStop(0.45,"#a04b26"); g.addColorStop(1,"#7d3418");
        x.fillStyle = g;
        x.fillRect(X, Y, w, h);
        // 顶部高光 & 底部暗边
        x.fillStyle = "rgba(255,190,150,.45)"; x.fillRect(X, Y, w, 1);
        x.fillStyle = "rgba(50,16,6,.55)";     x.fillRect(X, Y+h-1, w, 1);
        // 随机颗粒
        if((X*7+Y*13) % 5 === 0){ x.fillStyle="rgba(255,255,255,.10)"; x.fillRect(X+2,Y+1,1,1); }
        if((X*3+Y*11) % 7 === 0){ x.fillStyle="rgba(0,0,0,.18)";       x.fillRect(X+4,Y+2,2,1); }
      }
    }
    SPR.terrain.brick = c;
  }

  /* --- 钢块 --- */
  {
    const {c,x} = mkCanvas(G,G);
    for(let qy=0;qy<2;qy++) for(let qx=0;qx<2;qx++){
      const X = qx*8, Y = qy*8;
      const g = x.createLinearGradient(X,Y,X+8,Y+8);
      g.addColorStop(0,"#d7dee9"); g.addColorStop(0.35,"#98a3b5");
      g.addColorStop(0.6,"#7a869a"); g.addColorStop(1,"#4c5568");
      x.fillStyle = g; x.fillRect(X,Y,8,8);
      x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(X,Y,8,1); x.fillRect(X,Y,1,8);
      x.fillStyle = "rgba(20,26,38,.75)";    x.fillRect(X,Y+7,8,1); x.fillRect(X+7,Y,1,8);
      x.fillStyle = "rgba(255,255,255,.7)";  x.fillRect(X+2,Y+2,1,1);
      x.fillStyle = "rgba(0,0,0,.35)";       x.fillRect(X+5,Y+5,1,1);
    }
    SPR.terrain.steel = c;
  }

  /* --- 水 3 帧 --- */
  {
    SPR.terrain.water = [];
    for(let f=0;f<3;f++){
      const {c,x} = mkCanvas(G,G);
      const g = x.createLinearGradient(0,0,0,G);
      g.addColorStop(0,"#123a6d"); g.addColorStop(0.5,"#17508f"); g.addColorStop(1,"#0e2c55");
      x.fillStyle = g; x.fillRect(0,0,G,G);
      for(let i=0;i<4;i++){
        const y = (i*4 + f*1.4) % G;
        x.fillStyle = "rgba(120,200,255,.30)";
        x.fillRect((i%2? 1:8) + f, Math.round(y), 6, 1);
        x.fillStyle = "rgba(200,240,255,.45)";
        x.fillRect((i%2? 2:9) + f, Math.round(y), 3, 1);
      }
      x.fillStyle = "rgba(0,0,0,.18)"; x.fillRect(0,G-1,G,1);
      SPR.terrain.water.push(c);
    }
  }

  /* --- 树 --- */
  {
    const {c,x} = mkCanvas(G,G);
    x.fillStyle = "#0f3a1b"; x.fillRect(0,0,G,G);
    const blobs = [[3,3,6,6],[9,2,5,6],[2,9,6,5],[8,8,7,7],[6,5,5,5]];
    for(const [bx,by,bw,bh] of blobs){
      const g = x.createRadialGradient(bx+bw*0.35, by+bh*0.3, 1, bx+bw/2, by+bh/2, bw);
      g.addColorStop(0,"#4fa356"); g.addColorStop(0.6,"#2c7436"); g.addColorStop(1,"#14401f");
      x.fillStyle = g;
      x.beginPath(); x.ellipse(bx+bw/2, by+bh/2, bw/2, bh/2, 0, 0, TAU); x.fill();
    }

    // 鹰：身体
    x.fillStyle = "#f2f6ff";
    x.beginPath();
    x.moveTo(16,7); x.lineTo(19,11); x.lineTo(18,13);
    x.lineTo(21,13); x.lineTo(26,10); x.lineTo(25,15); x.lineTo(21,17);
    x.lineTo(19,17); x.lineTo(18,24); x.lineTo(16,26); x.lineTo(14,24);

  {

    SPR.terrain.wall = c;
  }

const ITEM_TYPES = ["helmet","clock","shovel","star","grenade","tank","gun"];
function buildItems(){
  const P = 28;
  const plate = (x, hue)=>{
    rr(x, 1,1,P-2,P-2, 5);
    const g = x.createLinearGradient(0,0,0,P);
    g.addColorStop(0,"#2b3651"); g.addColorStop(1,"#111826");
    x.fillStyle = g; x.fill();
    x.lineWidth = 2;
    const eg = x.createLinearGradient(0,0,P,P);
    eg.addColorStop(0,"#fff2c4"); eg.addColorStop(0.5,hue); eg.addColorStop(1,"#7a5a12");
    x.strokeStyle = eg; x.stroke();
  };
  const mk = (name, hue, draw)=>{
    const {c,x} = mkCanvas(P,P);
    plate(x, hue); draw(x);
    SPR.items[name] = c;
  };

  mk("helmet", "#7fd8ff", (x)=>{
    const g = x.createLinearGradient(0,6,0,22);
    g.addColorStop(0,"#dff4ff"); g.addColorStop(0.5,"#79b9d8"); g.addColorStop(1,"#31647f");
    x.fillStyle = g;
    x.beginPath(); x.arc(14,15,8,Math.PI,0); x.lineTo(22,19); x.lineTo(6,19); x.closePath(); x.fill();
    x.fillStyle = "#24485c"; x.fillRect(4,19,20,3);
    x.fillStyle = "rgba(255,255,255,.7)";
    x.beginPath(); x.arc(11,13,3,Math.PI*1.1,Math.PI*1.7); x.lineWidth=2; x.strokeStyle="rgba(255,255,255,.75)"; x.stroke();
  });

  mk("clock", "#ffd166", (x)=>{
    x.beginPath(); x.arc(14,15,8.5,0,TAU);
    const g = x.createRadialGradient(11,12,1,14,15,9);
    g.addColorStop(0,"#fff8e0"); g.addColorStop(0.7,"#e8d29a"); g.addColorStop(1,"#9a8a55");
    x.fillStyle = g; x.fill();
    x.strokeStyle = "#6d5a22"; x.lineWidth = 2; x.stroke();
    x.strokeStyle = "#2b2410"; x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(14,15); x.lineTo(14,9); x.stroke();
    x.beginPath(); x.moveTo(14,15); x.lineTo(18,17); x.stroke();
    x.fillStyle="#2b2410"; x.fillRect(13,4,3,2);
  });

  mk("shovel", "#c8d4e6", (x)=>{
    x.fillStyle = "#8a6132"; x.fillRect(13,4,3,11);
    x.fillStyle = "#a87a44"; x.fillRect(13,4,1,11);
    const g = x.createLinearGradient(0,14,0,24);
    g.addColorStop(0,"#e8eef7"); g.addColorStop(1,"#7d8798");
    x.fillStyle = g;
    x.beginPath(); x.moveTo(8,14); x.lineTo(21,14); x.lineTo(18,23); x.lineTo(11,23); x.closePath(); x.fill();
    x.strokeStyle = "#4a5364"; x.lineWidth=1; x.stroke();
    x.fillStyle = "rgba(255,255,255,.6)"; x.fillRect(9,15,10,1);
  });

  mk("star", "#ffe066", (x)=>{
    x.save(); x.translate(14,15);
    x.beginPath();
    for(let i=0;i<10;i++){
      const a = -Math.PI/2 + i*Math.PI/5;
      const r = i%2 ? 4.2 : 9.5;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      i ? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.closePath();
    const g = x.createRadialGradient(-2,-3,1,0,0,10);
    g.addColorStop(0,"#fffbe0"); g.addColorStop(0.5,"#ffd54a"); g.addColorStop(1,"#d68f0e");
    x.fillStyle = g; x.fill();
    x.strokeStyle = "rgba(120,80,0,.6)"; x.lineWidth = 1; x.stroke();
    x.restore();
  });

  mk("grenade", "#ff8f6b", (x)=>{
    x.fillStyle = "#3f4a3a"; x.fillRect(12,4,4,3);
    x.strokeStyle = "#c8ccd4"; x.lineWidth=1.4;
    x.beginPath(); x.arc(19,6,3,0,TAU); x.stroke();
    const g = x.createRadialGradient(11,12,1,14,16,10);
    g.addColorStop(0,"#7e9268"); g.addColorStop(0.6,"#4a5c3c"); g.addColorStop(1,"#26311d");
    x.fillStyle = g;
    x.beginPath(); x.ellipse(14,16,7.5,8.5,0,0,TAU); x.fill();
    x.strokeStyle = "rgba(20,26,16,.85)"; x.lineWidth = 1;
    for(let i=1;i<4;i++){ x.beginPath(); x.moveTo(7,10+i*4); x.lineTo(21,10+i*4); x.stroke(); }
    for(let i=1;i<3;i++){ x.beginPath(); x.moveTo(9+i*5,8); x.lineTo(9+i*5,24); x.stroke(); }
    x.fillStyle="rgba(255,255,255,.28)"; x.fillRect(10,11,3,1);
  });

  mk("tank", "#9be89b", (x)=>{
    x.fillStyle = "#2f3a2b"; x.fillRect(5,12,4,10); x.fillRect(19,12,4,10);
    x.fillStyle = "#5d7350"; for(let i=0;i<4;i++){ x.fillRect(5,13+i*3,4,1); x.fillRect(19,13+i*3,4,1); }
    const g = x.createLinearGradient(9,0,19,0);
    g.addColorStop(0,"#3f5236"); g.addColorStop(0.4,"#7fa06a"); g.addColorStop(1,"#3f5236");
    x.fillStyle = g; x.fillRect(9,13,10,9);
    x.beginPath(); x.arc(14,17,3.6,0,TAU); x.fillStyle = "#9dc086"; x.fill();
    x.fillStyle = "#6b8459"; x.fillRect(13,6,2,8);
    x.fillStyle = "rgba(255,255,255,.35)"; x.fillRect(10,14,8,1);
  });

  mk("gun", "#ff6b9d", (x)=>{
    const g = x.createLinearGradient(0,8,0,22);
    g.addColorStop(0,"#ffd1e0"); g.addColorStop(0.5,"#e8608f"); g.addColorStop(1,"#8f2450");
    x.fillStyle = g;
    x.fillRect(5,13,16,5);
    x.fillRect(17,10,5,11);
    x.fillStyle = "#5c1733"; x.fillRect(5,14,3,3);
    x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(6,13,14,1);
    x.fillStyle = "#3a0f22"; x.fillRect(9,18,4,6);
    x.fillStyle = "#ffe3ee"; x.fillRect(19,11,2,2);
  });
}

/* ---------------- 子弹 ---------------- */
function buildBullets(){
  const mkB = (col, hi, w, h)=>{
    const {c,x} = mkCanvas(8,8);
    const cx = 4;
    x.fillStyle = col;
    rr(x, cx-w/2, 1, w, h, w/2); x.fill();
    x.fillStyle = hi;
    x.fillRect(cx-1, 2, 2, 2);
    x.fillStyle = "rgba(255,255,255,.9)";
    x.fillRect(cx-1, 1, 1, 1);
    return [c, rotSprite(c,90), rotSprite(c,180), rotSprite(c,270)];
  };
  SPR.misc.bulletP = mkB("#ffe9a8","#fff",4,6);
  SPR.misc.bulletE = mkB("#dfe7f2","#fff",4,6);
  SPR.misc.bulletX = mkB("#ff9d5c","#fff5e0",5,7);
}

function buildAllSprites(){
  buildTankSprites();
  buildTerrain();
  buildItems();
  buildBullets();
}

/* 出生点（格坐标，坦克占 2x2 格） */
const ENEMY_SPAWNS  = [[0,0],[12,0],[24,0]];
const SPAWN_CELLS = [[0,0],[12,0],[24,0],[4,0],[20,0]];
const PLAYER_SPAWNS = [[8,24],[16,24]];
const BASE_GX = 12, BASE_GY = 24;         // 基地左上格
const BASE_WALL = [                        // 基地护墙格
  [11,23],[12,23],[13,23],[14,23],
  [11,24],[14,24],
  [11,25],[14,25]
];

/* 地图规整：确保 26 行 x 26 列 */
function normalizeStage(rows){
  const out = [];
  for(let r=0;r<GN;r++){
    let s = rows[r] !== undefined ? String(rows[r]) : "";
    if(s.length < GN) s = s + ".".repeat(GN - s.length);
    else if(s.length > GN) s = s.slice(0, GN);
    out.push(s);
  }
  return out;
}
const CH2TE = { ".":TE.EMPTY, "B":TE.BRICK, "S":TE.STEEL, "W":TE.WATER, "T":TE.TREE, "I":TE.ICE };

/* 轻量地图预检：只把不可穿越地形当作硬障碍，砖块通路会被单独标记。 */
function validateStages(){
  const reports = [];
  for(let index=0; index<STAGES.length; index++){
    const rows = normalizeStage(STAGES[index].rows).map(row=>row.split(""));
    const clear = (gx, gy)=>{
      for(let y=gy; y<gy+2; y++) for(let x=gx; x<gx+2; x++){
        if(x>=0 && y>=0 && x<GN && y<GN) rows[y][x] = ".";
      }
    };
    for(const [gx,gy] of SPAWN_CELLS) clear(gx,gy);
    for(const [gx,gy] of PLAYER_SPAWNS) clear(gx,gy);
    clear(BASE_GX, BASE_GY);
    const hard = (x,y)=>{
      if(x<0 || y<0 || x+1>=GN || y+1>=GN) return true;
      for(let yy=y; yy<y+2; yy++) for(let xx=x; xx<x+2; xx++){
        if("BSW".includes(rows[yy][xx])) return true;
      }
      return false;
    };
    const key = (x,y)=>y*GN+x;
    const reachableFrom = (start)=>{
      const q=[start], seen=new Set([key(...start)]);
      while(q.length){
        const [x,y]=q.shift();
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=x+dx, ny=y+dy, k=key(nx,ny);
          if(!seen.has(k) && !hard(nx,ny)){ seen.add(k); q.push([nx,ny]); }
        }
      }
      return seen;
    };
    const escapes = SPAWN_CELLS.map(start=>{
      const seen=reachableFrom(start);
      let deep=false;
      for(const k of seen){ if(Math.floor(k/GN)>=8){ deep=true; break; } }
      return {start, size:seen.size, deep};
    });
    reports.push({stage:index+1, name:STAGES[index].en, totalNodes:escapes.reduce((n,e)=>n+e.size,0), escapes:escapes.filter(e=>e.deep).length, brickGates:escapes.filter(e=>!e.deep).length});
  }
  return reports;
}

class Field {
  constructor(){
    this.grid = new Uint8Array(GN*GN);
    this.mask = new Uint8Array(GN*GN);   // 砖块 8x8 子块位掩码
    this.baseAlive = true;
    this.shovelT = 0;                     // 铁锹剩余时间
    this.waterT = 0;
  }
  load(stage){
    const rows = normalizeStage(stage.rows);
    this.grid.fill(0); this.mask.fill(0);
    for(let gy=0; gy<GN; gy++){
      const line = rows[gy];
      for(let gx=0; gx<GN; gx++){
        const t = CH2TE[line[gx]];
        const i = gy*GN+gx;
        this.grid[i] = (t === undefined) ? TE.EMPTY : t;
        if(this.grid[i] === TE.BRICK) this.mask[i] = 0b1111;
      }
    }
    // 清空出生点
    for(const [gx,gy] of SPAWN_CELLS)    this.clearRect(gx,gy,2,2);
    for(const [gx,gy] of PLAYER_SPAWNS) this.clearRect(gx,gy,2,2);
    // 基地
    this.clearRect(BASE_GX, BASE_GY, 2, 2);
    for(let y=0;y<2;y++) for(let x=0;x<2;x++){
      this.grid[(BASE_GY+y)*GN + BASE_GX+x] = TE.BASE;
    }
    // 护墙
    this.buildWall(TE.BRICK);
    this.ensureSpawnExits();
    this.baseAlive = true; this.shovelT = 0;
  }
  clearRect(gx,gy,w,h){
    for(let y=gy;y<gy+h;y++) for(let x=gx;x<gx+w;x++){
      if(x<0||y<0||x>=GN||y>=GN) continue;
      this.grid[y*GN+x] = TE.EMPTY; this.mask[y*GN+x] = 0;
    }
  }
  buildWall(type){
    for(const [gx,gy] of BASE_WALL){
      const i = gy*GN+gx;
      this.grid[i] = type;
      this.mask[i] = (type === TE.BRICK) ? 0b1111 : 0;
    }
  }
  spawnHasEscape(gx, gy, depth=8){
    const key = (x,y)=>y*GN+x;
    const q=[[gx,gy]], seen=new Set([key(gx,gy)]);
    while(q.length){
      const [x,y]=q.shift();
      if(y >= depth) return true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy, k=key(nx,ny);
        if(nx<0||ny<0||nx>=GN-1||ny>=GN-1||seen.has(k)) continue;
        if(this.freeForTank(nx*G,ny*G,TS,TS)){ seen.add(k); q.push([nx,ny]); }
      }
    }
    return false;
  }
  ensureSpawnExits(){
    // 只修复没有任何深度出口的出生点，保留其余地图结构和障碍布局。
    for(const [gx,gy] of SPAWN_CELLS){
      if(this.spawnHasEscape(gx,gy,8)) continue;
      for(let y=gy+1; y<=8; y++) this.clearRect(gx,y,2,2);
    }
  }
  at(gx,gy){
    if(gx<0||gy<0||gx>=GN||gy>=GN) return TE.BORDER;
    return this.grid[gy*GN+gx];
  }
  /* 8px 子块是否阻挡坦克 */
  subBlockTank(sx,sy){
    if(sx<0||sy<0||sx>=GN*2||sy>=GN*2) return true;
    const gx = sx>>1, gy = sy>>1, i = gy*GN+gx;
    const t = this.grid[i];
    if(t === TE.BRICK){
      const bit = ((sy&1)<<1) | (sx&1);
      return !!(this.mask[i] & (1<<bit));
    }
    return t === TE.STEEL || t === TE.WATER || t === TE.BASE;
  }
  /* 8px 子块是否阻挡子弹 */
  subBlockBullet(sx,sy){
    if(sx<0||sy<0||sx>=GN*2||sy>=GN*2) return true;
    const gx = sx>>1, gy = sy>>1, i = gy*GN+gx;
    const t = this.grid[i];
    if(t === TE.BRICK){
      const bit = ((sy&1)<<1) | (sx&1);
      return !!(this.mask[i] & (1<<bit));
    }
    return t === TE.STEEL || t === TE.BASE;
  }
  /* 坦克矩形能否放置 */
  freeForTank(x,y,w,h){
    if(x < 0 || y < 0 || x+w > FS || y+h > FS) return false;
    const s0x = Math.floor(x/8), s1x = Math.floor((x+w-1)/8);
    const s0y = Math.floor(y/8), s1y = Math.floor((y+h-1)/8);
    for(let sy=s0y; sy<=s1y; sy++)
      for(let sx=s0x; sx<=s1x; sx++)
        if(this.subBlockTank(sx,sy)) return false;
    return true;
  }
  /* 是否在冰面上（取坦克中心） */
  onIce(x,y,w,h){
    const gx = ((x + w/2)/G)|0, gy = ((y + h/2)/G)|0;
    return this.at(gx,gy) === TE.ICE;
  }
  /* 是否被树覆盖 */
  inTrees(x,y,w,h){
    const gx = ((x + w/2)/G)|0, gy = ((y + h/2)/G)|0;
    return this.at(gx,gy) === TE.TREE;
  }
  /* 破坏：返回 {hit, destroyed, kind} */
  damageAt(sx, sy, dir, power){
    if(sx<0||sy<0||sx>=GN*2||sy>=GN*2) return {hit:true, kind:"border"};
    const gx = sx>>1, gy = sy>>1, i = gy*GN+gx;
    const t = this.grid[i];
    if(t === TE.BRICK){
      const bit = ((sy&1)<<1) | (sx&1);
      if(!(this.mask[i] & (1<<bit))) return {hit:false};
      // 破坏迎面整列/整行（2 个子块），贯穿感更接近原版
      let m = this.mask[i];
      if(dir === 0 || dir === 2){      // 垂直：破坏该子块所在行
        const row = (sy&1);
        m &= ~(0b0011 << (row*2));
      } else {                          // 水平：破坏该子块所在列
        const col = (sx&1);
        m &= ~((1<<col) | (1<<(col+2)));
      }
      this.mask[i] = m;
      if(m === 0) this.grid[i] = TE.EMPTY;
      return {hit:true, kind:"brick", gx, gy};
    }
    if(t === TE.STEEL){
      if(power >= 3){ this.grid[i] = TE.EMPTY; this.mask[i] = 0; return {hit:true, kind:"steelBreak", gx, gy}; }
      return {hit:true, kind:"steel", gx, gy};
    }
    if(t === TE.BASE){ return {hit:true, kind:"base", gx, gy}; }
    return {hit:false};
  }
  applyShovel(sec){
    this.shovelT = sec;
    this.buildWall(TE.STEEL);
  }
  update(dt){
    this.waterT += dt;
    if(this.shovelT > 0){
      this.shovelT -= dt;
      if(this.shovelT <= 0){ this.shovelT = 0; this.buildWall(TE.BRICK); }
    }
  }
}

class Explosion {
  constructor(x,y,scale,big){
    this.x=x; this.y=y; this.t=0; this.scale=scale||1; this.big=!!big;
    this.dur = big ? 0.62 : 0.34;
    this.dead = false;
    this.seed = rnd()*TAU;
    this.blobs = [];
    const n = big ? 7 : 4;
    for(let i=0;i<n;i++){
      const a = (i/n)*TAU + rnd()*0.7;
      const d = (big? 11 : 6) * (0.4 + rnd()*0.9);
      this.blobs.push({ax:Math.cos(a)*d, ay:Math.sin(a)*d, r:(big?9:6)*(0.55+rnd()*0.75), ph:rnd()*0.3});
    }
  }
  update(dt){ this.t += dt; if(this.t >= this.dur) this.dead = true; }
  render(x){
    const p = clamp(this.t/this.dur, 0, 1);
    x.save();
    x.translate(this.x, this.y);
    x.globalCompositeOperation = "lighter";
    for(const b of this.blobs){
      const bp = clamp((p - b.ph)/(1 - b.ph), 0, 1);
      if(bp <= 0) continue;
      const grow = Math.sin(bp*Math.PI*0.62);
      const r = b.r * this.scale * (0.35 + grow*1.15);
      const px = b.ax*this.scale*grow, py = b.ay*this.scale*grow;
      const a = (1-bp)*(1-bp);
      const g = x.createRadialGradient(px,py,0,px,py,Math.max(0.5,r));
      if(bp < 0.42){
        g.addColorStop(0, `rgba(255,255,235,${0.95*a})`);
        g.addColorStop(0.35, `rgba(255,210,90,${0.85*a})`);
        g.addColorStop(0.7, `rgba(255,110,30,${0.55*a})`);
        g.addColorStop(1, `rgba(120,30,0,0)`);
      } else {
        g.addColorStop(0, `rgba(255,170,60,${0.7*a})`);
        g.addColorStop(0.5, `rgba(200,70,20,${0.5*a})`);
        g.addColorStop(1, `rgba(60,20,10,0)`);
      }
      x.fillStyle = g;
      x.beginPath(); x.arc(px,py,Math.max(0.5,r),0,TAU); x.fill();
    }
    // 冲击环
    if(this.big && p < 0.5){
      const rp = p/0.5;
      x.globalCompositeOperation = "lighter";
      x.strokeStyle = `rgba(255,220,160,${(1-rp)*0.5})`;
      x.lineWidth = 2*(1-rp)+0.5;
      x.beginPath(); x.arc(0,0, 6 + rp*26*this.scale, 0, TAU); x.stroke();
    }
    x.restore();
  }
}
class Debris {
  constructor(x,y,col,vx,vy){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.col=col; this.life=0.35+rnd()*0.45; this.t=0; this.dead=false;
    this.s = 1 + rndi(2);
    this.rot = rnd()*TAU; this.vr = (rnd()-0.5)*10;
  }
  update(dt){
    this.t += dt;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.vy += 220*dt; this.vx *= 0.985;
    this.rot += this.vr*dt;
    if(this.t >= this.life) this.dead = true;
  }
  render(x){
    const a = 1 - this.t/this.life;
    x.save(); x.globalAlpha = clamp(a,0,1);
    x.fillStyle = this.col;
    x.translate(this.x, this.y); x.rotate(this.rot);
    x.fillRect(-this.s, -this.s, this.s*2, this.s*2);
    x.restore();
  }
}
