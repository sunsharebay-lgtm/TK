class Bullet {
  constructor(world, owner, dir, speed, power){
    this.w = world; this.owner = owner; this.dir = dir;
    this.speed = speed; this.power = power||1;
    this.isPlayer = owner.isPlayer;
    // 从炮口生成
    const cx = owner.x + TS/2, cy = owner.y + TS/2;
    this.x = cx + DX[dir]*(TS/2 - 1);
    this.y = cy + DY[dir]*(TS/2 - 1);
    this.dead = false;
    this.trail = [];
    this.age = 0;
  }
  get bx(){ return this.x - 2; }
  get by(){ return this.y - 2; }
  update(dt){
    this.age += dt;
    const dist = this.speed;
    const stepN = Math.max(1, Math.ceil(dist/3));
    const sp = dist/stepN;
    for(let s=0; s<stepN; s++){
      this.trail.push({x:this.x, y:this.y});
      if(this.trail.length > 5) this.trail.shift();
      this.x += DX[this.dir]*sp;
      this.y += DY[this.dir]*sp;
      if(this.checkHit()) return;
    }
  }
  checkHit(){
    const W = this.w;
    // 边界
    if(this.x < 0 || this.y < 0 || this.x > FS || this.y > FS){
      W.onBulletTerrain(this, "border");
      this.dead = true; return true;
    }
    // 地形：取前沿一层子块
    const f = W.field;
    const x0 = this.x-2, y0 = this.y-2, x1 = this.x+2, y1 = this.y+2;
    let cells = [];
    if(this.dir === 0){       // 上
      const sy = Math.floor(y0/8);
      cells = [[Math.floor(x0/8), sy],[Math.floor(x1/8), sy]];
    } else if(this.dir === 2){ // 下
      const sy = Math.floor(y1/8);
      cells = [[Math.floor(x0/8), sy],[Math.floor(x1/8), sy]];
    } else if(this.dir === 1){ // 右
      const sx = Math.floor(x1/8);
      cells = [[sx, Math.floor(y0/8)],[sx, Math.floor(y1/8)]];
    } else {                   // 左
      const sx = Math.floor(x0/8);
      cells = [[sx, Math.floor(y0/8)],[sx, Math.floor(y1/8)]];
    }
    let struck = null, seen = {};
    for(const [sx,sy] of cells){
      const key = sx+","+sy;
      if(seen[key]) continue; seen[key] = 1;
      if(!f.subBlockBullet(sx,sy)) continue;
      const r = f.damageAt(sx, sy, this.dir, this.power);
      if(r.hit) struck = r;
    }
    if(struck){
      W.onBulletTerrain(this, struck.kind, struck);
      this.dead = true; return true;
    }
    return false;
  }
  render(x){
    const spr = this.power >= 3 ? SPR.misc.bulletX : (this.isPlayer ? SPR.misc.bulletP : SPR.misc.bulletE);
    // 拖尾
    x.save(); x.globalCompositeOperation = "lighter";
    for(let i=0;i<this.trail.length;i++){
      const t = this.trail[i], a = (i+1)/this.trail.length*0.32;
      x.fillStyle = this.isPlayer ? `rgba(255,220,140,${a})` : `rgba(190,215,255,${a})`;
      x.fillRect(t.x-1.5, t.y-1.5, 3, 3);
    }
    // 光晕
    const g = x.createRadialGradient(this.x,this.y,0,this.x,this.y,7);
    const c = this.power>=3 ? "255,170,90" : (this.isPlayer ? "255,225,150" : "200,225,255");
    g.addColorStop(0, `rgba(${c},.55)`); g.addColorStop(1, `rgba(${c},0)`);
    x.fillStyle = g; x.beginPath(); x.arc(this.x,this.y,7,0,TAU); x.fill();
    x.restore();
    if(spr) x.drawImage(spr[this.dir], Math.round(this.x-4), Math.round(this.y-4));
  }
}

/* ---------------- 坦克基类 ---------------- */
class Tank {
  constructor(world, gx, gy, dir){
    this.w = world;
    this.x = gx*G; this.y = gy*G;
    this.w_ = TS; this.h_ = TS;
    this.dir = dir===undefined ? 2 : dir;
    this.speed = 1.0;
    this.bulletSpeed = 4.0;
    this.power = 1;
    this.maxBullets = 1;
    this.hp = 1;
    this.dead = false;
    this.isPlayer = false;
    this.moving = false;
    this.tread = 0; this.treadPhase = 0;
    this.shield = 0;            // 无敌时间
    this.spawnT = 0;            // 出生动画
    this.frozen = 0;
    this.slideV = 0;            // 冰面惯性
    this.slideDir = 2;
    this.fireCool = 0;
    this.bulletsOut = 0;
    this.flash = false;
    this.hitFlash = 0;
    this.wobble = 0;
  }
  get cx(){ return this.x + TS/2; }
  get cy(){ return this.y + TS/2; }
  get box(){ return {x:this.x, y:this.y, w:TS, h:TS}; }
  skinKey(){ return "basic"; }

  setDir(d){
    if(d === this.dir) return true;
    const wasH = (this.dir===1||this.dir===3), isH = (d===1||d===3);
    if(wasH !== isH){
      // 转向时只吸附到真实可占用的位置，避免把车体吸进墙体或另一辆坦克。
      const value = isH ? this.y : this.x;
      const aligned = [...new Set([
        Math.round(value/G)*G,
        Math.floor(value/G)*G,
        Math.ceil(value/G)*G
      ])].sort((a,b)=>Math.abs(a-value)-Math.abs(b-value));
      let found = false;
      for(const v of aligned){
        const nx = isH ? this.x : v;
        const ny = isH ? v : this.y;
        if(this.canOccupy(nx,ny)){ this.x=nx; this.y=ny; found=true; break; }
      }
      if(!found) return false;
    }
    this.dir = d;
    return true;
  }
  canOccupy(nx, ny){
    if(!this.w.field.freeForTank(nx, ny, TS, TS)) return false;
    for(const t of this.w.allTanks()){
      if(t === this || t.dead) continue;
      if(rectHit(nx,ny,TS,TS, t.x,t.y,TS,TS)) return false;
    }
    return true;
  }
  advance(dist){
    let moved = 0;
    const sp = 0.5;
    while(moved < dist - 1e-6){
      const s = Math.min(sp, dist - moved);
      const nx = this.x + DX[this.dir]*s;
      const ny = this.y + DY[this.dir]*s;
      if(this.canOccupy(nx, ny)){ this.x = nx; this.y = ny; moved += s; }
      else break;
    }
    if(moved > 0){
      this.treadPhase += moved;
      if(this.treadPhase >= 4){ this.treadPhase -= 4; this.tread ^= 1; }
      // 履带痕迹
      if(rnd() < 0.10 && this.w.field.at((this.cx/G)|0, (this.cy/G)|0) !== TE.ICE){
        this.w.tracks.push({x:this.cx, y:this.cy, dir:this.dir, t:0});
        if(this.w.tracks.length > 90) this.w.tracks.shift();
      }
    }
    return moved > 0;
  }
  tryFire(){
    if(this.fireCool > 0 || this.bulletsOut >= this.maxBullets) return false;
    const b = new Bullet(this.w, this, this.dir, this.bulletSpeed, this.power);
    this.w.bullets.push(b);
    this.bulletsOut++;
    this.fireCool = this.isPlayer ? 0.10 : 0.18;
    this.wobble = 1;
    // 炮口火光
    const mx = this.cx + DX[this.dir]*(TS/2), my = this.cy + DY[this.dir]*(TS/2);
    this.w.fx.push(new Ripple(mx,my, this.isPlayer?"#ffd88a":"#cfe0f7", 9, 0.2));
    for(let i=0;i<3;i++){
      const a = Math.atan2(DY[this.dir],DX[this.dir]) + (rnd()-0.5)*0.9;
      this.w.fx.push(new Spark(mx,my,a, 40+rnd()*70, this.isPlayer?"#ffe9a8":"#dfe7f2", 0.16));
    }
    Snd.sfx(this.power>=3 ? "shootBig" : "shoot");
    return true;
  }
  onBulletGone(){ this.bulletsOut = Math.max(0, this.bulletsOut-1); }

  takeHit(bullet){
    if(this.shield > 0 || this.spawnT > 0) return "shielded";
    this.hp--;
    this.hitFlash = 0.14;
    if(this.hp <= 0){ this.destroy(); return "killed"; }
    Snd.sfx("hitArmor");
    // 受击火花
    for(let i=0;i<6;i++){
      const a = Math.atan2(-DY[bullet.dir],-DX[bullet.dir]) + (rnd()-0.5)*1.6;
      this.w.fx.push(new Spark(bullet.x,bullet.y,a, 50+rnd()*90, "#ffd0a0", 0.22));
    }
    return "damaged";
  }
  destroy(){
    if(this.dead) return;
    this.dead = true;
    this.w.fx.push(new Explosion(this.cx, this.cy, 1.25, true));
    for(let i=0;i<14;i++){
      const a = rnd()*TAU, s = 40+rnd()*150;
      this.w.fx.push(new Debris(this.cx, this.cy, pick(["#8a94a8","#4f5a6e","#c8d2e2","#2b3241"]),
                                Math.cos(a)*s, Math.sin(a)*s - 40));
    }
    for(let i=0;i<5;i++) this.w.fx.push(new Smoke(this.cx+(rnd()-0.5)*12, this.cy+(rnd()-0.5)*12, 4, 1.0));
    Snd.sfx("expBig");
    this.w.shake(6, 0.28);
  }
  baseUpdate(dt){
    if(this.fireCool > 0) this.fireCool -= dt;
    if(this.shield > 0)   this.shield -= dt;
    if(this.hitFlash > 0) this.hitFlash -= dt;
    if(this.wobble > 0)   this.wobble = Math.max(0, this.wobble - dt*6);
    if(this.spawnT > 0){ this.spawnT -= dt; return true; }
    return false;
  }
  /* 冰面滑行处理，返回是否发生了移动 */
  applyMotion(dt, wantMove, wantDir){
    const onIce = this.w.field.onIce(this.x, this.y, TS, TS);
    let moved = false;
    if(wantMove){
      if(wantDir !== this.dir && !this.setDir(wantDir)){
        this.moving = false;
        this.slideV = 0;
        return false;
      }
      moved = this.advance(this.speed);
      if(onIce){ this.slideV = this.speed; this.slideDir = this.dir; }
      else this.slideV = 0;
    } else if(onIce && this.slideV > 0.02){
      const keep = this.dir;
      this.dir = this.slideDir;
      moved = this.advance(this.slideV);
      this.dir = keep;
      this.slideV *= 0.955;
      if(!moved) this.slideV = 0;
    } else {
      this.slideV = 0;
    }
    this.moving = moved;
    return moved;
  }
  renderShield(x){
    const t = this.w.time*7;
    x.save();
    x.translate(this.cx, this.cy);
    x.globalCompositeOperation = "lighter";
    for(let k=0;k<2;k++){
      const rot = t*(k? -1: 1);
      x.save(); x.rotate(rot);
      x.strokeStyle = k? "rgba(140,230,255,.85)" : "rgba(255,255,255,.7)";
      x.lineWidth = 1.6;
      for(let i=0;i<4;i++){
        const a0 = i*TAU/4 + 0.15, a1 = a0 + 0.95;
        x.beginPath(); x.arc(0,0, 18 - k*2.5, a0, a1); x.stroke();
      }
      x.restore();
    }
    // 电弧粒子
    for(let i=0;i<3;i++){
      const a = t*2.4 + i*TAU/3;
      const px = Math.cos(a)*18, py = Math.sin(a)*18;
      x.fillStyle = "rgba(190,245,255,.9)";
      x.fillRect(px-1, py-1, 2, 2);
    }
    x.restore();
  }
  renderSpawn(x){
    const p = 1 - this.spawnT/this.spawnDur;
    x.save();
    x.translate(this.cx, this.cy);
    x.globalCompositeOperation = "lighter";
    const rot = this.w.time*10;
    for(let k=0;k<2;k++){
      x.save(); x.rotate(rot*(k?-1:1) + k*0.8);
      const r = 16 - k*4;
      const col = k ? "rgba(120,230,255,.9)" : "rgba(255,255,255,.95)";
      x.strokeStyle = col; x.lineWidth = 2;
      x.beginPath();
      for(let i=0;i<8;i++){
        const a = i*TAU/8, rr2 = (i%2? r*0.42 : r);
        const px = Math.cos(a)*rr2, py = Math.sin(a)*rr2;
        i? x.lineTo(px,py) : x.moveTo(px,py);
      }
      x.closePath(); x.stroke();
      x.restore();
    }
    const g = x.createRadialGradient(0,0,0,0,0,20);
    g.addColorStop(0, `rgba(190,245,255,${0.5*(1-p)+0.15})`);
    g.addColorStop(1, "rgba(120,200,255,0)");
    x.fillStyle = g; x.beginPath(); x.arc(0,0,20,0,TAU); x.fill();
    x.restore();
  }
  render(x){
    if(this.spawnT > 0){ this.renderSpawn(x); return; }
    const key = this.skinKey();
    const set = SPR.tanks[key] || SPR.tanks.basic;
    const img = set[this.tread][this.dir];
    let px = Math.round(this.x), py = Math.round(this.y);
    if(this.wobble > 0){
      px -= Math.round(DX[this.dir]*this.wobble*1.6);
      py -= Math.round(DY[this.dir]*this.wobble*1.6);
    }
    // 投影
    x.save();
    x.globalAlpha = 0.28; x.fillStyle = "#000";
    x.beginPath(); x.ellipse(this.cx, this.y+TS-2, 13, 5, 0, 0, TAU); x.fill();
    x.restore();
    if(img) x.drawImage(img, px, py);
    // 受击白闪
    if(this.hitFlash > 0 && img){
      x.save();
      x.globalCompositeOperation = "lighter";
      x.globalAlpha = clamp(this.hitFlash/0.14, 0, 1)*0.85;
      x.drawImage(img, px, py);
      x.restore();
    }
    // 闪红（带道具）
    if(this.flash){
      const on = Math.floor(this.w.time*7) % 2 === 0;
      if(on && img){
        x.save();
        x.globalCompositeOperation = "lighter";
        x.globalAlpha = 0.5;
        x.fillStyle = "#ff3a4e";
        x.fillRect(px+4, py+4, TS-8, TS-8);
        x.restore();
      }
    }
    if(this.shield > 0) this.renderShield(x);
  }
}

/* ---------------- 玩家 ---------------- */
class Player extends Tank {
  constructor(world, index){
    const [gx,gy] = PLAYER_SPAWNS[index];
    super(world, gx, gy, 0);
    this.isPlayer = true;
    this.index = index;
    this.level = 0;
    this.lives = 3;
    this.score = 0;
    this.kills = [0,0,0,0];
    this.spawnDur = 1.0;
    this.spawnT = this.spawnDur;
    this.shield = 5.0;
    this.applyLevel();
    this.active = true;
    this.deadTimer = 0;
    this.gone = false;   // 生命耗尽
  }
  skinKey(){ return this.index === 0 ? "p1" : "p2"; }
  applyLevel(){
    this.speed = PLAYER_SPEED;
    this.maxBullets = this.level >= 2 ? 2 : 1;
    this.bulletSpeed = this.level >= 1 ? 6.5 : 4.0;
    this.power = this.level >= 3 ? 3 : 1;
    this.hp = 1;
  }
  levelUp(){
    if(this.level < 3){ this.level++; this.applyLevel(); Snd.sfx("levelUp"); }
    else { this.score += 500; }
  }
  levelDown(){
    if(this.level > 0){ this.level--; this.applyLevel(); }
  }
  respawn(){
    const [gx,gy] = PLAYER_SPAWNS[this.index];
    this.x = gx*G; this.y = gy*G;
    this.dir = 0; this.dead = false;
    this.spawnT = this.spawnDur; this.shield = 5.0;
    this.bulletsOut = 0; this.fireCool = 0;
    this.slideV = 0; this.moving = false;
    // 死亡只掉一级火力，跨关继承的等级不会被直接清空。
    this.level = Math.max(0, this.level - 1);
    this.applyLevel();
  }
  destroy(){
    if(this.dead) return;
    super.destroy();
    this.lives--;
    this.deadTimer = 1.1;
    if(this.lives <= 0){ this.lives = 0; this.gone = true; }
  }
  update(dt, input){
    if(this.gone) return;
    if(this.dead){
      this.deadTimer -= dt;
      if(this.deadTimer <= 0 && this.lives > 0) this.respawn();
      return;
    }
    if(this.baseUpdate(dt)) return;
    let wantDir = this.dir, wantMove = false;
    if(input.up){ wantDir = 0; wantMove = true; }
    else if(input.dn){ wantDir = 2; wantMove = true; }
    else if(input.lf){ wantDir = 3; wantMove = true; }
    else if(input.rt){ wantDir = 1; wantMove = true; }
    this.applyMotion(dt, wantMove, wantDir);
    if(input.fire && this.fireCool <= 0) this.tryFire();
  }
}

/* ---------------- 敌人 ---------------- */
class Enemy extends Tank {
  constructor(world, spawnIdx, typeIdx, flash, spawnCell){
    const [gx,gy] = spawnCell || SPAWN_CELLS[spawnIdx % SPAWN_CELLS.length];
    super(world, gx, gy, 2);
    const d = ENEMY_DEF[typeIdx];
    this.typeIdx = typeIdx;
    this.def = d;
    this.speed = d.speed;
    this.bulletSpeed = d.bulletSpeed;
    this.hp = d.hp; this.maxHp = d.hp;
    this.maxBullets = (typeIdx === 2) ? 1 : 1;
    this.flash = !!flash;
    this.spawnDur = 1.05;
    this.spawnT = this.spawnDur;
    this.think = 0;
    this.aiMove = true;
    this.aiDir = 2;
    this.stuck = 0;
    this.aggr = world.aggression;
    this.pauseT = 0;
    this.path = [];
    this.pathTarget = null;
    this.trafficId = world.nextTrafficId++;
    this.egressT = 3.2;       // 出生后优先驶离通道，避免新旧坦克在入口互顶
    this.egressBlockedT = 0;
    this.egressDepth = (gy + 8) * G;
    this.progressT = 0;
    this.progressX = this.x;
    this.progressY = this.y;
    this.recoveryDir = -1;
  }
  skinKey(){
    if(this.typeIdx === 3) return "armor" + clamp(this.hp,1,4);
    return this.def.key;
  }
  destroy(){
    if(this.dead) return;
    super.destroy();
    this.w.onEnemyKilled(this);
  }
  takeHit(bullet){
    const r = super.takeHit(bullet);
    if(r === "damaged" && this.typeIdx === 3){
      // 装甲车受伤时短暂后退
      this.pauseT = 0.12;
    }
    return r;
  }
  /* 目标点：基地 或 最近玩家 */
  pickTarget(){
    const base = {x:(BASE_GX+1)*G, y:(BASE_GY+1)*G};
    const ps = this.w.players.filter(p=>p && !p.dead && !p.gone && p.spawnT<=0);
    if(ps.length && rnd() < this.aggr.playerBias){
      let best = ps[0], bd = 1e9;
      for(const p of ps){
        const d = Math.abs(p.cx-this.cx) + Math.abs(p.cy-this.cy);
        if(d < bd){ bd = d; best = p; }
      }
      return {x:best.cx, y:best.cy, isPlayer:true};
    }
    return {x:base.x, y:base.y, isPlayer:false};
  }
  stepPosition(d){
    let nx = this.x + DX[d]*Math.max(2,this.speed);
    let ny = this.y + DY[d]*Math.max(2,this.speed);
    // 转向前先对齐另一轴，测试位置必须和真实移动使用同一套规则。
    if(d===0 || d===2) nx = Math.round(this.x/G)*G;
    else ny = Math.round(this.y/G)*G;
    return {nx,ny};
  }
  canStep(d, avoidTanks=false){
    const {nx,ny} = this.stepPosition(d);
    if(!this.w.field.freeForTank(nx, ny, TS, TS)) return false;
    if(avoidTanks){
      for(const t of this.w.allTanks()){
        // 出生动画仍占据实体空间，规划时也必须避开，避免入口处反复互顶。
        if(t===this || t.dead) continue;
        if(rectHit(nx,ny,TS,TS,t.x,t.y,TS,TS)) return false;
      }
    }
    return true;
  }
  trafficBlocksNode(gx,gy){
    const x=gx*G, y=gy*G;
    for(const t of this.w.allTanks()){
      if(t===this || t.dead) continue;
      if(rectHit(x,y,TS,TS,t.x,t.y,TS,TS)) return true;
    }
    return false;
  }
  nodeAt(x,y){
    return [clamp(Math.round(x/G),0,GN-2), clamp(Math.round(y/G),0,GN-2)];
  }
  routeGoals(target){
    const goals=[];
    if(target && target.isPlayer){
      const [gx,gy] = this.nodeAt(target.x,target.y);
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
        const x=gx+dx, y=gy+dy;
        if(x>=0&&y>=0&&x<GN-1&&y<GN-1) goals.push([x,y]);
      }
    }else{
      // 基地本体不可驶入，目标取基地上方、左右两侧可停车的位置。
      for(let y=BASE_GY-4;y<=BASE_GY+1;y++) for(let x=BASE_GX-3;x<=BASE_GX+3;x++){
        if(x>=0&&y>=0&&x<GN-1&&y<GN-1) goals.push([x,y]);
      }
    }
    return goals;
  }
  findPathDirection(){
    const target = this.pickTarget();
    const [sx,sy] = this.nodeAt(this.x,this.y);
    const startKey = (x,y)=>y*GN+x;
    const start = [sx,sy];
    const queue=[start], prev=new Map([[startKey(sx,sy),null]]);
    const goals = new Set(this.routeGoals(target).map(([x,y])=>startKey(x,y)));
    let goalKey = goals.has(startKey(sx,sy)) ? startKey(sx,sy) : null;
    while(queue.length && goalKey === null){
      const [x,y]=queue.shift();
      for(const d of [0,1,2,3]){
        const nx=x+DX[d], ny=y+DY[d], k=startKey(nx,ny);
        if(nx<0||ny<0||nx>=GN-1||ny>=GN-1||prev.has(k)) continue;
        if(!this.w.field.freeForTank(nx*G,ny*G,TS,TS)) continue;
        if(this.trafficBlocksNode(nx,ny)) continue;
        prev.set(k,startKey(x,y)); queue.push([nx,ny]);
        if(goals.has(k)){ goalKey=k; break; }
      }
    }
    if(goalKey === null) return null;
    let cursor=goalKey, parent=prev.get(cursor);
    while(parent !== null && parent !== startKey(sx,sy)){ cursor=parent; parent=prev.get(cursor); }
    if(parent === null) return this.dir;
    const nx=cursor%GN, ny=Math.floor(cursor/GN);
    if(nx>sx) return 1; if(nx<sx) return 3; if(ny>sy) return 2; if(ny<sy) return 0;
    return this.dir;
  }
  chooseDir(){
    const routeDir = this.findPathDirection();
    if(routeDir !== null && this.canStep(routeDir, true)) return routeDir;
    const tgt = this.pickTarget();
    const dxv = tgt.x - this.cx, dyv = tgt.y - this.cy;
    const opts = [];
    for(let d=0; d<4; d++){
      if(!this.canStep(d, true)) continue;
      let wgt = 1;
      if(d===0 && dyv < -6) wgt += 3.0;
      if(d===2 && dyv >  6) wgt += 3.0;
      if(d===3 && dxv < -6) wgt += 3.0;
      if(d===1 && dxv >  6) wgt += 3.0;
      // 主轴优先
      if(Math.abs(dxv) > Math.abs(dyv)){ if(d===1||d===3) wgt += 1.1; }
      else { if(d===0||d===2) wgt += 1.1; }
      if(d === this.dir) wgt += 1.4;
      if(d === OPP[this.dir]) wgt *= 0.28;
      if(d === this.recoveryDir) wgt *= 0.62;
      wgt *= (1 - this.aggr.chaos) + rnd()*this.aggr.chaos*2.2;
      opts.push({d, wgt});
    }
    if(!opts.length) return null;
    let tot = 0; for(const o of opts) tot += o.wgt;
    let r = rnd()*tot;
    for(const o of opts){ r -= o.wgt; if(r <= 0) return o.d; }
    return opts[opts.length-1].d;
  }
  chooseRecoveryDir(){
    const opts=[];
    for(let d=0;d<4;d++){
      if(!this.canStep(d,true)) continue;
      const {nx,ny}=this.stepPosition(d);
      let nearest=999;
      for(const t of this.w.allTanks()){
        if(t===this || t.dead) continue;
        nearest=Math.min(nearest,Math.abs((nx+TS/2)-t.cx)+Math.abs((ny+TS/2)-t.cy));
      }
      let open=0, tx=nx, ty=ny;
      for(let k=0;k<4;k++){
        tx += DX[d]*G; ty += DY[d]*G;
        if(!this.w.field.freeForTank(tx,ty,TS,TS)) break;
        open++;
      }
      let score=open*24 + nearest*0.12;
      if(d===OPP[this.dir]) score+=9;
      if(d===this.recoveryDir) score-=18;
      score += rnd()*4;
      opts.push({d,score});
    }
    if(!opts.length) return null;
    opts.sort((a,b)=>b.score-a.score);
    return opts[0].d;
  }
  /* 前方直线是否可打到目标（玩家或基地） */
  lineOfFire(){
    const f = this.w.field;
    let px = this.cx, py = this.cy;
    const step = 8;
    for(let i=0;i<64;i++){
      px += DX[this.dir]*step; py += DY[this.dir]*step;
      if(px<0||py<0||px>FS||py>FS) return false;
      const sx = (px/8)|0, sy = (py/8)|0;
      const gx = sx>>1, gy = sy>>1;
      const t = f.at(gx,gy);
      if(t === TE.STEEL) return false;
      if(t === TE.BASE)  return true;
      if(t === TE.BRICK){
        // 砖可打穿，但降低意愿
        if(i > 6) return false;
      }
      for(const p of this.w.players){
        if(!p || p.dead || p.gone || p.spawnT>0) continue;
        if(px > p.x && px < p.x+TS && py > p.y && py < p.y+TS) return true;
      }
    }
    return false;
  }
  update(dt){
    if(this.baseUpdate(dt)) return;
    if(this.w.freezeT > 0){ this.moving = false; return; }
    if(this.pauseT > 0){ this.pauseT -= dt; this.moving = false; return; }

    // 出生保护：先沿通道向下脱离出生区，再开始常规寻路。
    if(this.egressT > 0){
      let moved = false;
      if(this.canStep(2, true)){
        this.aiDir = 2;
        moved = this.applyMotion(dt, true, 2);
      }
      if(!moved){
        const escape = [1,3,0].find(d=>this.canStep(d, true));
        if(escape !== undefined){ this.aiDir = escape; moved = this.applyMotion(dt, true, escape); }
      }
      if(moved){
        this.egressT -= dt;
        this.egressBlockedT = 0;
        if(this.y >= this.egressDepth) this.egressT = 0;
      }else{
        this.egressBlockedT += dt;
        if(this.egressBlockedT > 2.2) this.egressT = 0;
      }
      if(this.egressT > 0) return;
    }

    this.think -= dt;
    if(this.think <= 0){
      this.think = this.aggr.thinkMin + rnd()*this.aggr.thinkVar;
      this.aiDir = this.chooseDir();
    }
    // 撞墙或被其他坦克挡住时立刻重选，避免在窄道里互相顶住。
    if(this.aiDir === null || !this.canStep(this.aiDir, true)){
      this.aiDir = this.chooseDir();
      this.think = 0.12 + rnd()*0.22;
    }
    const before = {x:this.x, y:this.y};
    if(this.aiDir !== null) this.applyMotion(dt, true, this.aiDir);
    else this.moving = false;
    if(Math.abs(this.x-before.x) < 0.01 && Math.abs(this.y-before.y) < 0.01){
      this.stuck += dt;
      if(this.stuck > 0.38){
        const escape = this.chooseRecoveryDir();
        if(escape !== null){ this.recoveryDir=this.dir; this.aiDir=escape; }
        this.think = 0.08; this.stuck = 0;
      }
    } else this.stuck = 0;

    // 位置看门狗：持续移动却只在小范围打转时，强制选择更开阔的方向。
    this.progressT += dt;
    if(this.progressT >= 1.6){
      const progress=Math.abs(this.x-this.progressX)+Math.abs(this.y-this.progressY);
      if(progress < G*1.15){
        const escape=this.chooseRecoveryDir();
        if(escape !== null){ this.recoveryDir=this.dir; this.aiDir=escape; this.think=0.5; }
      }
      this.progressX=this.x; this.progressY=this.y; this.progressT=0;
    }

    // 开火
    let p = this.def.fireRate * this.aggr.fireMul;
    if(this.lineOfFire()) p *= 2.8;
    if(rnd() < p) this.tryFire();
  }
}

/* ---------------- 道具 ---------------- */
class PowerUp {
  constructor(world, type, x, y){
    this.w = world; this.type = type;
    this.x = x; this.y = y; this.size = 28;
    this.t = 0; this.life = 22; this.dead = false;
    this.bob = rnd()*TAU;
  }
  get box(){ return {x:this.x, y:this.y, w:this.size, h:this.size}; }
  update(dt){
    this.t += dt; this.bob += dt*3;
    if(this.t >= this.life) this.dead = true;
  }
  render(x){
    const blink = this.t > this.life-4 ? (Math.floor(this.t*8)%2===0) : true;
    if(!blink) return;
    const img = SPR.items[this.type];
    const oy = Math.sin(this.bob)*1.5;
    // 光晕
    x.save();
    x.globalCompositeOperation = "lighter";
    const gr = 22 + Math.sin(this.bob*1.4)*4;
    const g = x.createRadialGradient(this.x+14, this.y+14+oy, 0, this.x+14, this.y+14+oy, gr);
    g.addColorStop(0, "rgba(255,225,140,.38)");
    g.addColorStop(1, "rgba(255,190,80,0)");
    x.fillStyle = g;
    x.beginPath(); x.arc(this.x+14, this.y+14+oy, gr, 0, TAU); x.fill();
    x.restore();
    if(img) x.drawImage(img, Math.round(this.x), Math.round(this.y+oy));
  }
}

/* ============================================================
   P8 · 世界：实体管理 / 碰撞 / 关卡流程
   ============================================================ */
function difficultyFor(stage, loop){
  const s = stage + loop*STAGES.length;
  return {
    playerBias: clamp(0.18 + s*0.028, 0.18, 0.62),
    chaos:      clamp(0.55 - s*0.024, 0.16, 0.55),
    fireMul:    clamp(0.85 + s*0.075, 0.85, 2.4),
    thinkMin:   clamp(0.85 - s*0.032, 0.28, 0.85),
    thinkVar:   clamp(1.15 - s*0.045, 0.35, 1.15),
    spawnGap:   clamp(3.4 - s*0.12, 1.4, 3.4),
    maxActive:  clamp(4 + Math.floor(s/4), 4, 7)
  };
}

class World {
  constructor(game, stageIndex, loop, twoP, carry){
    this.game = game;
    this.stageIndex = stageIndex;
    this.loop = loop || 0;
    this.stage = STAGES[stageIndex % STAGES.length];
    this.twoP = !!twoP;
    this.field = new Field();
    this.field.load(this.stage);
    this.aggression = difficultyFor(stageIndex, this.loop);

    this.players = [];
    const n = twoP ? 2 : 1;
    for(let i=0;i<n;i++){
      const p = new Player(this, i);
      if(carry && carry[i]){
        p.lives = carry[i].lives;
        p.score = carry[i].score;
        p.kills = carry[i].kills.slice();
        p.level = clamp(carry[i].level || 0, 0, 3);
        p.applyLevel();
        p.gone  = carry[i].gone;
        if(p.gone){ p.dead = true; }
      }
      this.players.push(p);
    }

    this.enemies = [];
    this.nextTrafficId = 1;
    this.bullets = [];
    this.fx = [];
    this.powerups = [];
    this.tracks = [];

    // 敌人队列
    this.queue = [];
    const cfg = this.stage.enemies;
    for(let t=0;t<4;t++) for(let i=0;i<cfg[t];i++) this.queue.push(t);
    // 洗牌但保持大致递增难度：分三段各自洗牌
    const seg = Math.ceil(this.queue.length/3);
    const out = [];
    for(let s=0;s<3;s++){
      const part = this.queue.slice(s*seg, (s+1)*seg);
      for(let i=part.length-1;i>0;i--){ const j = rndi(i+1); const tmp=part[i]; part[i]=part[j]; part[j]=tmp; }
      out.push(...part);
    }
    this.queue = out;
    this.totalEnemies = this.queue.length;
    this.spawnedCount = 0;
    this.spawnT = 0.6;
    this.spawnIdx = 0;

    this.freezeT = 0;
    this.baseShieldT = 0;
    this.time = 0;
    this.shakeAmt = 0; this.shakeT = 0; this.shakeDur = 1;
    this.over = false; this.cleared = false;
    this.endTimer = 0;
    this.baseHitFlash = 0;
    this.combo = 0; this.comboT = 0;
    this.stats = { shots:0, hits:0 };
  }

  allTanks(){
    const a = [];
    for(const p of this.players) if(p && !p.dead && !p.gone) a.push(p);
    for(const e of this.enemies) if(!e.dead) a.push(e);
    return a;
  }
  aliveEnemies(){ return this.enemies.filter(e=>!e.dead).length; }
  remaining(){ return this.queue.length + this.aliveEnemies(); }
  activePlayers(){ return this.players.filter(p=>p && !p.gone); }

  shake(amt, dur){
    this.shakeAmt = Math.max(this.shakeAmt, amt);
    this.shakeDur = dur||0.3; this.shakeT = this.shakeDur;
  }

  /* ---- 生成敌人 ---- */
  trySpawn(dt){
    if(!this.queue.length) return;
    if(this.aliveEnemies() >= this.aggression.maxActive) return;
    this.spawnT -= dt;
    if(this.spawnT > 0) return;
    // 找一个未被占用的出生点
    let placed = false;
    for(let k=0;k<SPAWN_CELLS.length && !placed;k++){
      const si = (this.spawnIdx + k) % SPAWN_CELLS.length;
      const spawnCell = SPAWN_CELLS[si];
      const [gx,gy] = spawnCell;
      const px = gx*G, py = gy*G;
      let blocked = false;
      for(const t of this.allTanks()){
        if(rectHit(px,py,TS,TS, t.x,t.y,TS,TS)){ blocked = true; break; }
      }
      // 同一出生通道保持单车通行，前车驶出安全深度后才允许补车。
      if(!blocked){
        for(const e of this.enemies){
          if(e.dead) continue;
          if(Math.abs(e.x-px) < TS+G && e.y < py + 8*G){ blocked = true; break; }
        }
      }
      if(blocked) continue;
      const typeIdx = this.queue.shift();
      const flash = FLASH_INDEX.includes(this.spawnedCount);
      const e = new Enemy(this, si, typeIdx, flash, spawnCell);
      this.enemies.push(e);
      this.spawnedCount++;
      this.spawnIdx = (si + 1) % SPAWN_CELLS.length;
      placed = true;
    }
    this.spawnT = placed ? this.aggression.spawnGap : 0.4;
  }

  /* ---- 事件 ---- */
  onBulletTerrain(b, kind, info){
    b.owner.onBulletGone();
    const x = b.x, y = b.y;
    if(kind === "brick"){
      Snd.sfx("brick");
      for(let i=0;i<7;i++){
        const a = Math.atan2(-DY[b.dir],-DX[b.dir]) + (rnd()-0.5)*2.1;
        const s = 40 + rnd()*130;
        this.fx.push(new Debris(x,y, pick(["#c4643a","#a04b26","#7d3418","#5c2411"]),
                                Math.cos(a)*s, Math.sin(a)*s - 30));
      }
      this.fx.push(new Ripple(x,y,"#e08a55",10,0.22));
      this.fx.push(new Smoke(x,y,3,0.5));
    } else if(kind === "steel"){
      Snd.sfx("steel");
      for(let i=0;i<6;i++){
        const a = Math.atan2(-DY[b.dir],-DX[b.dir]) + (rnd()-0.5)*1.9;
        this.fx.push(new Spark(x,y,a, 70+rnd()*140, "#dfe7f2", 0.2));
      }
      this.fx.push(new Ripple(x,y,"#cfe0f7",8,0.16));
    } else if(kind === "steelBreak"){
      Snd.sfx("expSmall");
      for(let i=0;i<10;i++){
        const a = rnd()*TAU, s = 50+rnd()*150;
        this.fx.push(new Debris(x,y, pick(["#d7dee9","#98a3b5","#4c5568"]), Math.cos(a)*s, Math.sin(a)*s-40));
      }
      this.fx.push(new Explosion(x,y,0.7,false));
      this.shake(3,0.16);
    } else if(kind === "base"){
      this.destroyBase();
    } else if(kind === "border"){
      Snd.sfx("steel");
      for(let i=0;i<4;i++){
        const a = Math.atan2(-DY[b.dir],-DX[b.dir]) + (rnd()-0.5)*1.7;
        this.fx.push(new Spark(x,y,a, 50+rnd()*90, "#aebbd0", 0.16));
      }
    }
  }
  destroyBase(){
    if(!this.field.baseAlive) return;
    if(this.baseShieldT > 0){
      this.fx.push(new Ripple((BASE_GX+1)*G,(BASE_GY+1)*G,"#9adcff",16,0.28));
      this.game.toast("基地护盾生效");
      Snd.sfx("steel");
      return;
    }
    this.field.baseAlive = false;
    const bx = (BASE_GX+1)*G, by = (BASE_GY+1)*G;
    this.fx.push(new Explosion(bx,by,2.2,true));
    for(let i=0;i<26;i++){
      const a = rnd()*TAU, s = 60+rnd()*220;
      this.fx.push(new Debris(bx,by, pick(["#e0b64a","#f2f6ff","#3b4a63","#8a6a1c"]),
                              Math.cos(a)*s, Math.sin(a)*s-70));
    }
    for(let i=0;i<9;i++) this.fx.push(new Smoke(bx+(rnd()-0.5)*22, by+(rnd()-0.5)*22, 6, 1.5));
    Snd.sfx("expBig");
    this.shake(13, 0.75);
    this.game.flash(0.6);
    this.endGame(false);
  }
  activateBaseShield(sec=10){
    this.baseShieldT = Math.max(this.baseShieldT, sec);
    this.fx.push(new Ripple((BASE_GX+1)*G,(BASE_GY+1)*G,"#9adcff",22,0.5));
    this.game.toast("基地无敌 · " + Math.ceil(this.baseShieldT) + " 秒");
    Snd.sfx("shield");
  }
  grantMaxPower(index=0){
    const p = this.players[index] || this.players[0];
    if(!p || p.gone) return;
    p.level = 3;
    p.applyLevel();
    p.shield = Math.max(p.shield, 5);
    this.game.toast("满级火力");
    Snd.sfx("levelUp");
  }
  clearActiveEnemies(index=0){
    let n = 0;
    for(const e of this.enemies){
      if(e.dead) continue;
      e._lastHitBy = index;
      e.destroy();
      n++;
    }
    this.game.flash(0.45);
    this.shake(11, 0.5);
    this.game.toast("全域清扫 · 击破 " + n + " 辆");
    Snd.sfx("expBig");
  }
  onEnemyKilled(e){
    const shooterIdx = e._lastHitBy === undefined ? 0 : e._lastHitBy;
    const p = this.players[shooterIdx] || this.players[0];
    const sc = e.def.score;
    if(p){ p.score += sc; p.kills[e.typeIdx]++; }
    this.fx.push(new ScorePop(e.cx, e.cy - 6, sc, "#ffe9a8"));
    if(e.flash) this.dropPowerUp();
    if(!this.queue.length && this.aliveEnemies() === 0) this.checkClear();
  }
  dropPowerUp(){
    // 找一个合适的空位
    let bx = 0, by = 0, ok = false;
    for(let tries=0; tries<160; tries++){
      const gx = 1 + rndi(GN-3), gy = 1 + rndi(GN-3);
      // 远离基地
      if(Math.abs(gx-BASE_GX) < 4 && Math.abs(gy-BASE_GY) < 4) continue;
      const t0 = this.field.at(gx,gy), t1 = this.field.at(gx+1,gy),
            t2 = this.field.at(gx,gy+1), t3 = this.field.at(gx+1,gy+1);
      const bad = [TE.STEEL, TE.WATER, TE.BASE, TE.BORDER];
      if(bad.includes(t0)||bad.includes(t1)||bad.includes(t2)||bad.includes(t3)) continue;
      bx = gx*G + 2; by = gy*G + 2; ok = true; break;
    }
    if(!ok){ bx = 4*G; by = 10*G; }
    const type = pick(ITEM_TYPES);
    // 移除旧道具（原版同时只有一个）
    this.powerups.length = 0;
    this.powerups.push(new PowerUp(this, type, bx, by));
    Snd.sfx("powerAppear");
  }
  applyPowerUp(pu, p){
    p.score += 500;
    this.fx.push(new ScorePop(pu.x+14, pu.y+4, "500", "#9be8ff"));
    switch(pu.type){
      case "helmet": p.shield = Math.max(p.shield, 11); Snd.sfx("shield"); this.game.toast("护盾展开"); break;
      case "clock":  this.freezeT = 9; Snd.sfx("freeze"); this.game.toast("时间冻结"); break;
      case "shovel": this.field.applyShovel(20); Snd.sfx("shovel"); this.game.toast("基地强化"); break;
      case "star":   p.levelUp(); this.game.toast("火力提升 · 等级 " + (p.level+1)); break;
      case "gun":    p.level = 3; p.applyLevel(); Snd.sfx("levelUp"); this.game.toast("满级火力"); break;
      case "tank":   p.lives++; Snd.sfx("life"); this.game.toast("增援抵达 · +1 命"); break;
      case "grenade":{
        let n = 0;
        for(const e of this.enemies){
          if(e.dead) continue;
          e._lastHitBy = p.index;
          e.destroy(); n++;
        }
        Snd.sfx("expBig"); this.shake(11, 0.5); this.game.flash(0.45);
        this.game.toast("全域清扫 · 击破 " + n + " 辆");
        break;
      }
    }
    if(pu.type !== "star" && pu.type !== "gun") Snd.sfx("powerGet");
    pu.dead = true;
  }

  checkClear(){
    if(this.over || this.cleared) return;
    this.cleared = true;
    this.endTimer = 2.0;
  }
  endGame(win){
    if(this.over) return;
    this.over = true;
    this.endTimer = win ? 2.0 : 2.4;
  }

  /* ---- 碰撞 ---- */
  handleBullets(){
    const bs = this.bullets;
    // 子弹 vs 子弹
    for(let i=0;i<bs.length;i++){
      const a = bs[i]; if(a.dead) continue;
      for(let j=i+1;j<bs.length;j++){
        const b = bs[j]; if(b.dead) continue;
        if(a.isPlayer === b.isPlayer) continue;
        if(rectHit(a.x-3,a.y-3,6,6, b.x-3,b.y-3,6,6)){
          a.dead = b.dead = true;
          a.owner.onBulletGone(); b.owner.onBulletGone();
          const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
          this.fx.push(new Ripple(mx,my,"#ffe9a8",13,0.26));
          for(let k=0;k<6;k++) this.fx.push(new Spark(mx,my, rnd()*TAU, 50+rnd()*90, "#fff0c0", 0.2));
          Snd.sfx("steel");
          break;
        }
      }
    }
    // 子弹 vs 坦克
    for(const b of bs){
      if(b.dead) continue;
      if(b.isPlayer){
        for(const e of this.enemies){
          if(e.dead || e.spawnT > 0) continue;
          if(rectHit(b.x-2,b.y-2,4,4, e.x,e.y,TS,TS)){
            e._lastHitBy = b.owner.index;
            const r = e.takeHit(b);
            b.dead = true; b.owner.onBulletGone();
            if(r === "shielded"){
              this.fx.push(new Ripple(b.x,b.y,"#9adcff",12,0.24));
              Snd.sfx("steel");
            }
            break;
          }
        }
        if(b.dead) continue;
      } else {
        for(const p of this.players){
          if(!p || p.dead || p.gone) continue;
          if(rectHit(b.x-2,b.y-2,4,4, p.x,p.y,TS,TS)){
            const r = p.takeHit(b);
            b.dead = true; b.owner.onBulletGone();
            if(r === "shielded"){
              this.fx.push(new Ripple(b.x,b.y,"#9adcff",14,0.26));
              for(let k=0;k<5;k++) this.fx.push(new Spark(b.x,b.y, rnd()*TAU, 60+rnd()*80, "#bdf0ff", 0.2));
              Snd.sfx("steel");
            } else {
              this.game.flash(0.22);
            }
            break;
          }
        }
        if(b.dead) continue;
        // 敌方子弹也能打友军（原版不会，这里保持不伤）
      }
    }
    this.bullets = bs.filter(b=>!b.dead);
  }

  update(dt, inputs){
    this.time += dt;
    this.field.update(dt);
    if(this.freezeT > 0) this.freezeT -= dt;
    if(this.baseShieldT > 0) this.baseShieldT -= dt;
    if(this.shakeT > 0)  this.shakeT -= dt;
    if(this.baseHitFlash > 0) this.baseHitFlash -= dt;

    for(let i=0;i<this.players.length;i++){
      const p = this.players[i];
      if(p) p.update(dt, inputs[i] || {up:0,dn:0,lf:0,rt:0,fire:0,firePressed:0});
    }
    for(const e of this.enemies) if(!e.dead) e.update(dt);

    for(const b of this.bullets) if(!b.dead) b.update(dt);
    this.handleBullets();

    // 道具拾取
    for(const pu of this.powerups){
      if(pu.dead) continue;
      pu.update(dt);
      for(const p of this.players){
        if(!p || p.dead || p.gone) continue;
        if(rectHit(pu.x,pu.y,pu.size,pu.size, p.x,p.y,TS,TS)){ this.applyPowerUp(pu, p); break; }
      }
    }
    this.powerups = this.powerups.filter(p=>!p.dead);

    for(const f of this.fx) f.update(dt);
    if(this.fx.length > 420) this.fx.splice(0, this.fx.length-420);
    this.fx = this.fx.filter(f=>!f.dead);

    for(const t of this.tracks) t.t += dt;
    this.tracks = this.tracks.filter(t=>t.t < 6);

    this.enemies = this.enemies.filter(e=>!e.dead || e._keep);

    if(!this.over && !this.cleared) this.trySpawn(dt);

    // 引擎声
    const anyMoving = this.players.some(p=>p && !p.dead && !p.gone && p.moving);
    Snd.engineSet(anyMoving);

    // 全灭判定
    if(!this.over && !this.cleared && !this.queue.length && this.aliveEnemies() === 0 && this.spawnedCount > 0){
      this.checkClear();
    }
    // 玩家全部阵亡
    if(!this.over && !this.cleared){
      const alive = this.players.filter(p=>p && !p.gone);
      if(alive.length === 0) this.endGame(false);
    }

    if(this.cleared || this.over){
      this.endTimer -= dt;
      if(this.endTimer <= 0){
        if(this.cleared) this.game.onStageClear();
        else this.game.onGameOver();
        this.endTimer = 1e9;
      }
    }
  }
}

const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");
const RENDER_DPR = 2;
function configureCanvas(){
  if(!ctx) return;
  const w = Math.round(VW * RENDER_DPR), h = Math.round(VH * RENDER_DPR);
  if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  ctx.setTransform(RENDER_DPR, 0, 0, RENDER_DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
configureCanvas();

      x.fillStyle = col;  x.fillRect(3,3,4,6);
      x.fillStyle = col2; x.fillRect(4,0,2,4);

    };
    SPR.misc.iconP1 = mk("#f2c14e","#a8781f");

  }
  { // 旗帜

    x.fillStyle = "#6b7280"; x.fillRect(2,1,2,14);
    const g = x.createLinearGradient(4,1,13,8);
    g.addColorStop(0,"#ffd166"); g.addColorStop(1,"#e0821c");
    x.fillStyle = g;
    x.beginPath(); x.moveTo(4,1); x.lineTo(13,4); x.lineTo(4,8); x.closePath(); x.fill();
    x.fillStyle = "rgba(255,255,255,.45)"; x.fillRect(4,1,1,7);
    SPR.misc.iconFlag = c;
  }
  { // 星级标记
    const {c,x} = mkCanvas(9,9);
    x.save(); x.translate(4.5,4.5);
    x.beginPath();
    for(let i=0;i<10;i++){
      const a = -Math.PI/2 + i*Math.PI/5, r = i%2?1.7:4.2;
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      i? x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath();
    x.fillStyle = "#ffd54a"; x.fill();
    x.restore();
    SPR.misc.iconStar = c;
  }
}

/* ---------------- 战场渲染 ---------------- */
function renderField(x, W){
  const f = W.field;
  x.save();
  x.translate(FX, FY);

  // 地面
  const bg = x.createLinearGradient(0,0,0,FS);
  bg.addColorStop(0,"#12161f"); bg.addColorStop(1,"#0b0e15");
  x.fillStyle = bg; x.fillRect(0,0,FS,FS);
  // 地面网格
  x.strokeStyle = "rgba(120,150,190,.045)"; x.lineWidth = 1;
  x.beginPath();
  for(let i=0;i<=GN;i+=2){ x.moveTo(i*G+.5,0); x.lineTo(i*G+.5,FS); x.moveTo(0,i*G+.5); x.lineTo(FS,i*G+.5); }
  x.stroke();

  // 履带痕迹
  for(const t of W.tracks){
    const a = (1 - t.t/6)*0.16;
    x.fillStyle = `rgba(60,52,44,${a})`;
    if(t.dir===0||t.dir===2){ x.fillRect(t.x-11, t.y-2, 5, 4); x.fillRect(t.x+6, t.y-2, 5, 4); }
    else { x.fillRect(t.x-2, t.y-11, 4, 5); x.fillRect(t.x-2, t.y+6, 4, 5); }
  }

  const wf = (W.field.waterT*4)|0;
  const trees = [];
  // 地形
  for(let gy=0; gy<GN; gy++){
    for(let gx=0; gx<GN; gx++){
      const i = gy*GN+gx, t = f.grid[i];
      if(t === TE.EMPTY) continue;
      const px = gx*G, py = gy*G;
      if(t === TE.BRICK){
        const m = f.mask[i];
        const img = SPR.terrain.brick;
        if(m === 0b1111){ x.drawImage(img, px, py); }
        else {
          for(let b=0;b<4;b++){
            if(!(m & (1<<b))) continue;
            const ox = (b&1)*8, oy = (b>>1)*8;
            x.drawImage(img, ox, oy, 8, 8, px+ox, py+oy, 8, 8);
          }
        }
      } else if(t === TE.STEEL){
        x.drawImage(SPR.terrain.steel, px, py);
      } else if(t === TE.WATER){
        x.drawImage(SPR.terrain.water[wf % 3], px, py);
      } else if(t === TE.ICE){
        x.drawImage(SPR.terrain.ice, px, py);
      } else if(t === TE.TREE){
        trees.push([px,py]);
      } else if(t === TE.BASE){
        if(gx === BASE_GX && gy === BASE_GY){
          x.drawImage(f.baseAlive ? SPR.terrain.base : SPR.terrain.baseDead, px, py);
          if(f.baseAlive){
            const pulse = 0.5 + Math.sin(W.time*2.6)*0.5;
            x.save(); x.globalCompositeOperation = "lighter";
            const g = x.createRadialGradient(px+16,py+16,2,px+16,py+16,22);
            g.addColorStop(0,`rgba(255,215,120,${0.10+pulse*0.10})`);
            g.addColorStop(1,"rgba(255,180,60,0)");
            x.fillStyle = g; x.beginPath(); x.arc(px+16,py+16,22,0,TAU); x.fill();
            x.restore();
          }
        }
      }
    }
  }
  // 基地临时无敌护罩
  if(W.baseShieldT > 0 && f.baseAlive){
    const bx = (BASE_GX+1)*G, by = (BASE_GY+1)*G;
    const pulse = 0.5 + Math.sin(W.time*8)*0.5;
    x.save();
    x.globalCompositeOperation = "lighter";
    x.strokeStyle = `rgba(150,225,255,${0.58 + pulse*0.22})`;
    x.lineWidth = 2;
    x.beginPath(); x.arc(bx,by,26+pulse*2,0,TAU); x.stroke();
    x.fillStyle = `rgba(100,190,255,${0.08 + pulse*0.04})`;
    x.beginPath(); x.arc(bx,by,25,0,TAU); x.fill();
    x.restore();
  }
  // 铁锹生效提示
  if(f.shovelT > 0 && f.shovelT < 5){
    const on = Math.floor(f.shovelT*6)%2 === 0;
    if(on){
      x.save(); x.globalCompositeOperation="lighter"; x.globalAlpha = 0.28;
      x.fillStyle = "#9adcff";
      for(const [gx,gy] of BASE_WALL) x.fillRect(gx*G, gy*G, G, G);
      x.restore();
    }
  }

  // 道具
  for(const p of W.powerups) p.render(x);
  // 坦克
  for(const e of W.enemies) if(!e.dead) e.render(x);
  for(const p of W.players) if(p && !p.dead && !p.gone) p.render(x);
  // 子弹
  for(const b of W.bullets) if(!b.dead) b.render(x);
  // 特效
  for(const fx of W.fx) fx.render(x);
  // 树覆盖层
  for(const [px,py] of trees) x.drawImage(SPR.terrain.tree, px, py);

  // 冻结覆盖
  if(W.freezeT > 0){
    const a = clamp(W.freezeT/9, 0, 1);
    x.save();
    x.fillStyle = `rgba(120,200,255,${0.09*Math.min(1,a*3)})`;
    x.fillRect(0,0,FS,FS);
    x.globalCompositeOperation = "lighter";
    for(let i=0;i<16;i++){
      const t = W.time*0.5 + i*2.7;
      const px = (i*97 + Math.sin(t)*20) % FS;
      const py = (t*22 + i*53) % FS;
      x.fillStyle = "rgba(200,240,255,.35)";
      x.fillRect(px, py, 2, 2);
    }
    x.restore();
    if(W.freezeT < 2.5 && Math.floor(W.freezeT*6)%2===0){
      x.strokeStyle = "rgba(150,220,255,.5)"; x.lineWidth = 2;
      x.strokeRect(1,1,FS-2,FS-2);
    }
  }

  // 战场边框
  x.strokeStyle = "rgba(150,185,235,.22)"; x.lineWidth = 1;
  x.strokeRect(0.5, 0.5, FS-1, FS-1);
  x.restore();
}

/* ---------------- HUD 侧栏 ---------------- */
function renderHUD(x, W, G_){
  const px = SBX, py = FY, pw = SBW, ph = FS;
  x.save();
  // 面板
  rr(x, px, py, pw, ph, 8);
  const g = x.createLinearGradient(px,py,px,py+ph);
  g.addColorStop(0,"rgba(24,32,50,.9)"); g.addColorStop(1,"rgba(12,17,28,.92)");
  x.fillStyle = g; x.fill();
  x.strokeStyle = "rgba(140,175,225,.20)"; x.lineWidth = 1; x.stroke();

  let cy = py + 10;
  const cxL = px + 10;

  // ---- 剩余敌人 ----
  drawUiText(x, "敌军", cxL, cy, "#5ec8e8", 1, 1);
  const rem = W ? W.remaining() : 0;
  drawTxt(x, String(rem).padStart(2,"0"), px+pw-10-txtW(String(rem).padStart(2,"0"),1,1), cy, "#e8eef7", 1, 1);
  cy += 11;
  // 图标网格 (每行 5 个)
  const ico = SPR.misc.iconEnemy;
  const perRow = 5;
  const maxShow = W ? W.totalEnemies : 20;
  for(let i=0;i<maxShow;i++){
    const r = (i/perRow)|0, c = i%perRow;
    const ix = cxL + c*11, iy = cy + r*11;
    if(i < rem){ x.globalAlpha = 1; x.drawImage(ico, ix, iy); }
    else { x.globalAlpha = 0.14; x.drawImage(ico, ix, iy); }
  }
  x.globalAlpha = 1;
  cy += Math.ceil(maxShow/perRow)*11 + 8;

  // 分隔
  x.fillStyle = "rgba(140,175,225,.14)"; x.fillRect(px+8, cy, pw-16, 1);
  cy += 8;

  // ---- 玩家状态 ----
  if(W) for(let i=0;i<W.players.length;i++){
    const p = W.players[i];
    if(!p) continue;
    const label = (i===0?"玩家1":"玩家2");
    const col = i===0 ? "#f2c14e" : "#6fd47a";
    drawUiText(x, label, cxL, cy, col, 1, 1);
    // 等级星
    for(let s=0;s<p.level;s++) x.drawImage(SPR.misc.iconStar, cxL+18+s*10, cy-1);
    cy += 11;
    // 生命
    const lifeIco = i===0 ? SPR.misc.iconP1 : SPR.misc.iconP2;
    const shown = clamp(p.lives, 0, 5);
    for(let k=0;k<shown;k++) x.drawImage(lifeIco, cxL+k*11, cy);
    if(p.lives > 5){ drawTxt(x, "+"+(p.lives-5), cxL+5*11+2, cy+1, "#8fa0bd", 1, 1); }
    if(p.gone){ drawUiText(x, "出局", cxL, cy+1, "#ff4d5e", 1, 1); }
    cy += 13;
    // 分数
    drawTxt(x, String(p.score).padStart(6,"0"), cxL, cy, "#c8d6ea", 1, 1);
    cy += 13;
  }

  x.fillStyle = "rgba(140,175,225,.14)"; x.fillRect(px+8, cy, pw-16, 1);
  cy += 8;

  // ---- 关卡 ----
  x.drawImage(SPR.misc.iconFlag, cxL, cy);
  const stageNum = W ? (W.stageIndex+1) : 1;
  drawTxt(x, String(stageNum), cxL+18, cy+4, "#e8eef7", 2, 1);
  if(W && W.loop > 0) drawUiText(x, "循环"+(W.loop+1), cxL+18, cy+20, "#ff9d5c", 1, 1);
  cy += 26;

  // 关卡名
  if(W){
    drawUiText(x, W.stage.en, cxL, cy, "#5f7593", 1, 1);
    cy += 12;
  }

  x.fillStyle = "rgba(140,175,225,.14)"; x.fillRect(px+8, cy, pw-16, 1);
  cy += 8;

  // ---- 最高分 ----
  drawUiText(x, "最高分", cxL, cy, "#5ec8e8", 1, 1); cy += 10;
  drawTxt(x, String(Save.data.hi).padStart(6,"0"), cxL, cy, "#ffb347", 1, 1);
  cy += 14;

  // ---- 状态指示 ----
  if(W){
    if(W.freezeT > 0){
      drawUiText(x, "冻结 " + Math.ceil(W.freezeT), cxL, cy, "#9adcff", 1, 1); cy += 10;
    }
    if(W.baseShieldT > 0){
      drawUiText(x, "基地安全 " + Math.ceil(W.baseShieldT), cxL, cy, "#9adcff", 1, 1); cy += 10;
    }
    if(W.field.shovelT > 0){
      drawUiText(x, "基地加固 " + Math.ceil(W.field.shovelT), cxL, cy, "#c8d4e6", 1, 1); cy += 10;
    }
    const sh = W.players.find(p=>p && p.shield>0 && !p.dead);
    if(sh){ drawUiText(x, "护盾 " + Math.ceil(sh.shield), cxL, cy, "#7fd8ff", 1, 1); cy += 10; }
  }

  // 底部提示
  drawUiText(x, "Q 超级按键", cxL, py+ph-32, W && W.game && W.game.superUnlocked ? "#ffb347" : "#3f4b60", 1, 1);
  drawUiText(x, "P 暂停", cxL, py+ph-22, "#3f4b60", 1, 1);
  drawUiText(x, "M 音效", cxL, py+ph-12, "#3f4b60", 1, 1);
  x.restore();
}

/* ---------------- 游戏主控 ---------------- */
const Game = {
  state:"title",
  world:null,
  twoP:false,
  stageIndex:0,
  loop:0,
  carry:null,
  acc:0, last:0, time:0,
  menuSel:0,
  startStage:0,
  stageCardT:0,
  shutterP:0,
  scale:1,
  useTouch:false,
  superUnlocked:false,
  superReturnState:"title",
  superInput:null,
  superStatus:null,
  panels:{},

  init(){
    this.panels = {
      title:document.getElementById("pTitle"),
      help :document.getElementById("pHelp"),
      pause:document.getElementById("pPause"),
      clear:document.getElementById("pClear"),
      over :document.getElementById("pOver"),
      win  :document.getElementById("pWin"),
      super:document.getElementById("pSuper")
    };
    this.superInput = document.getElementById("superCode");
    this.superStatus = document.getElementById("superStatus");
    document.getElementById("superSubmit").addEventListener("click", ()=>this.submitSuperCode());
    document.getElementById("superCancel").addEventListener("click", ()=>this.closeSuperPrompt());
    document.getElementById("nextStageBtn").addEventListener("click", ()=>this.nextStage());
    document.getElementById("overTitleBtn").addEventListener("click", ()=>this.backToTitle());
    document.getElementById("winTitleBtn").addEventListener("click", ()=>this.backToTitle());
    document.getElementById("pauseResumeBtn").addEventListener("click", ()=>this.togglePause());
    document.getElementById("pauseRestartBtn").addEventListener("click", ()=>{ this.hidePanels(); this.restartStage(); });
    document.getElementById("pauseTitleBtn").addEventListener("click", ()=>{ this.hidePanels(); this.backToTitle(); });
    this.superInput.addEventListener("input", ()=>{
      if(this.superStatus) this.superStatus.textContent = "";
    });
    this.buildMenu();
    this.buildHelp();
    const syncTouchLayout = () => {
      this.useTouch = matchMedia("(pointer:coarse)").matches || navigator.maxTouchPoints > 0 || (innerWidth <= 1000 && innerHeight <= 600);
      document.getElementById("touch").classList.toggle("on", this.useTouch);
      this.syncSuperTouchUI();
      this.resize();
    };
    syncTouchLayout();
    this.showPanel("title");
    Snd.music("title");
    addEventListener("resize", syncTouchLayout);
  },

  showPanel(name){
    for(const k in this.panels) this.panels[k].classList.toggle("on", k === name);
  },
  hidePanels(){ for(const k in this.panels) this.panels[k].classList.remove("on"); },

  syncSuperTouchUI(){
    const dock=document.getElementById("tCheats");
    const button=document.getElementById("tSuper");
    if(dock) dock.classList.toggle("on", this.useTouch && this.superUnlocked);
    if(button) button.textContent = this.superUnlocked ? "已解锁" : "超级";
  },

  openSuperPrompt(){
    if(this.superUnlocked){ this.toast("超级按键已启用"); return; }
    if(this.state === "clear" || this.state === "over" || this.state === "win") return;
    this.superReturnState = this.state;
    if(this.state === "play") Snd.engineStop();
    this.state = "super";
    this.showPanel("super");
    this.superInput.value = "";
    this.superStatus.textContent = "";
    setTimeout(()=>this.superInput?.focus(), 0);
  },
  closeSuperPrompt(){
    const restore = this.superReturnState || "title";
    this.showPanel(restore === "stage" ? null : restore);
    this.state = restore;
    if(restore === "play"){
      Snd.engineStart();
      Snd.music("battle");
    }
  },
  submitSuperCode(){
    if(!this.superInput) return;
    const code = this.superInput.value.normalize("NFKC").trim().toLowerCase();
    if(code !== "llapi.org"){
      this.superStatus.textContent = "口令错误";
      this.superInput.select();
      Snd.sfx("steel");
      return;
    }
    this.superUnlocked = true;
    this.syncSuperTouchUI();
    const restore = this.superReturnState || "title";
    this.state = restore;
    this.showPanel(restore === "stage" ? null : restore);
    if(restore === "play"){
      Snd.engineStart();
      Snd.music("battle");
    }
    this.toast("超级按键已启用");
    Snd.sfx("levelUp");
  },

  useSuperAction(action){
    if(!this.superUnlocked){ this.openSuperPrompt(); return; }
    if(this.state !== "play" || !this.world){ this.toast("进入战斗后使用"); return; }
    if(action === "freeze"){
      this.world.freezeT = Math.max(this.world.freezeT, 9);
      this.toast("时间冻结 · 9 秒"); Snd.sfx("freeze");
    }else if(action === "base"){
      this.world.activateBaseShield(12);
    }else if(action === "power"){
      this.world.grantMaxPower(0);
    }else if(action === "clear"){
      this.world.clearActiveEnemies(0);
    }
  },

  toast(msg){
    const t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(this._toastT);
    this._toastT = setTimeout(()=>t.classList.remove("on"), 1500);
  },
  flash(a){
    const f = document.getElementById("flash");
    if(!f) return;
    f.style.opacity = String(a);
    setTimeout(()=>{ f.style.opacity = "0"; }, 70);
  },

  /* --- 菜单 --- */
  menuItems(){
    return [
      { label:"单 人 出 击", sub:"单人" },
      { label:"双 人 合 作", sub:"双人" },
      { label:"起 始 关 卡", sub:()=>"< 第 " + (this.startStage+1) + " 关 >" },
      { label:"操 作 说 明", sub:"操作说明" },
      { label:"音 效", sub:()=> Snd.muted ? "关闭" : "开启" }
    ];
  },
  buildMenu(){
    const badge = document.getElementById("gameVersionBadge");
    if(badge) badge.textContent = GAME_VERSION;
    const el = document.getElementById("menu");
    if(!el) return;
    el.innerHTML = "";
    const items = this.menuItems();
    items.forEach((it,i)=>{
      const d = document.createElement("div");
      d.className = "mi" + (i===this.menuSel?" sel":"");
      const sub = typeof it.sub === "function" ? it.sub() : it.sub;
      d.innerHTML = `<span>${it.label}</span><small>${sub}</small>`;
      d.addEventListener("click", ()=>{ this.menuSel = i; this.buildMenu(); this.menuActivate(); });
      d.addEventListener("mouseenter", ()=>{ if(this.menuSel!==i){ this.menuSel=i; this.buildMenu(); Snd.sfx("menu"); } });
      el.appendChild(d);
    });
  },
  buildHelp(){
    const el = document.getElementById("helpGrid");
    if(!el) return;
    el.innerHTML = `
      <div>
        <h4>玩家 1</h4>
        移动 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>
        开火 <kbd>空格</kbd> / <kbd>J</kbd><br>
        <h4 style="margin-top:8px">玩家 2</h4>
        移动 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><br>
        开火 <kbd>L</kbd> / <kbd>/</kbd> / <kbd>0</kbd><br>
        <h4 style="margin-top:8px">系统</h4>
        <kbd>P</kbd> 暂停 &nbsp; <kbd>M</kbd> 音效 &nbsp; <kbd>R</kbd> 重开<br>
        <kbd>F</kbd> 扫描线 &nbsp; <kbd>Esc</kbd> 返回<br>
        <kbd>Q</kbd> 输入授权口令<br>
        <kbd>T</kbd> 冻结 &nbsp; <kbd>Y</kbd> 基地护盾<br>
        <kbd>U</kbd> 满级火力 &nbsp; <kbd>I</kbd> 清除当前敌军
      </div>
      <div>
        <h4>道具</h4>
        <div class="pw"><i style="background:#7fd8ff"></i>头盔 · 十秒无敌护盾</div>
        <div class="pw"><i style="background:#ffd166"></i>时钟 · 冻结全部敌军</div>
        <div class="pw"><i style="background:#c8d4e6"></i>铁锹 · 基地护墙变钢</div>
        <div class="pw"><i style="background:#ffe066"></i>星星 · 火力升一级</div>
        <div class="pw"><i style="background:#ff8f6b"></i>手雷 · 全屏歼灭</div>
        <div class="pw"><i style="background:#9be89b"></i>坦克 · 增加一条命</div>
        <div class="pw"><i style="background:#ff6b9d"></i>重炮 · 直升满级</div>
        <h4 style="margin-top:8px">要点</h4>
        守住基地老鹰，歼灭全部敌军即可通关。<br>
        满级火力可击穿钢板，冰面会打滑。
      </div>`;
  },
  menuActivate(){
    Snd.resume();
    Snd.sfx("select");
    switch(this.menuSel){
      case 0: this.newGame(false); break;
      case 1: this.newGame(true);  break;
      case 2: break;
      case 3: this.state = "help"; this.showPanel("help"); break;
      case 4: Snd.setMute(!Snd.muted); this.buildMenu(); if(!Snd.muted) Snd.music("title"); else Snd.stopMusic(); break;
    }
  },

  /* --- 流程 --- */
  newGame(twoP){
    this.twoP = twoP;
    this.stageIndex = this.startStage;
    this.loop = 0;
    this.carry = null;
    Save.data.plays++;
    Save.save();
    this.beginStage();
  },
  beginStage(){
    this.hidePanels();
    this.world = new World(this, this.stageIndex, this.loop, this.twoP, this.carry);
    this.state = "stage";
    this.stageCardT = 1.55;
    this.shutterP = 0;
    Snd.stopMusic();
    Snd.sfx("stage");
  },
  enterPlay(){
    this.state = "play";
    Snd.engineStart();
    Snd.music("battle");
  },
  collectCarry(){
    if(!this.world) return null;
    return this.world.players.map(p=>({
      lives:p.lives, score:p.score, kills:p.kills.slice(), gone:p.gone, level:p.level
    }));
  },
  onStageClear(){
    this.carry = this.collectCarry();
    Snd.engineStop();
    Snd.music("victory");
    this.state = "clear";
    this.renderClearPanel();
    this.showPanel("clear");
    const best = Math.max(...this.world.players.map(p=>p.score));
    if(best > Save.data.hi){ Save.data.hi = best; }
    const nxt = this.stageIndex + 1;
    if(nxt < STAGES.length && nxt+1 > Save.data.maxStage) Save.data.maxStage = nxt+1;
    Save.save();
  },
  renderClearPanel(){
    const body = document.getElementById("clearBody");
    const title = document.getElementById("clearTitle");
    if(!body) return;
    const W = this.world;
    title.textContent = "关 卡 达 成 · 第 " + (this.stageIndex+1) + " 关";
    let html = `<div class="score-table">
      <div class="hd">目标</div><div class="hd">击破</div><div class="hd">得分</div>`;
    const names = ["普通坦克","快速坦克","重炮坦克","装甲坦克"];
    let totalK = 0, totalS = 0;
    for(let t=0;t<4;t++){
      let k = 0;
      for(const p of W.players) k += p.kills[t];
      const s = k * ENEMY_DEF[t].score;
      totalK += k; totalS += s;
      html += `<div>${names[t]}</div><div class="vv">${k}</div><div class="vv">${s}</div>`;
    }
    html += `<div class="tot">合计</div><div class="vv tot">${totalK}</div><div class="vv tot">${totalS}</div>`;
    html += `</div>`;
    html += `<div class="hint" style="margin-top:10px">`;
    for(const p of W.players){
      html += `${p.index===0?"玩家1":"玩家2"} 总分 <b>${p.score}</b>&nbsp;&nbsp;`;
    }
    html += `</div>`;
    body.innerHTML = html;
  },
  nextStage(){
    const nxt = this.stageIndex + 1;
    if(nxt >= STAGES.length){
      // 通关
      this.state = "win";
      const body = document.getElementById("winBody");
      if(body){
        let html = `<div class="tagline">全部 ${STAGES.length} 关战役完成</div><div class="score-table" style="margin-top:10px">`;
        html += `<div class="hd">指挥官</div><div class="hd">总分</div><div class="hd">剩余</div>`;
        for(const p of this.world.players){
          html += `<div>${p.index===0?"玩家1":"玩家2"}</div><div class="vv">${p.score}</div><div class="vv">${Math.max(0,p.lives)}</div>`;
        }
        html += `</div>`;
        body.innerHTML = html;
      }
      Snd.music("victory");
      this.showPanel("win");
      return;
    }
    this.stageIndex = nxt;
    this.beginStage();
  },
  onGameOver(){
    Snd.engineStop();
    Snd.music("gameover");
    this.state = "over";
    const body = document.getElementById("overBody");
    if(body && this.world){
      let html = `<div class="tagline">第 ${this.stageIndex+1} 关 · ${this.world.stage.en}</div>`;
      html += `<div class="score-table" style="margin-top:10px">
        <div class="hd">指挥官</div><div class="hd">得分</div><div class="hd">击破</div>`;
      for(const p of this.world.players){
        const k = p.kills.reduce((a,b)=>a+b,0);
        html += `<div>${p.index===0?"玩家1":"玩家2"}</div><div class="vv">${p.score}</div><div class="vv">${k}</div>`;
      }
      html += `</div>`;
      body.innerHTML = html;
    }
    const best = this.world ? Math.max(...this.world.players.map(p=>p.score)) : 0;
    if(best > Save.data.hi){ Save.data.hi = best; Save.save(); }
    this.showPanel("over");
  },
  backToTitle(){
    this.state = "title";
    this.world = null;
    Snd.engineStop();
    Snd.music("title");
    this.buildMenu();
    this.showPanel("title");
  },
  restartStage(){
    this.beginStage();
  },
  togglePause(){
    if(this.state === "play"){
      this.state = "pause";
      this.showPanel("pause");
      Snd.engineStop();
      Snd.sfx("pause");
      if(Snd.musicGain) try{ Snd.musicGain.gain.value = 0.12; }catch(e){}
    } else if(this.state === "pause"){
      this.hidePanels();
      this.state = "play";
      Snd.engineStart();
      Snd.sfx("pause");
      if(Snd.musicGain) try{ Snd.musicGain.gain.value = 0.42; }catch(e){}
    }
  },

  /* --- 输入分派 --- */
  handleKeys(){
    const I = Input;
    if(I.hit("KeyM")){
      Snd.setMute(!Snd.muted);
      this.toast(Snd.muted ? "音效关闭" : "音效开启");
      if(!Snd.muted){ Snd.music(this.state==="play"?"battle":"title"); }
      else Snd.stopMusic();
      if(this.state === "title") this.buildMenu();
    }
    if(I.hit("KeyF")){
      const fx = document.getElementById("fx");
      if(fx){ fx.classList.toggle("scan"); Save.data.scan = fx.classList.contains("scan"); Save.save(); }
    }
    if(I.hit("KeyQ") && this.state !== "super") this.openSuperPrompt();

    switch(this.state){
      case "title":
        if(I.hitAny("ArrowUp","KeyW")){ this.menuSel = (this.menuSel+4)%5; this.buildMenu(); Snd.sfx("menu"); }
        if(I.hitAny("ArrowDown","KeyS")){ this.menuSel = (this.menuSel+1)%5; this.buildMenu(); Snd.sfx("menu"); }
        if(this.menuSel === 2){
          const maxS = Math.min(STAGES.length, Save.data.maxStage);
          if(I.hitAny("ArrowLeft","KeyA")){ this.startStage = (this.startStage-1+maxS)%maxS; this.buildMenu(); Snd.sfx("menu"); }
          if(I.hitAny("ArrowRight","KeyD")){ this.startStage = (this.startStage+1)%maxS; this.buildMenu(); Snd.sfx("menu"); }
        }
        if(I.hitAny("Enter","Space","NumpadEnter","KeyJ")) this.menuActivate();
        if(I.hit("KeyH")){ this.state = "help"; this.showPanel("help"); }
        break;
      case "help":
        if(I.hitAny("Escape","KeyH","Enter","Space")){ this.state = "title"; this.showPanel("title"); }
        break;
      case "super":
        if(I.hit("Escape")) this.closeSuperPrompt();
        if(I.hit("Enter")) this.submitSuperCode();
        break;
      case "play":
        if(I.hit("KeyP")) this.togglePause();
        if(this.superUnlocked && I.hit("KeyT")) this.useSuperAction("freeze");
        if(this.superUnlocked && I.hit("KeyY")) this.useSuperAction("base");
        if(this.superUnlocked && I.hit("KeyU")) this.useSuperAction("power");
        if(this.superUnlocked && I.hit("KeyI")) this.useSuperAction("clear");
        break;
      case "pause":
        if(I.hit("KeyP")) this.togglePause();
        if(I.hit("KeyR")){ this.hidePanels(); this.restartStage(); }
        if(I.hit("Escape")){ this.hidePanels(); this.backToTitle(); }
        break;
      case "clear":
        if(I.hitAny("Enter","Space","KeyJ")) this.nextStage();
        break;
      case "over":
        if(I.hitAny("Enter","Space","KeyJ")) this.backToTitle();
        break;
      case "win":
        if(I.hitAny("Enter","Space","KeyJ")) this.backToTitle();
        break;
    }
  },

  update(dt){
    Input.pollGamepads();
    this.time += dt;
    this._diagT = (this._diagT || 0) - dt;
    if(this._diagT <= 0){
      const out=document.getElementById("diagnostics");
      if(out) out.textContent=JSON.stringify(collectDiagnostics());
      this._diagT=0.5;
    }
    this.handleKeys();

    if(this.state === "stage"){
      this.stageCardT -= dt;
      if(this.stageCardT < 0.55) this.shutterP = clamp(1 - this.stageCardT/0.55, 0, 1);
      if(this.stageCardT <= 0) this.enterPlay();
    } else if(this.state === "play"){
      const inputs = [];
      inputs.push(Input.read(0, this.useTouch, this.twoP));
      if(this.twoP) inputs.push(Input.read(1, false, true));
      this.world.update(dt, inputs);
    }
  },

  render(){
    const x = ctx;
    x.save();
    // 背景
    x.fillStyle = "#080b12";
    x.fillRect(0,0,VW,VH);

    const W = this.world;
    // 屏幕震动
    let sx = 0, sy = 0;
    if(W && W.shakeT > 0){
      const p = W.shakeT / W.shakeDur;
      const a = W.shakeAmt * p * p;
      sx = (rnd()-0.5)*a*2; sy = (rnd()-0.5)*a*2;
    }
    x.translate(Math.round(sx), Math.round(sy));

    if(W){
      renderField(x, W);
      renderHUD(x, W);
    } else {
      renderTitleBG(x);
      renderHUD(x, null);
    }

    // 关卡过场
    if(this.state === "stage"){
      const h = VH/2 * (1 - this.shutterP);
      x.fillStyle = "#8a8f99";
      x.fillRect(0, 0, VW, Math.ceil(h));
      x.fillRect(0, VH-Math.ceil(h), VW, Math.ceil(h));
      if(this.shutterP < 0.02){
        const s = STAGES[this.stageIndex];
        drawUiTextC(x, "第 " + (this.stageIndex+1) + " 关", VW/2, VH/2 - 14, "#141a24", 2, 2);
        drawUiTextC(x, s.en, VW/2, VH/2 + 14, "#3d4552", 1, 2);
      }
    }
    // 暂停遮罩
    if(this.state === "pause"){
      x.fillStyle = "rgba(6,10,18,.55)";
      x.fillRect(0,0,VW,VH);
    }
    x.restore();
  },

  resize(){
    const pad = this.useTouch ? 8 : 46;
    const sc = Math.min((innerWidth - pad) / VW, (innerHeight - pad) / VH);
    const s = Math.max(0.5, Math.floor(sc*20)/20);
    this.scale = s;
    cv.style.width  = Math.round(VW*s) + "px";
    cv.style.height = Math.round(VH*s) + "px";
    const rot = document.getElementById("rotate");
    if(rot) rot.style.display = (innerWidth < 480 && innerHeight > innerWidth) ? "flex" : "none";
  }
};

/* 标题背景：缓慢推进的坦克剪影 */
let _titleTanks = null;
function renderTitleBG(x){
  if(!_titleTanks){
    _titleTanks = [];
    for(let i=0;i<7;i++){
      _titleTanks.push({
        x: rnd()*FS, y: rnd()*FS,
        dir: rndi(4), sp: 0.18 + rnd()*0.35,
        skin: pick(["basic","fast","power","armor2","p1","p2"]),
        t: rnd()*4, tread:0, tp:0
      });
    }
  }
  x.save();
  x.translate(FX, FY);
  const bg = x.createLinearGradient(0,0,0,FS);
  bg.addColorStop(0,"#0f141d"); bg.addColorStop(1,"#080b12");
  x.fillStyle = bg; x.fillRect(0,0,FS,FS);
  x.strokeStyle = "rgba(120,150,190,.05)";
  x.beginPath();
  for(let i=0;i<=GN;i+=2){ x.moveTo(i*G+.5,0); x.lineTo(i*G+.5,FS); x.moveTo(0,i*G+.5); x.lineTo(FS,i*G+.5); }
  x.stroke();
  x.globalAlpha = 0.30;
  for(const t of _titleTanks){
    t.x += DX[t.dir]*t.sp; t.y += DY[t.dir]*t.sp;
    t.tp += t.sp; if(t.tp > 4){ t.tp = 0; t.tread ^= 1; }
    t.t -= STEP;
    if(t.t <= 0){ t.t = 1.5 + rnd()*3.5; t.dir = rndi(4); }
    if(t.x < -TS) t.x = FS; if(t.x > FS) t.x = -TS;
    if(t.y < -TS) t.y = FS; if(t.y > FS) t.y = -TS;
    const set = SPR.tanks[t.skin];
    if(set) x.drawImage(set[t.tread][t.dir], Math.round(t.x), Math.round(t.y));
  }
  x.globalAlpha = 1;
  x.restore();
}

/* 只读运行诊断：用于移动端回归检查，不暴露修改游戏状态的接口。 */
function collectDiagnostics(){
  const W=Game.world;
  if(!W) return {state:Game.state,stage:Game.stageIndex+1,tanks:[],invalid:[],overlaps:[]};
  const tanks=W.allTanks().map(t=>({
    id:t.isPlayer?`p${t.index+1}`:`e${t.trafficId}`,
    kind:t.isPlayer?"player":"enemy",
    x:+t.x.toFixed(2),y:+t.y.toFixed(2),dir:t.dir,spawn:+Math.max(0,t.spawnT).toFixed(2),
    stuck:t.isPlayer?0:+t.stuck.toFixed(2),egress:t.isPlayer?0:+Math.max(0,t.egressT).toFixed(2)
  }));
  const invalid=[];
  for(const t of W.allTanks()) if(!W.field.freeForTank(t.x,t.y,TS,TS)) invalid.push(t.isPlayer?`p${t.index+1}`:`e${t.trafficId}`);
  const overlaps=[];
  const live=W.allTanks();
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    if(rectHit(live[i].x,live[i].y,TS,TS,live[j].x,live[j].y,TS,TS)) overlaps.push([tanks[i]?.id,tanks[j]?.id]);
  }
  return {state:Game.state,stage:Game.stageIndex+1,remaining:W.remaining(),tanks,invalid,overlaps};
}

/* ---------------- 启动 ---------------- */
function boot(){
  buildAllSprites();
  buildHudIcons();
  Input.init();
  Game.init();
  if(!Save.data.scan){ const fx = document.getElementById("fx"); if(fx) fx.classList.remove("scan"); }

  const unlock = ()=>{ Snd.resume(); if(!Snd.muted && !Snd._track && Game.state==="title") Snd.music("title"); };
  ["pointerdown","keydown","touchstart"].forEach(e=>addEventListener(e, unlock, {once:false}));

  let last = performance.now(), acc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    let dt = (now - last)/1000;
    last = now;
    if(dt > 0.25) dt = 0.25;
    acc += dt;
    let guard = 0;
    while(acc >= STEP && guard < 6){
      Game.update(STEP);
      Input.endFrame();
      acc -= STEP;
      guard++;
    }
    if(guard >= 6) acc = 0;
    Game.render();
  }
  requestAnimationFrame(frame);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
