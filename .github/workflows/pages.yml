name: Deploy 创意空间 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate game version catalog
        run: node 创意空间首页/scripts/generate-game-catalog.cjs

      - name: Write deployment metadata
        run: node 创意空间首页/scripts/write-deployment-meta.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          PUBLISHED_SITE_METADATA_RETRIES: 12
          PUBLISHED_SITE_RETRY_DELAY_MS: 5000
        run: node 创意空间首页/测试/published_site_test.mjs "$PAGE_URL" "$EXPECTED_COMMIT"
