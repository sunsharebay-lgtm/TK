<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <meta name="description" content="九州烽烟：一款原创 FC 风格三国 RPG 外壳。">
  <title>九州烽烟 · 汉末群雄</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6e9c9;
      --muted: #a99d86;
      --gold: #f0bd57;
      --red: #d86455;
      --blue: #5da3c9;
      --panel: #15151f;
      --panel-deep: #0b0c13;
      --line: #514735;
      font-family: "SF Mono", "Cascadia Mono", "Noto Sans Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -20%, #293046 0, transparent 48%),
        linear-gradient(160deg, #090b12 0%, #11131d 48%, #08090e 100%);
    }
    .console {
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: clamp(16px, 4vw, 34px) 0 28px;
    }
    .console-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 0 4px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      margin: 0;
      color: var(--gold);
      font-size: clamp(15px, 2.5vw, 22px);
      letter-spacing: .16em;
      text-shadow: 2px 2px #4b2d26;
    }
    .subbrand { margin: 5px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .08em; }
    .led { color: #6ad58a; font-size: 10px; letter-spacing: .08em; white-space: nowrap; }
    .led::before { content: "●"; margin-right: 7px; color: #6ad58a; }
    .screen-shell {
      margin-top: 18px;
      padding: clamp(10px, 2vw, 18px);
      background: linear-gradient(145deg, #262333, #10111a 70%);
      border: 1px solid #675b43;
      border-radius: 12px;
      box-shadow: 0 20px 55px rgba(0,0,0,.42), inset 0 0 0 4px #0d0e15;
    }
    .screen-bezel {
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vw, 16px);
      background: #05060a;
      border: 3px solid #3b352a;
      border-radius: 6px;
      box-shadow: inset 0 0 34px rgba(0,0,0,.8);
    }
    canvas {
      display: block;
      width: min(100%, 768px);
      height: auto;
      aspect-ratio: 16 / 15;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111421;
      outline: 1px solid #2d3448;
    }
    .control-deck {
      display: grid;
      grid-template-columns: 1fr minmax(190px, 250px) 1fr;
      align-items: center;
      gap: clamp(16px, 5vw, 48px);
      margin-top: 18px;
      padding: 14px;
      background: rgba(8,9,14,.75);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 38px);
      justify-content: center;
    }
    .action-pad { display: flex; justify-content: center; align-items: center; gap: 14px; }
    .battle-actions { display: flex; justify-content: center; gap: 6px; grid-column: 1 / -1; }
    .battle-actions .control-button { min-width: 54px; font-size: 10px; }
    button {
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .control-button {
      min-width: 42px;
      min-height: 38px;
      border: 1px solid #736145;
      border-radius: 5px;
      background: linear-gradient(#3a3540, #1b1b26);
      box-shadow: 0 3px 0 #090a10;
    }
    .control-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #090a10; }
    .control-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .face-button { border-radius: 50%; border-color: #874a45; background: linear-gradient(#753f43, #392126); }
    .face-button.confirm { color: #ffd878; }
    .face-button.cancel { color: #b5cde0; }
    .hint { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; text-align: center; }
    .hint strong { color: var(--gold); font-weight: normal; }
    .footer-note { margin: 15px 4px 0; color: #746d61; font-size: 10px; line-height: 1.6; text-align: center; }
    @media (max-width: 560px) {
      .console { width: min(100% - 18px, 820px); }
      .console-head { align-items: start; flex-direction: column; gap: 6px; }
      .control-deck { grid-template-columns: 1fr 1fr; gap: 12px; }
      .hint { grid-column: 1 / -1; grid-row: 1; }
      .dpad { grid-column: 1; grid-row: 2; }
      .action-pad { grid-column: 2; grid-row: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>

      </div>

      consume(action) {
        if (!ACTIONS.has(action)) return false;
        const index = this.queue.indexOf(action);
        if (index < 0) return false;
        this.queue.splice(index, 1);
        return action;
      },
      clear() { this.queue.length = 0; }
    };

    let audioContext;
    function tone(frequency, duration) {
      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        audioContext = audioContext || new AudioCtor();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'square';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.018, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        oscillator.connect(gain); gain.connect(audioContext.destination);
        oscillator.start(); oscillator.stop(audioContext.currentTime + duration);
      } catch (_) { /* Audio is optional in the cartridge shell. */ }
    }

      drawText('一支小队 · 四处山河 · 一盏微灯', 128, 119, '#a99d86', 8, 'center');
      drawText('▶  新的旅程', 128, 157, '#f6e9c9', 10, 'center');
      drawText('原创开发版  0.1', 128, 188, '#65768b', 7, 'center');
      drawText('CONFIRM / ENTER', 128, 207, '#5da3c9', 7, 'center');
    }
    function drawActorSprite(context, actorId, x, y, options = {}) {
      const actor = DATA.ACTORS[actorId] || { visual: { robes: '#6b638a', trim: '#d97862', skin: '#9d5846', head: '#493b52', hair: '#15131b', weapon: 'spear' } };
      if (!context) return false;
      const visual = actor.visual || { robes: actor.color, trim: '#f6e9c9', skin: '#d99a73', head: actor.color, hair: '#202020', weapon: 'staff' };
      const frame = options.frame === 1 ? 2 : 0;
      const flip = options.flip ? -1 : 1;
      const ox = x + (options.width || 32) / 2;
      const top = y + (options.height || 40) - 37;
      context.save();
      context.translate(ox, 0);
      context.scale(flip, 1);
      context.fillStyle = 'rgba(0,0,0,.34)'; context.fillRect(-14, y + 37, 28, 4);
      context.fillStyle = visual.hair; context.fillRect(-9, top + 2, 18, 12);
      context.fillStyle = visual.skin; context.fillRect(-7, top + 6, 14, 10);
      context.fillStyle = visual.head; context.fillRect(-10, top + 1, 20, 5);
      context.fillStyle = visual.trim; context.fillRect(-6, top + 15, 12, 3);
      context.fillStyle = visual.robes; context.fillRect(-11, top + 18, 22, 13);
      context.fillStyle = visual.trim; context.fillRect(-3, top + 18, 6, 13);
      context.fillStyle = visual.skin; context.fillRect(-15, top + 19 + frame, 4, 10); context.fillRect(11, top + 19 - frame, 4, 10);
      context.fillStyle = '#222333'; context.fillRect(-8, top + 31, 6, 7); context.fillRect(2, top + 31, 6, 7);
      context.fillStyle = '#151722'; context.fillRect(-10, top + 37, 9, 3); context.fillRect(1, top + 37, 9, 3);
      if (visual.beard) { context.fillStyle = visual.beard; context.fillRect(-5, top + 12, 10, 7); context.fillRect(-3, top + 18, 6, 4); }
      context.strokeStyle = visual.trim; context.lineWidth = 2;
      if (visual.weapon === 'guandao') { context.beginPath(); context.moveTo(14, top + 37); context.lineTo(17, top - 2); context.lineTo(23, top + 4); context.stroke(); }
      else if (visual.weapon === 'spear') { context.beginPath(); context.moveTo(14, top + 37); context.lineTo(19, top - 4); context.stroke(); }
      else if (visual.weapon === 'fan') { context.fillStyle = '#f0d783'; context.fillRect(12, top + 20, 8, 6); context.stroke(); }
      else if (visual.weapon === 'bow') { context.beginPath(); context.arc(15, top + 23, 7, -1.2, 1.2); context.stroke(); }
      else { context.fillStyle = visual.trim; context.fillRect(12, top + 20, 4, 12); }
      context.restore();
      return true;
    }
    function viewportFor(worldX, worldY) {
      const maxX = Math.max(0, 16 * MAP_TILE_SIZE - WIDTH);
      const maxY = Math.max(0, 16 * MAP_TILE_SIZE - MAP_VIEW_HEIGHT);
      return {
        x: Math.max(0, Math.min(maxX, worldX * MAP_TILE_SIZE - WIDTH / 2 + MAP_TILE_SIZE / 2)),
        y: Math.max(0, Math.min(maxY, worldY * MAP_TILE_SIZE - MAP_VIEW_HEIGHT / 2 + MAP_TILE_SIZE / 2))
      };
    }
    function renderWorld() {
      if (!ctx) return;
      const map = DATA.MAPS[World.mapId] || DATA.MAPS.field;
      const camera = viewportFor(World.x, World.y);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WIDTH, MAP_VIEW_HEIGHT); ctx.clip();
      ctx.fillStyle = map.palette[0]; ctx.fillRect(0, 0, WIDTH, MAP_VIEW_HEIGHT);
      const cell = MAP_TILE_SIZE;
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const sx = x * cell - camera.x; const sy = y * cell - camera.y;
        const wall = map.tiles[y][x] === '#';
        ctx.fillStyle = wall ? map.palette[2] : tileColor(x, y, map.palette);
        ctx.fillRect(sx, sy, cell, cell);
        if (!wall) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(sx + 5, sy + 5, 4, 4); }
      }
      for (const point of map.interactions) {
        const px = point.x * cell - camera.x + 10; const py = point.y * cell - camera.y + 10;
        if (point.actorId) drawActorSprite(ctx, point.actorId, point.x * cell - camera.x, point.y * cell - camera.y - 7, { frame: 0 });
        else { ctx.fillStyle = point.kind === 'npc' ? '#d1b66a' : point.kind === 'chest' ? '#a96d4f' : point.kind === 'recovery' ? '#79b89b' : '#78a6cf'; ctx.fillRect(px, py, 12, 12); }
      }
      drawActorSprite(ctx, World.party[0] || 'liu-bei', World.x * cell - camera.x, World.y * cell - camera.y - 7, { frame: (World.x + World.y) % 2 });
      ctx.restore();
      panel(0, MAP_VIEW_HEIGHT, WIDTH, HEIGHT - MAP_VIEW_HEIGHT, '#111522', '#5a4a34');
      drawText(map.name, 18, MAP_VIEW_HEIGHT + 14, '#f0bd57', 18);
      drawText(`章 ${Game.chapter} · 目标：${Game.currentObjective || World.objective}`, 18, MAP_VIEW_HEIGHT + 43, '#c3bba9', 13);
      drawText(Game.message || map.hint, 18, MAP_VIEW_HEIGHT + 69, '#c3bba9', 12);
      drawText(`队伍 ${World.party.length || 0}/3`, 474, MAP_VIEW_HEIGHT + 18, '#75b6cf', 12, 'right');
      World.party.slice(0, 3).forEach((id, index) => { drawActorSprite(ctx, id, 340 + index * 54, MAP_VIEW_HEIGHT + 45, { frame: index % 2, height: 40 }); drawText(DATA.ACTORS[id].name, 356 + index * 54, MAP_VIEW_HEIGHT + 91, '#f6e9c9', 10, 'center'); });
      if (Game.partySelection.visible) {
        panel(72, 76, 368, 218, '#101522', '#e2b75f');
        drawText('出战编成', 94, 96, '#f0bd57', 18);
        drawText('方向选择 · A 切换 · 选满三人自动出战 · X 保留当前队伍', 94, 125, '#c3bba9', 11);
        Game.partySelection.options.forEach((id, index) => {
          const selected = Game.partySelection.selected.includes(id);
          drawText(`${index === Game.partySelection.cursor ? '▶' : ' '} ${selected ? '■' : '□'} ${DATA.ACTORS[id].name}`, 105, 155 + index * 22, index === Game.partySelection.cursor ? '#f6e9c9' : '#8f9aaa', 14);
        });
      }
    }
    function renderDialogue() {
      renderWorld();
      panel(8, 151, 240, 80, '#101522', '#e2b75f');
      const text = Game.dialogue[Game.dialoguePage] || '';
      drawText('对话', 17, 160, '#f0bd57', 8);
      drawText(text, 17, 178, '#f6e9c9', 8);
      drawText('A 确认', 232, 215, '#75b6cf', 7, 'right');
    }
    function renderBattle() {
      if (!ctx) return;
      const enemy = Battle.enemy || { name: '未定敌阵', troops: 0, morale: 0 };
      ctx.fillStyle = '#151424'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      drawText(Battle.encounter ? Battle.encounter.name : '遭遇战', 24, 22, '#f0bd57', 20);
      ctx.fillStyle = '#383458'; ctx.fillRect(24, 60, 464, 148);
      const enemyId = Battle.encounter && DATA.ENEMIES[Battle.encounter.enemy] ? Battle.encounter.enemy : null;
      drawText('敌阵', 44, 76, '#f2d895', 13);
      drawText(enemy.name, 256, 78, '#e89b81', 18, 'center');
      drawText(`兵力 ${String(enemy.troops).padStart(2, '0')}  士气 ${String(enemy.morale).padStart(2, '0')}`, 256, 111, '#c3bba9', 13, 'center');
      if (enemyId) drawActorSprite(ctx, enemyId, 426, 120, { flip: true, height: 40 });
      ctx.fillStyle = '#6b638a'; ctx.fillRect(44, 180, Math.max(0, Math.round(424 * enemy.troops / Math.max(1, DATA.ENEMIES[Battle.encounter.enemy].troops))), 12);
      let line = 238;
      Object.values(Battle.party || {}).forEach((actor, index) => {
        drawActorSprite(ctx, actor.id, 36 + (index % 4) * 92, line - 10, { frame: index % 2 });
        drawText(`${actor.name} ${String(actor.troops).padStart(2, '0')}/${actor.maxTroops}`, 74 + (index % 4) * 92, line + 4, actor.troops > 0 ? '#f6e9c9' : '#6e6670', 11, 'center');
      });
      panel(18, 326, 476, 138, '#111522', '#5a4a34');
      drawText('1 进击  2 计策  3 防守  4 道具  5 撤退', 36, 344, '#f6e9c9', 13);
      const latest = Battle.log && Battle.log[Battle.log.length - 1];
      drawText(latest ? latest.text : '选择行动，守住这条路。', 36, 378, '#c3bba9', 12);
      drawText(`回合 ${Battle.round}  · ${Battle.pendingActors ? '等待队伍指令' : '行动焦点：全队'}`, 36, 411, '#a99d86', 12);
      drawText('数字键 / 触控按钮 · X 返回', 36, 440, '#5da3c9', 12);
    }
    function renderSpecialState() {
      if (!ctx) return;
      ctx.fillStyle = '#0e121c'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      const titles = { 'battle-result': '战斗记录', camp: '静松营', 'game-over': '灯火暂熄' };
      drawText(titles[Game.state] || '', 128, 42, '#f0bd57', 16, 'center');
      if (Game.state === 'battle-result' && Battle.result) {
        const resultText = Battle.status === 'victory' ? `胜利 · 获得 ${Battle.enemy.reward} 军粮` : '撤退 · 未获得战果';
        drawText(resultText, 128, 86, '#f6e9c9', 9, 'center');
        drawText(Battle.log[Battle.log.length - 1]?.text || '', 128, 112, '#c3bba9', 7, 'center');
      } else {
        drawText(Game.state === 'camp' ? '整理行囊，下一程仍在等候。' : Game.state === 'game-over' ? '队伍全员败退，旅程暂告中止。' : '道路清晰了一些。', 128, 100, '#c3bba9', 8, 'center');
      }
      drawText(Game.state === 'battle-result' ? 'A 确认战果    X 返回标题' : 'A 确认继续    X 返回标题', 128, 182, '#75b6cf', 8, 'center');
    }
    function render() {
      if (Game.state === 'title') renderTitle();
      else if (Game.state === 'world') renderWorld();
      else if (Game.state === 'dialogue') renderDialogue();
      else if (Game.state === 'battle') renderBattle();
      else renderSpecialState();
    }

    function step(action) {
      if (Game.state === 'world' && Game.partySelection.visible) {
        for (const actionName of ['up', 'down', 'confirm', 'cancel']) {
          if (Input.consume(actionName)) Game.partyInput(actionName);
        }
        render();
        return;
      }
      if (Game.state === 'title' && Input.consume('confirm')) { Game.startNew(); render(); return; }
      if (Game.state === 'world') {
        for (const direction of ['up', 'down', 'left', 'right']) {
          if (Input.consume(direction)) {
            const result = World.move(direction);
            if (result.triggered && result.triggered.type === 'exit') Game.message = `前往${DATA.MAPS[World.mapId].name}`;
            else if (result.blocked) Game.message = '前方是无法通行的地形。';
          }
        }
        if (Input.consume('confirm')) {
          const result = World.interact();
          const point = result.triggered;
          if (point && point.type === 'npc' && point.dialogue) Dialogue.start(point.dialogue);
          else if (point && point.type === 'scene' && point.dialogue) Dialogue.start(point.dialogue);
          else if (point && point.type === 'battle' && point.encounter) Battle.start(point.encounter);
          else if (point && point.type === 'chest') Game.message = `获得：${DATA.ITEMS[point.content.item].name}`;
          else if (point && point.type === 'recovery') Game.message = '队伍恢复了兵力。';
          else if (point && point.type === 'exit') Game.message = `前往${DATA.MAPS[World.mapId].name}`;
          else if (!point) Game.message = '这里没有可以交互的对象。';
        }
        if (Input.consume('cancel')) Game.openCamp();
      } else if (Game.state === 'dialogue') {
        if (Input.consume('confirm')) Dialogue.confirm();
        if (Input.consume('cancel')) { Game.state = 'world'; Dialogue.activeId = null; }
      } else if (Game.state === 'camp') {
        if (Input.consume('confirm')) Game.state = 'world';
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Game.state === 'battle') {
        const commandByAction = { 'battle-1': 'attack', 'battle-2': { type: 'tactic', tacticId: 'fire-suppression' }, 'battle-3': 'defend', 'battle-4': { type: 'item' }, 'battle-5': 'retreat' };
        for (let i = 1; i <= 5; i++) {
          const battleAction = `battle-${i}`;
          if (Input.consume(battleAction)) {
            Battle.chooseNext(commandByAction[battleAction]);
            const pending = Object.keys(Battle.party).some((id) => Battle.party[id].troops > 0 && !Battle.choices[id]);
            if (!pending) Battle.resolveRound();
            break;
          }
        }
        if (Input.consume('cancel')) {
          if (Battle.encounter && Battle.encounter.kind === 'normal') Battle.chooseNext('retreat');
          else Game.message = '首领战无法返回。';
        }
      } else if (Game.state === 'battle-result') {
        if (Input.consume('confirm')) Battle.finish();
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Game.state === 'game-over') {
        if (Input.consume('confirm')) Game.returnToTitle();
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Input.consume('cancel')) Game.returnToTitle();
      render();
    }

    window.DATA = DATA;
    window.Input = Input;
    window.Game = Game;
    window.World = World;
    window.Dialogue = Dialogue;
    window.Battle = Battle;
    window.Save = Save;
    window.GameCanvas = canvas;
    window.GameRender = render;
    window.GameStep = step;
    window.drawActorSprite = drawActorSprite;

    window.addEventListener('keydown', (event) => {
      if (event.repeat) return;
      const action = keyActions[event.key] || keyActions[event.code];
      if (!action) return;
      event.preventDefault();
      Input.enqueue(action);
      step(action);
    });
    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const action = button.getAttribute('data-action');
        if (Input.enqueue(action)) { tone(320, .035); step(action); }
      });
      button.addEventListener('click', () => {
        const action = button.getAttribute('data-action');
        if (Input.enqueue(action)) step(action);
      });
    });
    render();
  })();
  </script>
</body>
</html>
