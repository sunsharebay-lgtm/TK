    .control-deck { display: grid; grid-template-columns: 1fr minmax(190px, 250px) 1fr; align-items: center; gap: clamp(16px, 5vw, 48px); margin-top: 18px; padding: 14px; background: rgba(8,9,14,.75); border: 1px solid var(--line); border-radius: 8px; }

  // 成长曲线插值：0=mhp 1=mmp 2=atk 3=def 4=mat 5=mdf 6=agi 7=luk
  function classStat(clsId, statIdx, level) {
    const c = DB.cls[clsId]; if (!c) return 1;
    const arr = c.curves[statIdx];
    const lv = clamp(level, 2, 99); // 原数据 lv1 为占位值，实际从 lv2 起曲线生效
    let i = KEYLV.length - 1;
    while (i > 0 && KEYLV[i] > lv) i--;
    const lv0 = KEYLV[i], lv1 = KEYLV[Math.min(i + 1, KEYLV.length - 1)];
    const v0 = arr[i], v1 = arr[Math.min(i + 1, KEYLV.length - 1)];
    if (lv1 === lv0) return v0;
    // MV 参数曲线为凸形，用幂插值（k≈0.85）拟合比线性更贴近原数据
    const t = Math.pow((lv - lv0) / (lv1 - lv0), 0.85);
    return Math.round(v0 + (v1 - v0) * t);
  }
  function learnedSkills(clsId, level) {
    return (DB.cls[clsId].learnings || []).filter(l => l[0] <= level).map(l => l[1]);
  }

  let audioCtx = null;
  function tone(freq, dur, type = 'square', vol = 0.02) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function rasterize(rows, pal, bg) {
    const cv = document.createElement('canvas');
    cv.width = 16 * PX; cv.height = 16 * PX;
    const c = cv.getContext('2d');
    if (bg) { c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height); }
    for (let y = 0; y < 16; y++) {
      const row = rows[y] || '';
      for (let x = 0; x < 16; x++) {
        const ch = row[x] || '.';
        if (ch === '.') continue;
        const col = pal[ch];
        if (!col) continue;
        c.fillStyle = col;
        c.fillRect(x * PX, y * PX, PX, PX);
      }
    }
    return cv;
  }

    const cv = rasterize(def.art, pal, def.bg || null);

    return cv;
  }

  function actorSprite(actorId, dir, frame) {

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }

    c.fillStyle = '#20202c'; c.fillRect(8, 25, 16, 2);

    c.strokeStyle = '#cfd4dc'; c.lineWidth = 1.6;
    c.beginPath();
    if (enemyId % 3 === 0) { c.moveTo(27, 27); c.lineTo(29, 4); }
    else if (enemyId % 3 === 1) { c.moveTo(26, 26); c.lineTo(30, 6); c.lineTo(24, 9); }
    else { c.moveTo(26, 27); c.lineTo(31, 8); c.moveTo(31, 8); c.lineTo(27, 12); }

  function newActor(id) {
    // 初始职业映射：主角团各自 classId=id（数据表同构）
    const cls = DB.cls[id] ? id : 2;
    const inst = {
      id, cls, lvl: 1, exp: 0,
      eq: [0, 0]              // 武器/防具 id（0=空）
    };
    inst.mhp = classStat(cls, 0, 1);
    inst.mmp = classStat(cls, 1, 1);
    inst.hp = inst.mhp; inst.mp = inst.mmp;
    return inst;
  }
  function recalc(a) {
    const oldMhp = a.mhp || 0;
    a.mhp = classStat(a.cls, 0, a.lvl);
    a.mmp = classStat(a.cls, 1, a.lvl);
    if (oldMhp) a.hp = clamp(a.hp + Math.max(0, a.mhp - oldMhp), 0, a.mhp);
    else a.hp = a.mhp;
    a.mp = clamp(a.mp, 0, a.mmp);
  }
  function actorAtk(a) { return classStat(a.cls, 2, a.lvl) + (DB.weapon[a.eq[0]] ? DB.weapon[a.eq[0]].atk : 0); }
  function actorDef(a) { return classStat(a.cls, 3, a.lvl) + (DB.armor[a.eq[1]] ? DB.armor[a.eq[1]].def : 0); }
  function actorMat(a) { return classStat(a.cls, 4, a.lvl); }
  function actorAgi(a) { return classStat(a.cls, 6, a.lvl); }
  function actorLuk(a) { return classStat(a.cls, 7, a.lvl); }
  function expToNext(lvl) { return Math.floor(25 * Math.pow(lvl, 1.8)); }

  function addItem(itemId, n) { G.items[itemId] = (G.items[itemId] || 0) + n; }
  function hasItem(itemId) { return (G.items[itemId] || 0) > 0; }
  function removeItem(itemId, n) {
    if (!hasItem(itemId)) return false;
    G.items[itemId] -= n;
    if (G.items[itemId] <= 0) delete G.items[itemId];
    return true;
  }
  function joinActor(id) {
    if (!G.actors[id]) { G.actors[id] = newActor(id); }
    if (!G.roster.includes(id) && G.roster.length < 5) G.roster.push(id);
    G.flags['joined_' + id] = true;
  }

  function saveGame() {
    const actors = {};
    for (const k in G.actors) { const a = G.actors[k]; actors[k] = { cls: a.cls, lvl: a.lvl, exp: a.exp, hp: a.hp, mp: a.mp, eq: a.eq.slice() }; }
    return Save.ok({
      ver: 1, roster: G.roster.slice(), actors, gold: G.gold, items: Object.assign({}, G.items),
      flags: Object.assign({}, G.flags), mapId: G.mapId, x: G.x, y: G.y, dir: G.dir, chapterDone: G.chapterDone
    });
  }
  function loadGame() {
    const s = Save.load();
    if (!s) return false;
    G.roster = s.roster.filter(id => id);
    G.actors = {};
    for (const k in s.actors) {
      const raw = s.actors[k];
      const a = { id: +k, cls: raw.cls, lvl: raw.lvl, exp: raw.exp, hp: raw.hp, mp: raw.mp, eq: raw.eq.slice(), mhp: 1, mmp: 1 };
      recalc(a); a.hp = clamp(raw.hp, 0, a.mhp); a.mp = clamp(raw.mp, 0, a.mmp);
      G.actors[k] = a;
    }
    G.gold = s.gold || 0; G.items = s.items || {}; G.flags = s.flags || {};
    if (MAPS[s.mapId]) { G.mapId = s.mapId; G.x = s.x; G.y = s.y; G.dir = s.dir || 'down'; }
    G.steps = 0; G.chapterDone = !!s.chapterDone;
    return true;
  }

    },
    confirm() {
      if (!G.dlg) return;
      if (G.dlg.page < G.dlg.pages.length - 1) { G.dlg.page++; SFX.move(); return; }
      const cb = G.dlg.onEnd;
      G.dlg = null;
      G.state = 'world';
      if (cb) cb();
    }
  };
  function wrapLines(lines) {
    // 每行按宽度拆页：每页最多2行、每行22字
    const pages = [];
    let buf = [];
    for (let raw of lines) {
      raw = String(raw);
      while (raw.length > 22) {
        buf.push(raw.slice(0, 22));
        raw = raw.slice(22);
        if (buf.length >= 2) { pages.push(buf); buf = []; }
      }
      buf.push(raw);
      if (buf.length >= 2) { pages.push(buf); buf = []; }
    }
    if (buf.length) pages.push(buf);
    return pages.length ? pages : [['…']];
  }

  // ════════════════════════ 世界探索 ════════════════════════
  function tryMove(dir) {
    G.dir = dir;
    const dx = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;
    const dy = dir === 'up' ? -1 : dir === 'down' ? 1 : 0;
    const nx = G.x + dx, ny = G.y + dy;
    const ch = tileCh(G.mapId, nx, ny);
    if (isSolid(ch)) { SFX.step(); return false; }
    G.x = nx; G.y = ny;
    G.frame ^= 1;
    SFX.move();
    afterStep();
    return true;
  }

  function faceEvent(dx, dy) {
    const m = MAPS[G.mapId];
    if (!m) return null;
    for (const ev of m.events || []) {
      if (ev.x === G.x + dx && ev.y === G.y + dy) return ev;
    }
    return null;
  }

  function interact() {
    const dx = G.dir === 'left' ? -1 : G.dir === 'right' ? 1 : 0;
    const dy = G.dir === 'up' ? -1 : G.dir === 'down' ? 1 : 0;
    const ev = faceEvent(dx, dy);
    if (!ev) return;
    handleEvent(ev);
  }

  function handleEvent(ev) {
    switch (ev.t) {
      case 'npc': {
        if (ev.cond && !G.flags[ev.cond]) return;
        if (ev.flag && G.flags[ev.flag]) {
          Dialogue.start(['（此人已与你并肩作战。）']);
          return;
        }
        const lines = (ev.lines || []).slice();
        Dialogue.start(lines, () => {
          if (ev.join) joinActor(ev.join);
          if (ev.flag) G.flags[ev.flag] = true;
          if (ev.event) runStoryEvent(ev.event);
        });
        break;
      }
      case 'chest': {
        if (G.flags[ev.flag]) { G.msg = { text: '箱子已经空了。', t: 90 }; return; }
        G.flags[ev.flag] = true;
        SFX.open();
        if (ev.gold) { G.gold += ev.gold; G.msg = { text: `发现 ${ev.gold} 金！`, t: 120 }; }
        if (ev.item) {
          addItem(ev.item[0], ev.item[1]);
          const nm = DB.item[ev.item[0]] ? DB.item[ev.item[0]].name : '?';
          G.msg = { text: `获得 ${nm} ×${ev.item[1]}！`, t: 120 };
        }
        break;
      }
      case 'door':
        transferTo(ev.to, ev.tx, ev.ty);
        break;
      case 'exit':
        transferTo(ev.to, ev.tx, ev.ty);
        break;
      case 'shopkeeper': openShop(ev.kind); break;
      case 'innkeeper': openInn(); break;
      case 'trainer': openTrain(); break;
      case 'trigger': {
        if (G.flags[ev.flag]) return;
        const lines = (ev.intro || []).slice();
        Dialogue.start(lines, () => startBattle(ev.troop, { flag: ev.flag }));
        break;
      }
      case 'boss': runBossSequence(ev.seq); break;
    }
  }

  function transferTo(mapId, tx, ty) {
    if (!MAPS[mapId]) return;
    // 记录来路用于 back
    G._lastMap = { mapId: G.mapId, x: G.x, y: G.y };
    G.mapId = mapId; G.x = tx; G.y = ty;
    G.steps = 0;
    // 进入城镇/室内时设安全步数，出城后5步内不遭遇
    if (MAPS[mapId].town || MAPS[mapId].indoor) G.safeSteps = 5;
    tone(440, .05); tone(560, .05);
    if (mapId === 'xuzhou') G.flags['left_xuzhou'] = true;
  }

  function afterStep() {
    const m = MAPS[G.mapId];
    if (!m) return;
    // 出口/门事件（踩上即触发——FC 式走入进门）
    for (const ev of m.events || []) {
      if ((ev.t === 'exit' || ev.t === 'door') && ev.x === G.x && ev.y === G.y) {
        if (ev.back) { const lm = G._lastMap; if (lm) transferTo(lm.mapId, lm.x, lm.y); }
        else transferTo(ev.to, ev.tx, ev.ty);
        return;
      }
    }
    // 主线触发（踩上即触发）
    for (const ev of m.events || []) {
      if (ev.t === 'trigger' && ev.x === G.x && ev.y === G.y && !G.flags[ev.flag]) {
        Dialogue.start(ev.intro || ['敌袭！'], () => startBattle(ev.troop, { flag: ev.flag }));
        return;
      }
    }
    // 随机遭遇（安全区内不遭遇）
    if (m.encounter && !m.town) {
      if (G.safeSteps > 0) {
        G.safeSteps--;
      } else {
        G.steps++;
        const enc = m.encounter;
        if (G.steps >= enc.steps && chance(0.5)) {
          G.steps = 0;
          const total = enc.troops.reduce((s, t) => s + t[1], 0);
          let r = Math.random() * total;
          for (const [tid, w] of enc.troops) { r -= w; if (r <= 0) { startBattle(tid, {}); return; } }
        }
      }
    }
  }

  // ════════════════════════ 剧情事件 · 第一章 ════════════════════════

  function runBossSequence(seqIds) {
    const seq = [];
    for (const sid of seqIds) {
      if (sid === 'troop17') seq.push({ troop: 17, intro: [
        '王宫大殿，袁术凭几而坐，冠冕歪斜。',

  function nextBossFight() {
    const q = G._bossQueue || [];

      chapterOneClear();
      return;
    }
    const f = q.shift();
    Dialogue.start(f.intro, () => startBattle(f.troop, { flag: f.flag, boss: true, healAfter: f.healAfter }));

  // ════════════════════════ 商店 / 客栈 / 役店 ════════════════════════
  const SHOP_STOCK = {
    weapon: { goods: [['w', 1], ['w', 2], ['w', 3], ['w', 6]], greeting: '武器店：短剑、铜剑、铁剑，皆是杀敌利器！' },
    item: { goods: [['i', 1], ['i', 2], ['i', 8], ['i', 17], ['i', 18], ['i', 16]], greeting: '道具店：丹药符水，行军必备！' },
    shield: { goods: [['a', 1], ['a', 2], ['a', 3]], greeting: '' }
  };
  function shopGoods(kind) {
    if (kind === 'weapon') return SHOP_STOCK.weapon.goods;
    if (kind === 'item') return SHOP_STOCK.item.goods;
    return [];
  }
  function goodInfo(g) {
    if (g[0] === 'w') return { cat: 'w', id: g[1], name: DB.weapon[g[1]].name, price: DB.weapon[g[1]].price, desc: '攻+' + DB.weapon[g[1]].atk };
    if (g[0] === 'a') return { cat: 'a', id: g[1], name: DB.armor[g[1]].name, price: DB.armor[g[1]].price, desc: '防+' + DB.armor[g[1]].def };
    const it = DB.item[g[1]];
    let desc = '';
    for (const ef of (it.effects || [])) {
      if (ef[0] === 'hp') desc = '回复' + (ef[1] || '全') + '兵力';
      else if (ef[0] === 'mp') desc = '回复' + (ef[1] || '全') + '策略';
      else if (ef[0] === 'revive') desc = '复活';
    }
    return { cat: 'i', id: g[1], name: it.name, price: it.price, desc };
  }

  function openShop(kind) {
    G.shop = { kind, mode: 'buy', cursor: 0, msg: null };
    G.state = 'shop';
    SFX.open();
  }
  function openInn() {
    // 客栈费用：每人固定费用随等级增长（FC 风格）
    let cost = 0;
    for (const id of G.roster) {
      const a = G.actors[id];
      if (a) cost += 10 + a.lvl * 5;
    }
    cost = Math.max(10, cost);
    G.shop = { kind: 'inn', cost, cursor: 0, msg: null };
    G.state = 'shop';
    SFX.open();
  }
  function openTrain() {
    G.shop = { kind: 'train', cursor: 0, msg: null };
    G.state = 'shop';
    SFX.open();
  }
  function innStay() {
    const cost = G.shop.cost;
    if (G.gold < cost) { G.shop.msg = '金子不够啊……'; SFX.cancel(); return; }
    G.gold -= cost;
    for (const k in G.actors) {
      const a = G.actors[k];
      a.hp = a.mhp; a.mp = a.mmp;
    }
    SFX.healSfx();
    G.shop.msg = '一行人安睡一夜，兵力策略尽复。';
    setTimeout(() => { if (G.shop && G.shop.kind === 'inn') closeShop(); }, 1200);
  }
  function trainOnce() {
    // 花 exp×3 金换 100 战功（经验），分配给出战全员
    const gain = 100;
    const cost = Math.ceil(gain * 2.5);
    if (G.gold < cost) { G.shop.msg = '军资不足。'; SFX.cancel(); return; }
    G.gold -= cost;
    for (const id of G.roster) grantExp(G.actors[id], gain);
    SFX.buy();
    G.shop.msg = `操练完毕！各将战功 +${gain}`;
  }
  function buyGood() {
    const goods = shopGoods(G.shop.kind);
    if (!goods.length) return;
    const g = goodInfo(goods[G.shop.cursor]);
    if (G.gold < g.price) { G.shop.msg = '金子不够……'; SFX.cancel(); return; }
    G.gold -= g.price;
    if (g.cat === 'i') addItem(g.id, 1);
    else {
      // 装备直接进仓库（items 用负数键？）——改为装备袋
      G.bagEquip = G.bagEquip || {};
      const key = g.cat + ':' + g.id;
      G.bagEquip[key] = (G.bagEquip[key] || 0) + 1;
    }
    SFX.buy();
    G.shop.msg = `买下了 ${g.name}。`;
  }
  function sellCursor() {
    // 出售当前背包光标物品
    const list = sellableList();
    if (!list.length) return;
    const s = list[G.shop.sellCursor || 0];
    if (s.cat === 'i') removeItem(s.id, 1);
    else {
      const key = s.cat + ':' + s.id;
      G.bagEquip[key]--; if (G.bagEquip[key] <= 0) delete G.bagEquip[key];
    }
    G.gold += Math.floor(s.price / 2);
    SFX.buy();
    G.shop.msg = `卖出 ${s.name}，得 ${Math.floor(s.price / 2)} 金。`;
  }
  function sellableList() {
    const out = [];
    for (const k in G.items) if (G.items[k] > 0 && DB.item[k]) out.push({ cat: 'i', id: +k, name: DB.item[k].name, price: DB.item[k].price, count: G.items[k] });
    for (const k in (G.bagEquip || {})) {
      const [cat, id] = k.split(':');
      const db = cat === 'w' ? DB.weapon[id] : DB.armor[id];
      if (db && G.bagEquip[k] > 0) out.push({ cat, id: +id, name: db.name, price: db.price, count: G.bagEquip[k] });
    }
    return out;
  }
  function closeShop() { G.shop = null; G.state = 'world'; }

  // ════════════════════════ 战斗系统（吞食天地Ⅱ 机制） ════════════════════════
  function startBattle(troopId, opt) {
    const troop = DB.troop[troopId];
    if (!troop) return;
    const enemies = [];
    for (const eid of troop.members.slice(0, 5)) {
      const e = DB.enemy[eid];
      if (!e) continue;
      enemies.push({
        eid, name: e.name, mhp: e.p[0], hp: e.p[0], mmp: e.p[1], mp: e.p[1],
        atk: e.p[2], def: e.p[3], mat: e.p[4], mdf: e.p[5], agi: e.p[6],
        exp: e.exp, gold: e.gold, acts: e.acts || [], drops: e.drops || []
      });
    }
    G.battle = {
      troopId, enemies,
      party: G.roster.map(id => ({ id, actor: G.actors[id], defending: false, buffAtkDown: false })),
      phase: 'intro',           // intro→command→target→submenu→resolve→result
      cmdCursor: 0, subCursor: 0, targetCursor: 0, memberIdx: 0,
      choices: [],              // [{actorRef, kind:'attack/tactic/defend/item', skillId?, itemId?, target?}]
      queue: [],                // 待显示战斗消息
      log: [],
      round: 0,
      flag: opt.flag || null, boss: !!opt.boss, healAfter: !!opt.healAfter,
      result: null, popups: [], msgTimer: 0, curMsg: null,
      flash: 12                 // 遭遇闪光计数器
    };
    G.state = 'battle';
    // 遭遇音效：快速下降扫频 + 重击
    for (let i = 0; i < 6; i++) setTimeout(() => tone(800 - i * 120, .03, 'square', .02), i * 25);
    setTimeout(() => { tone(120, .15, 'sawtooth', .05); tone(80, .18, 'square', .04); }, 160);
    // 显示遭遇敌人名称
    const enemyNames = [...new Set(enemies.map(e => e.name))];
    pushBMsg('遭遇了 ' + enemyNames.join('、') + '！');
  }

  function bParty() { return G.battle.party.filter(p => p.actor.hp > 0); }
  function bEnemies() { return G.battle.enemies.filter(e => e.hp > 0); }

  function pushBMsg(text) {
    G.battle.queue.push(text);
    G.battle.log.push(text);
    if (G.battle.log.length > 30) G.battle.log.shift();
  }

  // ---- 敌方 AI：rating 加权 + HP/MP 条件 ----
  function enemyChooseAction(en) {
    const acts = en.acts.length ? en.acts : [[1, 5, 0, 0]];
    const pool = [];
    for (const [skillId, rating, condType, condParam] of acts) {
      let ok = true;
      if (condType === 2) ok = en.hp / en.mhp < condParam;   // HP 低于比例
      else if (condType === 3) ok = en.mp / Math.max(1, en.mmp) < condParam; // MP 低于比例
      if (ok && rating > 0) pool.push([skillId, rating]);
    }
    if (!pool.length) pool.push([1, 5]);
    let total = pool.reduce((s, p) => s + p[1], 0);
    let r = Math.random() * total;
    for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
    return pool[0][0];
  }

  function physDamage(atkVal, defVal) {
    const raw = atkVal * 4 - defVal * 2;
    return Math.max(1, Math.round(Math.max(1, raw) * variance(0.85, 1.15)));
  }
  function tacticDamage(coef, matVal, divisor) {
    return Math.max(1, Math.round(coef * matVal / divisor * variance(0.9, 1.1)));
  }
  function tacticHeal(coef, matVal) {
    return Math.max(1, Math.round(coef * matVal / 256));
  }

  function applyHeroAction(choice) {
    const a = choice.actor;
    if (a.actor.hp <= 0) return;
    if (choice.kind === 'attack') {
      const t = choice.target;
      if (!t || t.hp <= 0) return;
      const crit = chance(1 / 16 + actorLuk(a.actor) / 4096);
      let dmg = physDamage(actorAtk(a.actor), t.def);
      if (a.buffAtkDown) dmg = Math.floor(dmg * 0.8);
      if (crit) { dmg = Math.floor(dmg * 1.6); SFX.crit(); } else SFX.hit();
      t.hp = Math.max(0, t.hp - dmg);
      addPopup('e', t, '-' + dmg, crit ? '#ffd24a' : '#ffffff');
      pushBMsg(`${actorName(a.id)} 突击 ${t.name}，歼敌 ${dmg}！${crit ? '会心一击！' : ''}`);
    } else if (choice.kind === 'tactic') {
      const sk = DB.skill[choice.skillId];
      if (!sk) return;
      if (a.actor.mp < sk.mp) { pushBMsg(`${actorName(a.id)} 的策略值不足！`); return; }
      a.actor.mp -= sk.mp;
      SFX.tactic();
      if (sk.kind === 1) {
        // 伤害计策
        if (sk.scope === 1) {
          const t = choice.target && choice.target.hp > 0 ? choice.target : bEnemies()[0];
          if (!t) return;
          const dmg = tacticDamage(sk.coef, actorMat(a.actor), 256);
          t.hp = Math.max(0, t.hp - dmg);
          addPopup('e', t, '-' + dmg, '#ff8a5a');
          pushBMsg(`${actorName(a.id)} 施展 ${sk.name}，${t.name}军损失 ${dmg}！`);
        } else {
          const dmgEach = tacticDamage(sk.coef, actorMat(a.actor), 256);
          pushBMsg(`${actorName(a.id)} 施展 ${sk.name}，敌军一片火海！`);
          for (const t of bEnemies()) {
            t.hp = Math.max(0, t.hp - dmgEach);
            addPopup('e', t, '-' + dmgEach, '#ff8a5a');
          }
        }
      } else if (sk.kind === 2) {
        // 恢复计策
        SFX.healSfx();
        const amt = tacticHeal(sk.coef, actorMat(a.actor));
        if (sk.scope >= 7) {
          pushBMsg(`${actorName(a.id)} 施展 ${sk.name}，全军兵力回升！`);
          for (const m of bParty()) {
            m.actor.hp = clamp(m.actor.hp + amt, 0, m.actor.mhp);
            addPopup('p', m, '+' + amt, '#7ce08a');
          }
        } else {
          const t = choice.target && choice.target.actor.hp > 0 ? choice.target : bParty()[0];
          if (!t) return;
          t.actor.hp = clamp(t.actor.hp + amt, 0, t.actor.mhp);
          addPopup('p', t, '+' + amt, '#7ce08a');
          pushBMsg(`${actorName(a.id)} 施展 ${sk.name}，${actorName(t.id)} 回复 ${amt} 兵力。`);
        }
      } else {
        // 辅助计策（简化实现）
        if (choice.skillId === 47) { // 缩地计：脱离战斗
          pushBMsg(`${actorName(a.id)} 施展缩地计，全军脱离战场！`);
          G.battle.retreatMagic = true;
          return;
        }
        if (choice.skillId === 46) { // 嘲骂计：敌攻降低
          for (const t of bEnemies()) t.atkDown = true;
          pushBMsg(`${actorName(a.id)} 一阵嘲骂，敌军阵脚大乱！`);
          return;
        }
        pushBMsg(`${actorName(a.id)} 施展 ${sk.name}！`);
      }
    } else if (choice.kind === 'defend') {
      a.defending = true;
      pushBMsg(`${actorName(a.id)} 收拢队形，严阵以待。`);
    } else if (choice.kind === 'item') {
      const it = DB.item[choice.itemId];
      if (!it) return;
      removeItem(choice.itemId, 1);
      SFX.healSfx();
      const t = choice.target || a;
      for (const ef of (it.effects || [])) {
        if (ef[0] === 'hp') t.actor.hp = ef[1] ? clamp(t.actor.hp + ef[1], 0, t.actor.mhp) : t.actor.mhp;
        else if (ef[0] === 'mp') t.actor.mp = ef[1] ? clamp(t.actor.mp + ef[1], 0, t.actor.mmp) : t.actor.mmp;
        else if (ef[0] === 'revive' && t.actor.hp <= 0) t.actor.hp = Math.max(1, Math.floor(t.actor.mhp / 2));
      }
      addPopup('p', t, '道具', '#7ce08a');
      pushBMsg(`${actorName(a.id)} 对 ${actorName(t.id)} 使用了 ${it.name}。`);
    }
  }

  function applyEnemyAction(en) {
    const skillId = enemyChooseAction(en);
    const sk = DB.skill[skillId];
    if (!sk) {
      // 普通突击
      const targets = bParty();
      if (!targets.length) return;
      const t = targets[randInt(targets.length)];
      let dmg = physDamage(en.atk, actorDef(t.actor));
      if (en.atkDown) dmg = Math.floor(dmg * 0.8);
      if (t.defending) dmg = Math.floor(dmg * 0.45);
      dmg = Math.max(1, dmg);
      t.actor.hp = Math.max(0, t.actor.hp - dmg);
      SFX.hit();
      addPopup('p', t, '-' + dmg, '#ff6a6a');
      pushBMsg(`${en.name}军 猛攻 ${actorName(t.id)}，损失 ${dmg} 兵！`);
      return;
    }
    if (sk.kind === 1) {
      SFX.tactic();
      if (sk.scope === 1) {
        const targets = bParty();
        if (!targets.length) return;
        const t = targets[randInt(targets.length)];
        const dmg = tacticDamage(sk.coef, en.mat, 960);
        t.actor.hp = Math.max(0, t.actor.hp - dmg);
        addPopup('p', t, '-' + dmg, '#ff8a5a');
        pushBMsg(`${en.name} 施展 ${sk.name}，${actorName(t.id)} 损失 ${dmg} 兵！`);
      } else {
        const dmgEach = tacticDamage(sk.coef, en.mat, 960);
        pushBMsg(`${en.name} 施展 ${sk.name}，我军全线受创！`);
        for (const t of bParty()) {
          let d = t.defending ? Math.floor(dmgEach * 0.45) : dmgEach;
          t.actor.hp = Math.max(0, t.actor.hp - d);
          addPopup('p', t, '-' + d, '#ff8a5a');
        }
      }
    } else if (sk.kind === 2) {
      SFX.healSfx();
      const amt = tacticHeal(sk.coef, en.mat);
      en.hp = clamp(en.hp + amt, 0, en.mhp);
      addPopup('e', en, '+' + amt, '#7ce08a');
      pushBMsg(`${en.name} 施展 ${sk.name}，回复 ${amt} 兵力！`);
    } else if (sk.name === '智复计') {
      en.mp = en.mmp;
      pushBMsg(`${en.name} 运气回神，策略恢复！`);
    } else {
      // 敌方辅助计策 → 视为削弱我方
      const targets = bParty();
      if (targets.length) targets.forEach(t => { t.buffAtkDown = true; });
      pushBMsg(`${en.name} 施展 ${sk.name}，我军士气受挫！`);
    }
  }

  function addPopup(side, ref, text, color) {
    G.battle.popups.push({ side, ref, text, color, t: 42 });
  }

  function resolveRound() {
    B = G.battle;
    B.round++;
    const order = [];
    for (const c of B.choices) order.push({ side: 'p', c, agi: actorAgi(c.actor.actor) });
    for (const en of bEnemies()) order.push({ side: 'e', en, agi: en.agi });
    order.sort((x, y) => y.agi - x.agi);
    for (const o of order) {
      if (G.battle.result) break;
      if (o.side === 'p') applyHeroAction(o.c);
      else applyEnemyAction(o.en);
      // 中途检查胜负
      if (!bEnemies().length) { battleVictory(); return; }
      if (!bParty().length) { battleDefeat(); return; }
    }
    if (G.battle && !G.battle.result) {
      B.choices = [];
      B.memberIdx = nextLivingMember(-1);
      B.phase = 'command';
      B.cmdCursor = 0;
    }
    // 回合结束：清空临时减益
    for (const en of B.enemies) delete en.atkDown;
    for (const p of B.party) p.buffAtkDown = false;
  }
  function nextLivingMember(from) {
    const P = G.battle.party;
    for (let i = from + 1; i < P.length; i++) if (P[i].actor.hp > 0) return i;
    return -1;
  }

  function battleVictory() {
    B = G.battle;
    let expSum = 0, goldSum = 0;
    const drops = [];
    for (const e of B.enemies) {
      expSum += e.exp; goldSum += e.gold;
      for (const d of e.drops) {
        if ((d[0] === 'i' || d[0] === 'w' || d[0] === 'a') && chance(1 / Math.max(1, d[2]))) drops.push(d);
      }
    }
    for (const d of drops) {
      if (d[0] === 'i') addItem(d[1], 1);
      else { G.bagEquip = G.bagEquip || {}; const k = d[0] + ':' + d[1]; G.bagEquip[k] = (G.bagEquip[k] || 0) + 1; }
    }
    G.gold += goldSum;
    const allLevelUps = [];
    for (const id of G.roster) {
      const ups = grantExp(G.actors[id], expSum);
      if (ups.length) allLevelUps.push({ name: actorName(id), ups });
    }
    SFX.victory();
    let msg = `敌军溃散！战功 +${expSum}　军资 +${goldSum} 金`;
    if (allLevelUps.length) {
      SFX.levelup();
      for (const { name, ups } of allLevelUps) {
        for (const u of ups) {
          msg += `\n${name} 达到 ${u.lvl} 级！`;
          if (u.newSkills.length) msg += ` 学会 ${u.newSkills.join('、')}！`;
        }
      }
    }
    const dropNames = drops.map(d => d[0] === 'i' ? DB.item[d[1]].name : d[0] === 'w' ? DB.weapon[d[1]].name : DB.armor[d[1]].name);
    if (dropNames.length) msg += `\n缴获：${dropNames.join('、')}`;
    B.victoryMsg = msg.split('\n');
    B._levelUps = allLevelUps;
    B._drops = dropNames;
    B.result = 'victory';
    B.phase = 'result';
    if (B.flag) G.flags[B.flag] = true;
  }

  function grantExp(a, exp) {
    const oldLvl = a.lvl;
    a.exp += exp;
    const levelUps = [];
    while (a.lvl < 99 && a.exp >= expToNext(a.lvl)) {
      a.lvl++;
      recalc(a);
      // 检查新学会的策略
      const newSkills = learnedSkills(a.cls, a.lvl).filter(sid => !learnedSkills(a.cls, a.lvl - 1).includes(sid));
      levelUps.push({ lvl: a.lvl, newSkills: newSkills.map(sid => DB.skill[sid] ? DB.skill[sid].name : '?') });
    }
    return levelUps;
  }

  function battleDefeat() {
    B = G.battle;
    SFX.defeat();
    B.result = 'defeat';
    B.phase = 'result';
  }

  function finishBattle() {
    const B = G.battle;
    if (B.result === 'victory' && B.healAfter) {
      for (const k in G.actors) { const a = G.actors[k]; a.hp = a.mhp; a.mp = a.mmp; }
    }
    const wasBoss = B.boss;
    G.battle = null;
    G.state = 'world';
    if (wasBoss) nextBossFight();
  }

  let B = null; // battle 快捷引用

  // ════════════════════════ 状态机 · 输入调度 ════════════════════════
  const BATTLE_CMDS = ['attack', 'tactic', 'defend', 'item', 'other'];
  const BATTLE_CMD_NAMES = { attack: '突击', tactic: '策略', defend: '防御', item: '道具', other: '其他' };

  function step(action) {
    if (!action) return;
    switch (G.state) {
      case 'title': stepTitle(action); break;
      case 'world': stepWorld(action); break;
      case 'dialogue': if (action === 'confirm') Dialogue.confirm(); break;
      case 'menu': stepMenu(action); break;
      case 'shop': stepShop(action); break;
      case 'battle': stepBattle(action); break;
      case 'chapterend': stepChapterEnd(action); break;
      case 'gameover':
        if (Save.load()) {
          if (action === 'up' || action === 'down') { G.titleCursor = (G.titleCursor + 1) % 2; SFX.move(); }
          else if (action === 'confirm') {
            SFX.confirm();
            if (G.titleCursor === 0 && loadGame()) { G.state = 'world'; }
            else { G.state = 'title'; G.titleCursor = 0; }
          }
        } else {
          if (action === 'confirm') { G.state = 'title'; G.titleCursor = 0; }
        }
        break;
    }
  }

  // ---- 标题 ----
  function stepTitle(a) {
    const saveExists = !!Save.load();
    const opts = saveExists ? 2 : 1;
    if (a === 'up' || a === 'down') { G.titleCursor = (G.titleCursor + 1) % opts; SFX.move(); }
    else if (a === 'confirm') {
      SFX.confirm();
      if (G.titleCursor === 1 && saveExists && loadGame()) { G.state = 'world'; }
      else newGame();
    }
  }

  function newGame() {
    G.roster = []; G.actors = {}; G.gold = 500; G.items = {}; G.flags = {};
    G.bagEquip = {};
    joinActor(2);
    addItem(1, 3);
    G.mapId = 'xuzhou'; G.x = 8; G.y = 14; G.dir = 'down'; G.steps = 0;
    G.chapterDone = false;
    G.state = 'world';
    G.msg = { text: '【第一章·灭袁术】先去官署见曹操。', t: 240 };
  }

  // ---- 世界 ----
  function stepWorld(a) {
    if (_statusView && _statusView.t > 0) { _statusView = null; SFX.cancel(); return; }
    if (G._help) { G._help = null; SFX.cancel(); return; }
    if (a === 'up') tryMove('up');
    else if (a === 'down') tryMove('down');
    else if (a === 'left') tryMove('left');
    else if (a === 'right') tryMove('right');
    else if (a === 'confirm') interact();
    else if (a === 'menu' || a === 'cancel') MenuSys.open();
    else if (a === 'status') quickStatus();
    else if (a === 'help') { G._help = true; SFX.open(); }
  }
  let _statusView = null;
  function quickStatus() {
    _statusView = { t: 200 };
    SFX.open();
  }

  // ---- 菜单 ----
  function stepMenu(a) {
    const M = G.menu;
    if (M.screen === 'main') {
      const n = MenuSys.mainItems().length;
      if (a === 'up') { M.cursor = (M.cursor + n - 1) % n; SFX.move(); }
      else if (a === 'down') { M.cursor = (M.cursor + 1) % n; SFX.move(); }
      else if (a === 'confirm') {
        SFX.confirm();
        const sel = MenuSys.mainItems()[M.cursor];
        if (sel === '关闭') MenuSys.close();
        else if (sel === '存档') { const okk = saveGame(); M.msg = okk ? '记录已保存。' : '保存失败！'; setTimeout(()=>{ if(G.menu) G.menu.msg=null; }, 1000); }
        else { M.screen = sel === '状态' ? 'status' : sel === '道具' ? 'items' : 'equip'; M.subCursor = 0; M.memberIdx = 0; M.msg = null; }
      }
      else if (a === 'cancel' || a === 'menu') MenuSys.close();
    } else if (M.screen === 'items') {
      const list = inventoryList();
      if (a === 'up' && list.length) { M.subCursor = (M.subCursor + list.length - 1) % list.length; SFX.move(); }
      else if (a === 'down' && list.length) { M.subCursor = (M.subCursor + 1) % list.length; SFX.move(); }
      else if (a === 'confirm') {
        if (list.length) {
          const it = list[M.subCursor];
          M.pendItem = it; M.screen = 'itemTarget'; M.memberIdx = 0;
          SFX.confirm();
        }
      }
      else if (a === 'cancel') { M.screen = 'main'; SFX.cancel(); }
    } else if (M.screen === 'itemTarget') {
      const alive = G.roster.filter(id => G.actors[id] && G.actors[id].hp > 0);
      const idxInAlive = Math.min(M.memberIdx, Math.max(0, alive.length - 1));
      if (a === 'up' && alive.length) { M.memberIdx = (idxInAlive + alive.length - 1) % alive.length; SFX.move(); }
      else if (a === 'down' && alive.length) { M.memberIdx = (idxInAlive + 1) % alive.length; SFX.move(); }
      else if (a === 'confirm') {
        const it = M.pendItem;
        const tid = alive[Math.min(M.memberIdx, alive.length - 1)];
        if (tid != null) useItemOn(it, G.actors[tid]);
        M.screen = 'items';
      }
      else if (a === 'cancel') { M.screen = 'items'; SFX.cancel(); }
    } else if (M.screen === 'equip') {
      stepEquipMenu(a);
    } else if (M.screen === 'status') {
      if (a === 'left' || a === 'right') { const n = G.roster.length; if (n) { M.memberIdx = (M.memberIdx + (a === 'right' ? 1 : n - 1)) % n; SFX.move(); } }
      else if (a === 'cancel' || a === 'confirm') { M.screen = 'main'; SFX.cancel(); }
    }
  }

  function inventoryList() {
    const out = [];
    for (const k in G.items) if (G.items[k] > 0 && DB.item[k]) out.push({ cat: 'i', id: +k, name: DB.item[k].name, count: G.items[k], row: DB.item[k] });
    return out;
  }

  function equipBagList(catFilter) {
    const out = [];
    for (const k in (G.bagEquip || {})) {
      if (G.bagEquip[k] <= 0) continue;
      const [cat, idStr] = k.split(':');
      if (catFilter && cat !== catFilter) continue;
      const id = +idStr;
      const db = cat === 'w' ? DB.weapon[id] : DB.armor[id];
      if (db) out.push({ cat, id, name: db.name, row: db });
    }
    return out;
  }

  function stepEquipMenu(a) {
    const M = G.menu;
    const memberId = G.roster[M.memberIdx];
    if (memberId == null) { M.screen = 'main'; return; }
    if (a === 'left') { M.memberIdx = (M.memberIdx + G.roster.length - 1) % G.roster.length; SFX.move(); }
    else if (a === 'right') { M.memberIdx = (M.memberIdx + 1) % G.roster.length; SFX.move(); }
    else if (a === 'up' || a === 'down') { M.eqSlot = M.eqSlot === 'weapon' ? 'armor' : 'weapon'; SFX.move(); }
    else if (a === 'confirm') {
      const bag = equipBagList(M.eqSlot === 'weapon' ? 'w' : 'a');
      M.bagList = bag; M.bagCursor = 0; M.screen = 'equipPick';
      SFX.confirm();
    }
    else if (a === 'cancel') { M.screen = 'main'; SFX.cancel(); }
  }

  function stepEquipPick(a) {
    const M = G.menu;
    const bag = M.bagList || [];
    if (a === 'up' && bag.length) { M.bagCursor = (M.bagCursor + bag.length - 1) % bag.length; SFX.move(); }
    else if (a === 'down' && bag.length) { M.bagCursor = (M.bagCursor + 1) % bag.length; SFX.move(); }
    else if (a === 'confirm') {
      const a0 = G.actors[G.roster[M.memberIdx]];
      const slotIdx = M.eqSlot === 'weapon' ? 0 : 1;
      const oldId = a0.eq[slotIdx];
      if (oldId) {
        const key = (slotIdx === 0 ? 'w:' : 'a:') + oldId;
        G.bagEquip[key] = (G.bagEquip[key] || 0) + 1;
      }
      if (bag.length) {
        const pick = bag[M.bagCursor];
        a0.eq[slotIdx] = pick.id;
        const key = pick.cat + ':' + pick.id;
        G.bagEquip[key]--; if (G.bagEquip[key] <= 0) delete G.bagEquip[key];
      } else a0.eq[slotIdx] = 0;
      SFX.buy();
      M.screen = 'equip';
    }
    else if (a === 'cancel') { M.screen = 'equip'; SFX.cancel(); }
  }

  // ---- 商店 ----
  function stepShop(a) {
    const S = G.shop;
    if (S.kind === 'inn') {
      if (a === 'confirm') innStay();
      else if (a === 'cancel') closeShop();
      return;
    }
    if (S.kind === 'train') {
      if (a === 'confirm') trainOnce();
      else if (a === 'cancel') closeShop();
      return;
    }
    if (S.mode === 'buy') {
      const goods = shopGoods(S.kind);
      if (a === 'up' && goods.length) { S.cursor = (S.cursor + goods.length - 1) % goods.length; SFX.move(); }
      else if (a === 'down' && goods.length) { S.cursor = (S.cursor + 1) % goods.length; SFX.move(); }
      else if (a === 'confirm') buyGood();
      else if (a === 'right') { S.mode = 'sell'; S.sellCursor = 0; S.msg = null; SFX.move(); }
      else if (a === 'cancel') closeShop();
    } else {
      const list = sellableList();
      if (a === 'up' && list.length) { S.sellCursor = (S.sellCursor + list.length - 1) % list.length; SFX.move(); }
      else if (a === 'down' && list.length) { S.sellCursor = (S.sellCursor + 1) % list.length; SFX.move(); }
      else if (a === 'confirm') sellCursor();
      else if (a === 'left') { S.mode = 'buy'; S.msg = null; SFX.move(); }
      else if (a === 'cancel') closeShop();
    }
  }

  // ---- 战斗输入 ----
  function stepBattle(a) {
    B = G.battle;
    if (!B) return;
    // 战斗速度切换
    if (a === 'speed') {
      G.battleSpeed = G.battleSpeed === 1 ? 2 : 1;
      B.notice = G.battleSpeed === 2 ? '⚡ 快速模式' : '正常速度';
      SFX.confirm();
      return;
    }
    if (B.phase === 'intro' || B.phase === 'msgview') {
      if (a === 'confirm') advanceBMsg(true);
      return;
    }
    if (B.phase === 'result') {
      if (a === 'confirm') {
        if (B.result === 'defeat') { G.state = 'gameover'; G.battle = null; }
        else finishBattle();
      }
      return;
    }
    if (B.phase === 'command') {
      const cur = B.party[B.memberIdx];
      if (a === 'cmd-attack') chooseCmd(cur, 'attack');
      else if (a === 'cmd-tactic') chooseCmd(cur, 'tactic');
      else if (a === 'cmd-defend') chooseCmd(cur, 'defend');
      else if (a === 'cmd-item') chooseCmd(cur, 'item');
      else if (a === 'cmd-other') chooseCmd(cur, 'other');
      else if (a === 'up') { B.cmdCursor = (B.cmdCursor + 4) % 5; SFX.move(); }
      else if (a === 'down') { B.cmdCursor = (B.cmdCursor + 1) % 5; SFX.move(); }
      else if (a === 'confirm') chooseCmd(cur, BATTLE_CMDS[B.cmdCursor]);
      else if (a === 'cancel') {
        if (B.choices.length) {
          const c = B.choices.pop();
          B.memberIdx = B.party.indexOf(c);
          SFX.cancel();
        }
      }
    } else if (B.phase === 'targetE') {
      const es = bEnemies();
      if (a === 'up' || a === 'left') { B.targetCursor = (B.targetCursor + es.length - 1) % Math.max(1, es.length); SFX.move(); }
      else if (a === 'down' || a === 'right') { B.targetCursor = (B.targetCursor + 1) % Math.max(1, es.length); SFX.move(); }
      else if (a === 'confirm') {
        if (!bEnemies().length) { B.phase = 'command'; return; }
        const t = bEnemies()[Math.min(B.targetCursor, bEnemies().length - 1)];
        commitChoice({ kind: B.pendingKind, skillId: B.pendingSkill, itemId: B.pendingItem, target: t });
      }
      else if (a === 'cancel') { B.phase = 'command'; SFX.cancel(); }
    } else if (B.phase === 'targetA') {
      const alive = bParty();
      if (a === 'up') { B.targetCursor = (B.targetCursor + alive.length - 1) % Math.max(1, alive.length); SFX.move(); }
      else if (a === 'down') { B.targetCursor = (B.targetCursor + 1) % Math.max(1, alive.length); SFX.move(); }
      else if (a === 'confirm') {
        if (!alive.length) { B.phase = 'command'; return; }
        const t = alive[Math.min(B.targetCursor, alive.length - 1)];
        commitChoice({ kind: B.pendingKind, skillId: B.pendingSkill, itemId: B.pendingItem, target: t });
      }
      else if (a === 'cancel') { B.phase = 'submenu'; SFX.cancel(); }
    } else if (B.phase === 'submenu') {
      const list = B.subList || [];
      if (a === 'up' && list.length) { B.subCursor = (B.subCursor + list.length - 1) % list.length; SFX.move(); }
      else if (a === 'down' && list.length) { B.subCursor = (B.subCursor + 1) % list.length; SFX.move(); }
      else if (a === 'confirm') pickSubmenu(list[Math.min(B.subCursor, Math.max(0, list.length - 1))]);
      else if (a === 'cancel') { B.phase = 'command'; SFX.cancel(); }
    }
  }

  function chooseCmd(member, kind) {
    B = G.battle;
    B.pendingKind = kind;
    B.pendingSkill = null; B.pendingItem = null;
    SFX.confirm();
    if (kind === 'attack') { B.phase = 'targetE'; B.targetCursor = 0; if (!bEnemies().length) { B.phase='command'; return; } }
    else if (kind === 'defend') commitChoice({ kind: 'defend' });
    else if (kind === 'tactic') {
      const sks = learnedSkills(member.actor.cls, member.actor.lvl)
        .filter(sid => DB.skill[sid] && DB.skill[sid].kind >= 1 && DB.skill[sid].kind <= 4 && DB.skill[sid].name !== '智复计')
        .map(sid => DB.skill[sid]);
      if (!sks.length) { flashNotice(`${actorName(member.id)} 不懂任何策略！`); return; }
      B.subList = sks; B.subCursor = 0; B.phase = 'submenu';
    }
    else if (kind === 'item') {
      const list = inventoryList().filter(r => (r.row.effects || []).some(ef => ef[0] === 'hp' || ef[0] === 'mp' || ef[0] === 'revive'));
      if (!list.length) { flashNotice('没有可用的道具！'); return; }
      B.subList = list; B.subCursor = 0; B.phase = 'submenu';
    }
    else if (kind === 'other') {
      B.subList = [{ __retreat: true, name: '撤退' }];
      B.subCursor = 0; B.phase = 'submenu';
    }
  }
  function flashNotice(text) {
    B.notice = text;
    setTimeout(() => { if (G.battle) G.battle.notice = null; }, 900);
  }

  function pickSubmenu(sel) {
    B = G.battle;
    if (!sel) return;
    SFX.confirm();
    if (sel.__retreat) { tryRetreat(); return; }
    if (sel.row && sel.row.effects) {
      B.pendingKind = 'item'; B.pendingItem = sel.id;
      B.phase = 'targetA'; B.targetCursor = 0;
      return;
    }
    const sk = sel;
    B.pendingKind = 'tactic'; B.pendingSkill = sk.id;
    if (sk.mp > B.party[B.memberIdx].actor.mp) { flashNotice('策略值不足！'); return; }
    if (sk.kind === 1 && sk.scope === 1) { B.phase = 'targetE'; B.targetCursor = 0; if (!bEnemies().length) B.phase = 'command'; }
    else if (sk.kind === 2 && sk.scope < 7) { B.phase = 'targetA'; B.targetCursor = 0; }
    else commitChoice({ kind: 'tactic', skillId: sk.id });
  }

  function tryRetreat() {
    B = G.battle;
    if (B.boss) { pushBMsg('此战关乎军令，无法撤退！'); B.phase = 'msgview'; return; }
    const myAgi = bParty().reduce((s, p) => s + actorAgi(p.actor), 0) / Math.max(1, bParty().length);
    const enAgi = bEnemies().reduce((s, e) => s + e.agi, 0) / Math.max(1, bEnemies().length);
    if (chance(clamp(0.45 + (myAgi - enAgi) / 400, 0.15, 0.9))) {
      pushBMsg('全军脱离战场！');
      B.result = 'retreat'; B.phase = 'msgview';
    } else {
      pushBMsg('撤退失败！被敌军缠住了！');
      B.phase = 'msgview';
      B._pendingEnemyTurn = true;
    }
  }

  function commitChoice(choice) {
    B = G.battle;
    choice.actor = B.party[B.memberIdx];
    B.choices.push(choice);
    SFX.confirm();
    const nxt = nextLivingMember(B.memberIdx);
    if (nxt < 0) {
      B.phase = 'resolve';
      resolveRoundUI();
    } else {
      B.memberIdx = nxt;

  function resolveRoundUI() {
    B = G.battle;
    if (!B || B.result) return;
    resolveRound();
    if (G.battle && !G.battle.result) { G.battle.phase = 'msgview'; advanceBMsg(false); }
    else if (G.battle) G.battle.phase = 'result';
  }

  function advanceBMsg(force) {
    B = G.battle;
    if (!B) return;
    if (B.queue.length) {
      B.curMsg = B.queue.shift();
      B.msgTimer = performance.now() + 800 / (G.battleSpeed || 1);
    } else {
      B.curMsg = null;
      if (B.phase === 'intro') { B.phase = 'command'; B.memberIdx = nextLivingMember(-1); B.cmdCursor = 0; }
      else if (B.phase === 'msgview') {
        if (B.result) B.phase = 'result';
        else if (B.retreatMagic) { B.result = 'retreat'; B.phase = 'result'; }
        else if (B._pendingEnemyTurn) {
          B._pendingEnemyTurn = false;
          for (const en of bEnemies()) {
            applyEnemyAction(en);
            if (!bParty().length) { battleDefeat(); break; }
          }
          if (G.battle && !G.battle.result) { G.battle.phase = 'msgview'; }
          else if (G.battle) G.battle.phase = 'result';
        }
        else { B.phase = 'command'; B.memberIdx = nextLivingMember(-1); B.cmdCursor = 0; }
      }
    }
  }

  function drawTileAt(ch, sx, sy) {

  function renderWorld() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    const m = MAPS[G.mapId];
    if (!m) return;
    const rows = m.rows.length;
    const cols = Math.max.apply(null, m.rows.map(r => r.length));
    const camX = clamp(G.x * TILE - (VIEW_COLS * TILE - TILE) / 2, 0, Math.max(0, cols * TILE - VIEW_COLS * TILE));
    const camY = clamp(G.y * TILE - (VIEW_ROWS * TILE - TILE) / 2, 0, Math.max(0, rows * TILE - VIEW_ROWS * TILE));
    for (let ry = -1; ry <= VIEW_ROWS; ry++) {
      for (let rx = -1; rx <= VIEW_COLS; rx++) {
        const mx = Math.floor(camX / TILE) + rx, my = Math.floor(camY / TILE) + ry;
        let ch = tileCh(G.mapId, mx, my);
        if (ch === ' ') ch = 'g';
        drawTileAt(ch, rx * TILE - (camX % TILE), ry * TILE - (camY % TILE));
      }
    }
    // 事件物
    const time = Date.now();
    for (const ev of (m.events || [])) {
      const sx = ev.x * TILE - camX, sy = ev.y * TILE - camY;
      if (sx < -TILE || sy < -TILE || sx > WIDTH || sy > HEIGHT - HUD_H) continue;
      if (ev.t === 'chest' && !G.flags[ev.flag]) {
        ctx.fillStyle = '#8a5a2a'; ctx.fillRect(sx + 10, sy + 22, 44, 30);
        ctx.fillStyle = '#b8843e'; ctx.fillRect(sx + 10, sy + 22, 44, 10);
        ctx.fillStyle = '#f0c840'; ctx.fillRect(sx + 27, sy + 32, 10, 12);
      }
      if (ev.t === 'npc' || ev.t === 'shopkeeper' || ev.t === 'innkeeper' || ev.t === 'trainer') {
        if (ev.t === 'npc' && ev.flag && G.flags[ev.flag]) continue;
        let lookId = 1;
        if (ev.actor) lookId = ev.actor;
        else if (ev.kind === 'weapon') lookId = 6;
        else if (ev.kind === 'item' || ev.t === 'innkeeper') lookId = 5;
        else lookId = 4;
        // NPC shadow
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        ctx.beginPath(); ctx.ellipse(sx + TILE / 2, sy + TILE - 6, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
        // NPC idle animation: gentle bob and frame cycling
        const npcPhase = (time / 800 + ev.x * 3 + ev.y * 7) % (Math.PI * 2);
        const bobY = Math.sin(npcPhase) * 2;
        const npcFrame = Math.sin(npcPhase * 0.5) > 0.3 ? 1 : 0;
        ctx.drawImage(actorSprite(lookId, 'down', npcFrame), sx, sy - 6 + bobY);
      }
    }
    // 玩家
    const psx = G.x * TILE - camX, psy = G.y * TILE - camY;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(psx + TILE / 2, psy + TILE - 6, 20, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(actorSprite(G.roster[0] || 2, G.dir, G.frame), psx, psy - 4);

    // ---- HUD ----
    ctx.fillStyle = '#0a0a12'; ctx.fillRect(0, HEIGHT - HUD_H, WIDTH, HUD_H);
    ctx.strokeStyle = '#f0ead2'; ctx.lineWidth = 3;
    ctx.strokeRect(4, HEIGHT - HUD_H + 4, WIDTH - 8, HUD_H - 8);
    txt(m.name, 24, HEIGHT - HUD_H + 16, '#f0bd57', 26);
    txt('金 ' + G.gold, 24, HEIGHT - HUD_H + 58, '#f6ecd0', 26);
    // 遭遇指示器（世界地图且有遭遇设定时显示）
    if (m.encounter && !m.town) {
      const enc = m.encounter;
      const dots = 10;

      txt('遇敌', 200, HEIGHT - HUD_H + 58, '#8a94a8', 20);

        ctx.fillStyle = d < filled ? '#d84a4a' : '#2a2a3a';
        ctx.fillRect(260 + d * 16, HEIGHT - HUD_H + 44, 12, 12);
      }
    }
    txt('K 菜单 · H 调查', WIDTH - 280, HEIGHT - HUD_H + 16, '#8a94a8', 20);
    const chips = G.roster.slice(0, 5);
    chips.forEach((id, i) => {

          win(200, 820, 1520, 120);
          const curEquip = cur.cat === 'w' ? firstActor.eq[0] : firstActor.eq[1];
          const curStat = cur.cat === 'w' ? (curEquip ? DB.weapon[curEquip].atk : 0) : (curEquip ? DB.armor[curEquip].def : 0);
          const newStat = cur.cat === 'w' ? DB.weapon[cur.id].atk : DB.armor[cur.id].def;
          const diff = newStat - curStat;
          const diffCol = diff > 0 ? '#9ae0a0' : diff < 0 ? '#ff7a6a' : '#8a94a8';
          txt(actorName(firstActor.id) + ' 当前装备', 260, 850, '#8a94a8', 24);
          txt((cur.cat === 'w' ? '攻击' : '防御') + '：' + curStat + ' → ' + newStat, 700, 850, diffCol, 28);
          txt((diff > 0 ? '▲' : diff < 0 ? '▼' : '＝') + Math.abs(diff), 1100, 850, diffCol, 32);
        }
      }
    } else {
      const list = sellableList();
      if (!list.length) txt('没有可以卖的东西。', 300, 280, '#8a94a8', 32);
      const sStart = Math.max(0, (S.sellCursor || 0) - 9);
      list.slice(sStart, sStart + 10).forEach((s, vi) => {
        const i = sStart + vi;
        txt(((S.sellCursor || 0) === i ? '▶ ' : '　') + s.name + ' ×' + s.count, 300, 260 + vi * 72, (S.sellCursor || 0) === i ? '#ffe9a0' : '#cfd8e8', 34);
        txt('卖 ' + Math.floor(s.price / 2) + ' 金', 1560, 264 + vi * 72, '#f6ecd0', 30, 'right');
      });
    }
    if (S.msg) txt(S.msg, 300, 830, '#9ae0a0', 30);
  }

  function enemyScreenPos(idx) {
    return { x: 1150 + (idx % 3) * 250, y: 100 + Math.floor(idx / 3) * 260 };
  }
  function partyScreenPos(idx) {
    return { x: 90, y: 640 + idx * 86 };
  }

  function renderBattle() {
    B = G.battle;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    if (!B) return;
    // 遭遇闪光效果
    if (B.flash && B.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${B.flash / 12})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      B.flash--;
    }
    ctx.fillStyle = '#101828'; ctx.fillRect(0, 0, WIDTH, 560);
    ctx.fillStyle = '#18243a';
    for (let i = 0; i < 8; i++) {
      const bx = i * 260 - 60;
      ctx.beginPath(); ctx.moveTo(bx, 560); ctx.lineTo(bx + 130, 330 + (i % 3) * 40); ctx.lineTo(bx + 260, 560); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#0c1420'; ctx.fillRect(0, 560, WIDTH, HEIGHT - 560);

    B.enemies.forEach((en, idx) => {
      if (en.hp <= 0) return;
      const pos = enemyScreenPos(idx);
      drawEnemyPortrait(ctx, pos.x, pos.y, 190, en.eid);
      ctx.fillStyle = '#301818'; ctx.fillRect(pos.x + 6, pos.y + 196, 178, 10);
      ctx.fillStyle = '#d84a4a'; ctx.fillRect(pos.x + 6, pos.y + 196, Math.round(178 * en.hp / en.mhp), 10);
      txt(en.name, pos.x + 95, pos.y + 210, '#f0c8a0', 26, 'center');
    });

    const pw = 1740, px = 90, py = 590;
    win(px, py, pw, 470);
    B.party.forEach((m, idx) => {
      const pos = partyScreenPos(idx);
      const a = m.actor;
      const dead = a.hp <= 0;
      const isChoosing = B.phase === 'command' && B.memberIdx === idx;
      const hasChosen = B.choices.some(c => c.actor === m);
      if (B.phase === 'targetA' && bParty()[Math.min(B.targetCursor, bParty().length - 1)] === m) txt('▶', pos.x - 46, pos.y + 14, '#ffd24a', 40);
      else if (isChoosing) txt('▶', pos.x - 46, pos.y + 14, '#ffffff', 40);
      ctx.globalAlpha = dead ? 0.35 : 1;
      ctx.drawImage(actorSprite(m.id, 'down', 0), 0, 0, 64, 64, pos.x, pos.y, 72, 72);
      ctx.globalAlpha = 1;
      const nameCol = dead ? '#6a6470' : hasChosen ? '#8fa8c8' : '#f6ecd0';
      txt(actorName(m.id), pos.x + 92, pos.y - 2, nameCol, 30);
      txt(a.hp + '/' + a.mhp, pos.x + 92, pos.y + 36, dead ? '#c05a5a' : '#9ae0a0', 26);
      txt('策' + a.mp, pos.x + 250, pos.y + 38, '#7ab8d8', 24);
      if (m.defending) txt('守', pos.x + 330, pos.y + 4, '#8ac8e8', 26);
      ctx.fillStyle = '#1a2418'; ctx.fillRect(pos.x + 92, pos.y + 68, 240, 8);
      ctx.fillStyle = dead ? '#4a2020' : '#5aa858';
      ctx.fillRect(pos.x + 92, pos.y + 68, Math.round(240 * clamp(a.hp / a.mhp, 0, 1)), 8);
    });

    if (B.phase === 'targetE') {
      const es = bEnemies();
      const t = es[Math.min(B.targetCursor, Math.max(0, es.length - 1))];
      if (t) {
        const pos = enemyScreenPos(B.enemies.indexOf(t));
        ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
        ctx.strokeRect(pos.x - 6, pos.y - 6, 202, 240);
        txt('▼', pos.x + 85, pos.y - 46, '#ffd24a', 40);
      }
    }

    if (B.phase === 'command') {
      const cw = 420, cx = 1240, cy = 590;
      win(cx, cy, cw, 470);
      BATTLE_CMDS.forEach((cmd, i) => {
        txt((B.cmdCursor === i ? '▶ ' : '　') + BATTLE_CMD_NAMES[cmd], cx + 60, cy + 40 + i * 84, B.cmdCursor === i ? '#ffe9a0' : '#cfd8e8', 38);
      });
      const cur = B.party[B.memberIdx];
      if (cur) txt(actorName(cur.id) + ' 的行动？', 90, 556, '#ffe9a0', 30);
    } else if (B.phase === 'submenu') {
      const sw = 620, sx = 1040, sy = 590;
      const list = B.subList || [];
      win(sx, sy, sw, 470);
      const subStart = Math.max(0, B.subCursor - 4);
      list.slice(subStart, subStart + 5).forEach((s, vi) => {
        const i = subStart + vi;
        const label = s.__retreat ? '撤退' : (s.row ? s.name + ' ×' + s.count : s.name + ' (' + s.mp + ')');
        txt((B.subCursor === i ? '▶ ' : '　') + label, sx + 50, sy + 36 + vi * 86, B.subCursor === i ? '#ffe9a0' : '#cfd8e8', 34);
      });
      if (list.length > 5) txt('…上下键翻看更多', sx + 50, sy + 400, '#8a94a8', 22);
    } else if (B.phase === 'targetE' || B.phase === 'targetA') {
      win(1240, 900, 420, 160);
      txt(B.phase === 'targetE' ? '选择目标 ▲▼ H 确定' : '对我方谁使用？', 1450, 952, '#ffe9a0', 28, 'center');
    }

    if (B.curMsg) {
      win(60, 60, 1020, 160);
      txt(B.curMsg, 110, 106, '#f6ecd0', 34);
    }

    if (!B.result) {
      txt('第 ' + (B.round + 1) + ' 回合', WIDTH - 220, 30, '#8a94a8', 26);
      if (G.battleSpeed === 2) txt('⚡', WIDTH - 80, 30, '#f0bd57', 26);
    }

    for (const p of B.popups) {
      let sxp = 0, syp = 0;
      if (p.side === 'e') {
        const idx = B.enemies.indexOf(p.ref);
        if (idx >= 0) { const pos = enemyScreenPos(idx); sxp = pos.x + 95; syp = pos.y + 50; }
      } else {
        const idx = B.party.indexOf(p.ref);
        if (idx >= 0) { const pos = partyScreenPos(idx); sxp = pos.x + 50; syp = pos.y - 16; }
      }
      txt(p.text, sxp, syp - (42 - p.t) * 1.6, p.color, 40, 'center');
    }

    if (B.phase === 'result') {
      if (B.result === 'victory') {
        win(200, 120, 1520, 840);
        txt('—— 战 胜 ——', WIDTH / 2, 180, '#9ae0a0', 64, 'center');
        // 奖励区
        win(300, 240, 600, 200);
        txt('战利品', 360, 270, '#f0bd57', 30);
        (B.victoryMsg || []).slice(0, 1).forEach((l, i) => txt(l, 360, 320 + i * 46, '#f6ecd0', 28));
        // 等级提升区
        const levelUps = B._levelUps || [];
        if (levelUps.length) {
          win(960, 240, 660, 200);
          txt('成长', 1020, 270, '#f0bd57', 30);
          let ly = 320;
          for (const lu of levelUps) {
            txt(lu.name + ' → ' + lu.lvl + ' 级', 1020, ly, '#9ae0a0', 26);
            if (lu.newSkills.length) txt('习得：' + lu.newSkills.join('、'), 1020, ly + 34, '#7ab8d8', 22);
            ly += lu.newSkills.length ? 72 : 46;
          }
        }
        // 缴获物品区
        const drops = B._drops || [];
        if (drops.length) {
          win(300, 470, 1320, 120);
          txt('缴获', 360, 500, '#f0bd57', 30);
          txt(drops.join('、'), 480, 500, '#f6ecd0', 26);
        }
        // 队伍状态
        win(300, 620, 1320, 200);
        txt('队伍状态', 360, 650, '#f0bd57', 30);
        B.party.forEach((m, i) => {
          const a = m.actor;
          const px = 360 + i * 260;
          txt(actorName(m.id), px, 700, '#f6ecd0', 24);
          txt('Lv' + a.lvl + '  HP' + a.hp + '/' + a.mhp, px, 734, '#9ae0a0', 20);
        });
        txt('H 继续', WIDTH / 2, 900, '#8a94a8', 30, 'center');
      } else if (B.result === 'defeat') {
        win(360, 260, 1200, 480);
        txt('—— 败 北 ——', WIDTH / 2, 300, '#ff7a6a', 64, 'center');
        txt('队伍溃散……', WIDTH / 2, 430, '#cfd8e8', 36, 'center');
        txt('H 返回标题', WIDTH / 2, 664, '#8a94a8', 28, 'center');
      } else {
        win(360, 260, 1200, 480);
        txt('撤退成功', WIDTH / 2, 320, '#f0bd57', 56, 'center');
        txt('H 继续', WIDTH / 2, 664, '#8a94a8', 28, 'center');
      }
    }
    if (B.notice) {
      win(WIDTH / 2 - 300, 490, 600, 90);
      txt(B.notice, WIDTH / 2, 518, '#ffb0a0', 32, 'center');
    }
  }

  function renderChapterEnd() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    const info = G._chapterInfo || { lines: [] };
    win(200, 160, 1520, 760);
    txt('第一章 · 灭袁术', WIDTH / 2, 210, '#f0bd57', 56, 'center');
    info.lines.forEach((l, i) => txt(l, WIDTH / 2, 330 + i * 66, '#f6ecd0', 34, 'center'));
    txt('H 返回标题', WIDTH / 2, 840, '#8a94a8', 28, 'center');
  }
  function stepChapterEnd(a) {
    if (a === 'confirm') { saveGame(); G.state = 'title'; G.titleCursor = 0; }
  }

  function renderGameOver() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    txt('败 亡', WIDTH / 2, 360, '#c85a48', 110, 'center');
    txt('乱世的风，掩过了旗帜倒下的声音。', WIDTH / 2, 500, '#8a94a8', 34, 'center');
    const hasSave = !!Save.load();
    if (hasSave) {
      txt('▶ 读取存档', WIDTH / 2, 620, G.titleCursor === 0 ? '#ffe9a0' : '#8a94a8', 36, 'center');
      txt('　返回标题', WIDTH / 2, 690, G.titleCursor === 1 ? '#ffe9a0' : '#65768b', 36, 'center');
    } else {
      txt('H 返回标题', WIDTH / 2, 640, '#65768b', 28, 'center');
    }
  }

  function render() {
    switch (G.state) {
      case 'title': renderTitle(); break;
      case 'world': renderWorld(); break;
      case 'dialogue': renderDialogue(); break;
      case 'menu': renderMenu(); break;
      case 'shop': renderShop(); break;
      case 'battle': renderBattle(); break;
      case 'chapterend': renderChapterEnd(); break;
      case 'gameover': renderGameOver(); break;
      default: renderTitle();
    }
  }

  // ════════════════════════ 主循环 ════════════════════════
  let lastT = performance.now();
  function loop(now) {
    const dt = now - lastT; lastT = now;
    G.animT += dt;
    if (G.animT > 240) { G.animT = 0; G.frame ^= 1; }
    if (G.state === 'battle' && G.battle) {
      B = G.battle;
      const speedMul = G.battleSpeed || 1;
      if ((B.phase === 'intro' || B.phase === 'msgview')) {
        if (!B.curMsg) advanceBMsg(false);
        else if (performance.now() > (B.msgTimer || 0)) advanceBMsg(false);
      }
      for (const p of B.popups) p.t -= speedMul;
      B.popups = B.popups.filter(p => p.t > 0);
    }
    render();
    requestAnimationFrame(loop);
  }

  // ════════════════════════ 输入接线 ════════════════════════
  canvas.setAttribute('tabindex', '0');
  try { canvas.focus(); } catch (_) {}
  document.addEventListener('keydown', (event) => {
    if (event.repeat) return;
    const action = keyActions[event.key] || keyActions[event.code];
    if (!action) return;
    event.preventDefault();
    Input.enqueue(action);
    step(action);
  });
  document.querySelectorAll('[data-action]').forEach((button) => {
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const action = button.getAttribute('data-action');
      tone(320, .035);
      step(action);
    });
  });

  let padLast = {};
  setInterval(() => {
    let pads;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (_) { return; }
    if (!pads) return;
    for (const gp of pads) {
      if (!gp) continue;
      const th = 0.5;
      const st = {
        up: !!(gp.buttons[12] && gp.buttons[12].pressed) || (gp.axes[1] || 0) < -th,
        down: !!(gp.buttons[13] && gp.buttons[13].pressed) || (gp.axes[1] || 0) > th,
        left: !!(gp.buttons[14] && gp.buttons[14].pressed) || (gp.axes[0] || 0) < -th,
        right: !!(gp.buttons[15] && gp.buttons[15].pressed) || (gp.axes[0] || 0) > th,
        a: !!(gp.buttons[0] && gp.buttons[0].pressed),
        b: !!(gp.buttons[1] && gp.buttons[1].pressed),
        start: !!(gp.buttons[9] && gp.buttons[9].pressed)
      };
      if (st.up && !padLast.up) step('up');
      if (st.down && !padLast.down) step('down');
      if (st.left && !padLast.left) step('left');
      if (st.right && !padLast.right) step('right');
      if (st.a && !padLast.a) step('confirm');
      if (st.b && !padLast.b) step('cancel');
      if (st.start && !padLast.start) step('menu');
      padLast = st;
    }
  }, 66);

  // ════════════════════════ 测试钩子 ════════════════════════
  window.TKGame = { G, DB, TK, MAPS, Input, step, newGame, startBattle, classStat, expToNext,
    physDamage, tacticDamage, tacticHeal, grantExp, Save, learnedSkills, Dialogue,
    joinActor, addItem, removeItem, recalc, actorSprite, tileCanvas,
    get statusView() { return _statusView; }, set statusView(v) { _statusView = v; } };

  render();
  try { requestAnimationFrame(loop); } catch (_) {}

  })();
  </script>
</body>
</html>
