<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <meta name="description" content="九州烽烟：一款原创 FC 风格三国 RPG 外壳。">
  <title>九州烽烟 · 汉末群雄</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6e9c9;
      --muted: #a99d86;
      --gold: #f0bd57;
      --red: #d86455;
      --blue: #5da3c9;
      --panel: #15151f;
      --panel-deep: #0b0c13;
      --line: #514735;
      font-family: "SF Mono", "Cascadia Mono", "Noto Sans Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -20%, #293046 0, transparent 48%),
        linear-gradient(160deg, #090b12 0%, #11131d 48%, #08090e 100%);
    }
    .console {
      width: min(1340px, calc(100% - 28px));
      margin: 0 auto;
      padding: clamp(16px, 4vw, 34px) 0 28px;
    }
    .console-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 0 4px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      margin: 0;
      color: var(--gold);
      font-size: clamp(15px, 2.5vw, 22px);
      letter-spacing: .16em;
      text-shadow: 2px 2px #4b2d26;
    }
    .subbrand { margin: 5px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .08em; }
    .led { color: #6ad58a; font-size: 10px; letter-spacing: .08em; white-space: nowrap; }
    .led::before { content: "●"; margin-right: 7px; color: #6ad58a; }
    .screen-shell {
      margin-top: 18px;
      padding: clamp(10px, 2vw, 18px);
      background: linear-gradient(145deg, #262333, #10111a 70%);
      border: 1px solid #675b43;
      border-radius: 12px;
      box-shadow: 0 20px 55px rgba(0,0,0,.42), inset 0 0 0 4px #0d0e15;
    }
    .screen-bezel {
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vw, 16px);
      background: #05060a;
      border: 3px solid #3b352a;
      border-radius: 6px;
      box-shadow: inset 0 0 34px rgba(0,0,0,.8);
    }
    canvas {
      display: block;
      width: min(100%, 1920px);
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111421;
      outline: 1px solid #2d3448;
    }
    .control-deck {
      display: grid;
      grid-template-columns: 1fr minmax(190px, 250px) 1fr;
      align-items: center;
      gap: clamp(16px, 5vw, 48px);
      margin-top: 18px;
      padding: 14px;
      background: rgba(8,9,14,.75);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 38px);
      justify-content: center;
    }
    .action-pad { display: flex; justify-content: center; align-items: center; gap: 14px; }
    .battle-actions { display: flex; justify-content: center; gap: 6px; grid-column: 1 / -1; }
    .battle-actions .control-button { min-width: 54px; font-size: 10px; }
    button {
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .control-button {
      min-width: 42px;
      min-height: 38px;
      border: 1px solid #736145;
      border-radius: 5px;
      background: linear-gradient(#3a3540, #1b1b26);
      box-shadow: 0 3px 0 #090a10;
    }
    .control-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #090a10; }
    .control-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .face-button { border-radius: 50%; border-color: #874a45; background: linear-gradient(#753f43, #392126); }
    .face-button.confirm { color: #ffd878; }
    .face-button.cancel { color: #b5cde0; }
    .face-button.menu { color: #a8d8a8; }
    .face-button.status { color: #d8b8a8; }
    .hint { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; text-align: center; }
    .hint strong { color: var(--gold); font-weight: normal; }
    .footer-note { margin: 15px 4px 0; color: #746d61; font-size: 10px; line-height: 1.6; text-align: center; }
    @media (max-width: 560px) {
      .console { width: min(100% - 18px, 1340px); }
      .console-head { align-items: start; flex-direction: column; gap: 6px; }
      .control-deck { grid-template-columns: 1fr 1fr; gap: 12px; }
      .hint { grid-column: 1 / -1; grid-row: 1; }
      .dpad { grid-column: 1; grid-row: 2; }
      .action-pad { grid-column: 2; grid-row: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>

    <section class="screen-shell" aria-label="九州烽烟游戏屏幕">
      <div class="screen-bezel">

      </div>
      <div class="control-deck" aria-label="移动控制器">
        <div class="dpad" aria-label="方向键">
          <button class="control-button up" data-action="up" aria-label="上">▲</button>
          <button class="control-button left" data-action="left" aria-label="左">◀</button>
          <button class="control-button right" data-action="right" aria-label="右">▶</button>
          <button class="control-button down" data-action="down" aria-label="下">▼</button>

        <p class="hint"><strong>方向键 / WASD / 触控</strong><br>H 确认 · J 取消 · K 菜单 · L 状态<br>1–5 战斗指令</p>

        context.beginPath(); context.moveTo(gx2 + 7, gy2 + 12); context.lineTo(gx2 + 6, gy2 + 2); context.stroke();
        context.beginPath(); context.moveTo(gx2 + 14, gy2 + 14); context.lineTo(gx2 + 13, gy2 + 1); context.stroke();
        context.beginPath(); context.moveTo(gx2 + 21, gy2 + 13); context.lineTo(gx2 + 20, gy2 + 3); context.stroke();
        const gx3 = sx + 85 + seed3 * 5; const gy3 = sy + 60 + seed2 * 5;
        context.strokeStyle = 'rgba(80,150,80,.18)';
        context.beginPath(); context.moveTo(gx3, gy3 + 16); context.lineTo(gx3 - 1, gy3); context.stroke();
        context.beginPath(); context.moveTo(gx3 + 7, gy3 + 14); context.lineTo(gx3 + 8, gy3 + 2); context.stroke();
        context.beginPath(); context.moveTo(gx3 + 14, gy3 + 16); context.lineTo(gx3 + 13, gy3 + 1); context.stroke();
        // 水面波纹
        if (palette[0] && palette[0].includes('30') || palette[0] && palette[0].includes('40')) {
          context.strokeStyle = 'rgba(100,160,220,.15)'; context.lineWidth = 1;
          for (let w = 0; w < 4; w++) {
            const wy = sy + 15 + w * 28;
            context.beginPath(); context.moveTo(sx + 5, wy); context.lineTo(sx + size - 5, wy); context.stroke();
          }
        }
        // tile border edge
        context.strokeStyle = 'rgba(0,0,0,.1)'; context.lineWidth = 1;
        context.strokeRect(sx + 0.5, sy + 0.5, size - 1, size - 1);
      }
    }
    function viewportFor(worldX, worldY) {
      const maxX = Math.max(0, 16 * MAP_TILE_SIZE - MAP_VIEW_WIDTH);
      const maxY = Math.max(0, 16 * MAP_TILE_SIZE - MAP_VIEW_HEIGHT);
      return {
        x: Math.max(0, Math.min(maxX, worldX * MAP_TILE_SIZE - MAP_VIEW_WIDTH / 2 + MAP_TILE_SIZE / 2)),
        y: Math.max(0, Math.min(maxY, worldY * MAP_TILE_SIZE - MAP_VIEW_HEIGHT / 2 + MAP_TILE_SIZE / 2))
      };
    }
    function renderWorld() {
      if (!ctx) return;
      const map = DATA.MAPS[World.mapId] || DATA.MAPS.field;
      const camera = viewportFor(World.x, World.y);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WIDTH, MAP_VIEW_HEIGHT); ctx.clip();
      ctx.fillStyle = map.palette[0]; ctx.fillRect(0, 0, WIDTH, MAP_VIEW_HEIGHT);
      const cell = MAP_TILE_SIZE;
      const startCol = Math.max(0, Math.floor(camera.x / cell));
      const endCol = Math.min(15, Math.ceil((camera.x + MAP_VIEW_WIDTH) / cell));
      const startRow = Math.max(0, Math.floor(camera.y / cell));
      const endRow = Math.min(15, Math.ceil((camera.y + MAP_VIEW_HEIGHT) / cell));
      for (let y = startRow; y <= endRow; y++) for (let x = startCol; x <= endCol; x++) {
        const sx = x * cell - camera.x; const sy = y * cell - camera.y;
        drawTileTexture(ctx, sx, sy, cell, map.tiles[y][x] === '#', map.palette, x, y);
      }
      for (const point of map.interactions) {
        if (point.x < startCol || point.x > endCol || point.y < startRow || point.y > endRow) continue;
        const px = point.x * cell - camera.x + 20; const py = point.y * cell - camera.y + 20;
        if (point.actorId) drawActorSprite(ctx, point.actorId, point.x * cell - camera.x, point.y * cell - camera.y - 18, { frame: 0 });
        else { ctx.fillStyle = point.kind === 'npc' ? '#d1b66a' : point.kind === 'chest' ? '#a96d4f' : point.kind === 'recovery' ? '#79b89b' : '#78a6cf'; ctx.fillRect(px, py, 30, 30); }
      }
      drawActorSprite(ctx, World.party[0] || 'liu-bei', World.x * cell - camera.x, World.y * cell - camera.y - 18, { frame: (World.x + World.y) % 2 });
      ctx.restore();
      panel(0, MAP_VIEW_HEIGHT, WIDTH, HEIGHT - MAP_VIEW_HEIGHT, '#111522', '#5a4a34');
      drawText(map.name, 50, MAP_VIEW_HEIGHT + 30, '#f0bd57', 44);
      drawText(`章 ${Game.chapter} · 目标：${Game.currentObjective || World.objective}`, 50, MAP_VIEW_HEIGHT + 90, '#c3bba9', 28);
      drawText(Game.message || map.hint, 50, MAP_VIEW_HEIGHT + 140, '#c3bba9', 24);
      drawText(`队伍 ${World.party.length || 0}/3`, WIDTH - 60, MAP_VIEW_HEIGHT + 34, '#75b6cf', 28, 'right');
      World.party.slice(0, 3).forEach((id, index) => { drawActorSprite(ctx, id, 1050 + index * 180, MAP_VIEW_HEIGHT + 50, { frame: index % 2, height: 100 }); drawText(DATA.ACTORS[id].name, 1110 + index * 180, MAP_VIEW_HEIGHT + 160, '#f6e9c9', 24, 'center'); });
      if (Game.partySelection.visible) {
        panel(280, 200, 1360, 620, '#101522', '#e2b75f');
        drawText('出战编成', 340, 240, '#f0bd57', 44);
        drawText('方向键选择 · H 确认 · J 取消 · 选满三人自动出战', 340, 320, '#c3bba9', 26);
        Game.partySelection.options.forEach((id, index) => {
          const selected = Game.partySelection.selected.includes(id);
          drawText(`${index === Game.partySelection.cursor ? '▶' : ' '} ${selected ? '■' : '□'} ${DATA.ACTORS[id].name}`, 380, 400 + index * 60, index === Game.partySelection.cursor ? '#f6e9c9' : '#8f9aaa', 34);
        });
      }
    }
    function renderDialogue() {
      renderWorld();
      // 新版对话框：窗口从 y=620 开始，高度 380，宽度 1000，居中
      const dy = 620, dh = 380, dw = 1000, dx = (WIDTH - dw) / 2;
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(dx, dy, dw, dh);
      // 外框金色
      ctx.strokeStyle = '#c8a040'; ctx.lineWidth = 3; ctx.strokeRect(dx + 1, dy + 1, dw - 2, dh - 2);
      // 内框暗色
      ctx.strokeStyle = '#5a5040'; ctx.lineWidth = 1; ctx.strokeRect(dx + 6, dy + 6, dw - 12, dh - 12);
      const text = Game.dialogue[Game.dialoguePage] || '';
      const colonIdx = text.indexOf('：');
      const speaker = colonIdx > 0 ? text.substring(0, colonIdx) : '对话';
      const displayText = colonIdx > 0 ? text.substring(colonIdx + 1) : text;
      drawText(speaker, dx + 40, dy + 40, '#f0bd57', 30);
      drawText(displayText, dx + 40, dy + 100, '#f6e9c9', 32);
      drawText('H 确认', dx + dw - 40, dy + dh - 40, '#5da3c9', 24, 'right');
    }
    function renderBattle() {
      if (!ctx) return;
      const enemy = Battle.enemy || { name: '未定敌阵', troops: 0, morale: 0 };
      // gradient background (sky/terrain)
      const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      grad.addColorStop(0, '#1a2040');
      grad.addColorStop(0.4, '#252a48');
      grad.addColorStop(1, '#151424');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      // 0-60: 战斗标题栏（深色背景，金色文字）
      ctx.fillStyle = '#0c0f1a'; ctx.fillRect(0, 0, WIDTH, 60);
      drawText(Battle.encounter ? Battle.encounter.name : '遭遇战', 960, 44, '#f0bd57', 42, 'center');
      // 60-500: 敌方区域
      const enemyId = Battle.encounter && DATA.ENEMIES[Battle.encounter.enemy] ? Battle.encounter.enemy : null;
      // 敌方精灵居中偏右
      if (enemyId) drawActorSprite(ctx, enemyId, 1100, 120, { flip: true, height: 320 });
      // 敌方名称和状态在左侧
      drawText(enemy.name, 120, 160, '#e89b81', 40);
      drawText(`兵力 ${String(enemy.troops).padStart(2, '0')}  士气 ${String(enemy.morale).padStart(2, '0')}`, 120, 220, '#c3bba9', 30);
      // 敌方兵力条
      ctx.fillStyle = '#383458'; ctx.fillRect(100, 280, 900, 24);
      ctx.fillStyle = '#8b4060'; ctx.fillRect(100, 280, Math.max(0, Math.round(900 * enemy.troops / Math.max(1, DATA.ENEMIES[Battle.encounter.enemy].troops))), 24);
      // 500-540: 分隔线
      ctx.fillStyle = '#c8a040'; ctx.fillRect(60, 500, WIDTH - 120, 3);
      // 540-740: 我方队伍区域（3人横排）
      let py = 540;
      Object.values(Battle.party || {}).forEach((actor, index) => {
        const px = 100 + index * 560;
        drawActorSprite(ctx, actor.id, px, py, { frame: index % 2, height: 120, width: 90 });
        drawText(`${actor.name}`, px + 110, py + 10, '#f6e9c9', 26);
        drawText(`${String(actor.troops).padStart(2, '0')}/${actor.maxTroops}`, px + 110, py + 46, actor.troops > 0 ? '#79b89b' : '#6e6670', 22);
        // 兵力条
        ctx.fillStyle = '#2a2840'; ctx.fillRect(px + 110, py + 76, 300, 12);
        ctx.fillStyle = actor.troops > 0 ? '#5a8a6a' : '#3a3040';
        ctx.fillRect(px + 110, py + 76, Math.max(0, Math.round(300 * actor.troops / Math.max(1, actor.maxTroops))), 12);
      });
      // 740-820: 指令菜单（5个选项）
      panel(60, 740, 1800, 80, '#111522', '#5a4a34');
      drawText('1 进击  2 计策  3 防守  4 道具  5 撤退', 120, 800, '#f6e9c9', 28);
      // 820-920: 战斗日志
      panel(60, 830, 1800, 90, '#0c0f1a', '#3a3860');
      const latest = Battle.log && Battle.log[Battle.log.length - 1];
      drawText(latest ? latest.text : '选择行动，守住这条路。', 120, 900, '#c3bba9', 26);
      // 920-960: 回合信息和提示
      drawText(`回合 ${Battle.round}  · ${Battle.pendingActors ? '等待队伍指令' : '行动焦点：全队'}`, 120, 940, '#a99d86', 24);
      drawText('数字键 / 触控按钮 · J 取消', 1800, 940, '#5da3c9', 22, 'right');
    }
    function renderChapterSummary() {
      if (!ctx) return;
      const summary = Game.chapterSummary || World.chapterSummary || { title: '第一章', items: [] };
      ctx.fillStyle = '#0d1118'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      drawText(`${summary.title || '章节结算'} · ${summary.completed ? '完成' : '回顾'}`, 960, 80, '#f0bd57', 44, 'center');
      drawText('要点回顾', 160, 180, '#c8dbdf', 32);
      const items = Array.isArray(summary.items) ? summary.items : [];
      const list = items.length ? items : ['队伍将继续向营地前进'];
      list.slice(0, 6).forEach((text, index) => drawText(`${index + 1}. ${text}`, 200, 260 + index * 68, '#f6e9c9', 30));
      drawText('前往营地进行整备，准备进入下一阶段。', 960, 720, '#a99d86', 26, 'center');
      drawText('H 确认继续    J 返回标题', 960, 800, '#75b6cf', 26, 'center');
    }
    function renderChapterTransition() {
      if (!ctx) return;
      ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      for (let y = 0; y < HEIGHT; y += 20) { ctx.fillStyle = y % 40 ? '#0d1522' : '#0f1928'; ctx.fillRect(0, y, WIDTH, 10); }
      drawText('第二章', 960, 300, '#f0bd57', 80, 'center');
      drawText('古 驿 道', 960, 420, '#c8dbdf', 44, 'center');
      ctx.fillStyle = '#263f50'; ctx.fillRect(660, 490, 600, 6);
      drawText('新的征途即将开始……', 960, 540, '#a99d86', 28, 'center');
      drawText('H 确认继续', 960, 720, '#75b6cf', 28, 'center');
    }
    function renderSpecialState() {
      if (!ctx) return;
      ctx.fillStyle = '#0e121c'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      const titles = { 'battle-result': '战斗记录', camp: '静松营', 'game-over': '灯火暂熄' };
      drawText(titles[Game.state] || '', 960, 100, '#f0bd57', 44, 'center');
      if (Game.state === 'battle-result' && Battle.result) {
        const resultText = Battle.status === 'victory' ? `胜利 · 获得 ${Battle.enemy.reward} 军粮` : '撤退 · 未获得战果';
        drawText(resultText, 960, 200, '#f6e9c9', 28, 'center');
        drawText(Battle.log[Battle.log.length - 1]?.text || '', 960, 260, '#c3bba9', 24, 'center');
      } else {
        drawText(Game.state === 'camp' ? '整理行囊，下一程仍在等候。' : Game.state === 'game-over' ? '队伍全员败退，旅程暂告中止。' : '道路清晰了一些。', 960, 240, '#c3bba9', 28, 'center');
      }
      drawText(Game.state === 'battle-result' ? 'H 确认战果    J 返回标题' : 'H 确认继续    J 返回标题', 960, 440, '#75b6cf', 26, 'center');
    }
    function render() {
      if (Game.state === 'title') renderTitle();
      else if (Game.state === 'world') renderWorld();
      else if (Game.state === 'dialogue') renderDialogue();
      else if (Game.state === 'battle') renderBattle();
      else if (Game.state === 'chapter-summary') renderChapterSummary();
      else if (Game.state === 'chapter-transition') renderChapterTransition();
      else renderSpecialState();
    }

    function step(action) {
      if (Game.state === 'world' && Game.partySelection.visible) {
        let handled = false;
        for (const actionName of ['up', 'down', 'confirm', 'cancel']) {
          if (Input.consume(actionName)) { Game.partyInput(actionName); handled = true; }
        }
        for (const dir of ['left', 'right']) {
          if (Input.consume(dir)) { Game.partyInput(dir); handled = true; }
        }
        render();
        return;
      }
      if (Game.state === 'title' && Input.consume('confirm')) { Game.startNew(); render(); return; }
      if (Game.state === 'world') {
        for (const direction of ['up', 'down', 'left', 'right']) {
          if (Input.consume(direction)) {
            const result = World.move(direction);
            if (result.triggered && result.triggered.type === 'exit') Game.message = `前往${DATA.MAPS[World.mapId].name}`;
            else if (result.blocked) Game.message = '前方是无法通行的地形。';
          }
        }
        if (Input.consume('confirm')) {
          const result = World.interact();
          const point = result.triggered;
          if (point && point.type === 'npc' && point.dialogue) Dialogue.start(point.dialogue);
          else if (point && point.type === 'scene' && point.dialogue) Dialogue.start(point.dialogue);
          else if (point && point.type === 'battle' && point.encounter) Battle.start(point.encounter);
          else if (point && point.type === 'chest') Game.message = `获得：${DATA.ITEMS[point.content.item].name}`;
          else if (point && point.type === 'loot') {
            if (point.once && World.chests[point.id]) Game.message = '这里已经没有遗漏的物品了。';
            else if (point.content) {
              if (point.storyEvent) { World.storyFlags[point.storyEvent] = true; World.events[point.storyEvent] = true; }
              if (point.once) World.chests[point.id] = true;
              World.items[point.content.item] = (World.items[point.content.item] || 0) + (point.content.amount || 1);
              Game.message = `搜刮到：${DATA.ITEMS[point.content.item].name}`;
            } else Game.message = '仔细搜刮后，发现这里已经没有补给。';
          }
          else if (point && point.type === 'recovery') Game.message = '队伍恢复了兵力。';
          else if (point && point.type === 'exit') Game.message = `前往${DATA.MAPS[World.mapId].name}`;
          else if (!point) Game.message = '这里没有可以交互的对象。';
        }
        if (Input.consume('menu')) Game.openCamp();
        if (Input.consume('status')) Game.message = `兵力：${World.party.map(id => `${DATA.ACTORS[id].name} ${World.troops[id]}`).join('　')}　军粮：${World.provisions}`;
      } else if (Game.state === 'dialogue') {
        if (Input.consume('confirm')) Dialogue.confirm();
        if (Input.consume('cancel')) { Game.state = 'world'; Dialogue.activeId = null; }
      } else if (Game.state === 'camp') {
        if (Input.consume('confirm')) Game.state = 'world';
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Game.state === 'battle') {
        const commandByAction = { 'battle-1': 'attack', 'battle-2': { type: 'tactic', tacticId: 'fire-suppression' }, 'battle-3': 'defend', 'battle-4': { type: 'item' }, 'battle-5': 'retreat' };
        for (let i = 1; i <= 5; i++) {
          const battleAction = `battle-${i}`;
          if (Input.consume(battleAction)) {
            Battle.chooseNext(commandByAction[battleAction]);
            const pending = Object.keys(Battle.party).some((id) => Battle.party[id].troops > 0 && !Battle.choices[id]);
            if (!pending) Battle.resolveRound();
            break;
          }
        }
        if (Input.consume('cancel')) {
          if (Battle.encounter && Battle.encounter.kind === 'normal') Battle.chooseNext('retreat');
          else Game.message = '首领战无法返回。';
        }
      } else if (Game.state === 'battle-result') {
        if (Input.consume('confirm')) Battle.finish();
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Game.state === 'chapter-summary') {
        if (Input.consume('confirm')) Game.confirmChapterSummary();
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Game.state === 'chapter-transition') {
        if (Input.consume('confirm')) Game.confirmChapterTransition();
      } else if (Game.state === 'game-over') {
        if (Input.consume('confirm')) Game.returnToTitle();
        if (Input.consume('cancel')) Game.returnToTitle();
      } else if (Input.consume('cancel')) Game.returnToTitle();
      render();
    }

    window.DATA = DATA;
    window.Input = Input;
    window.ACTIONS = ACTIONS;
    window.keyActions = keyActions;
    window.Quests = QUESTS;
    window.Game = Game;
    window.World = World;
    window.Dialogue = Dialogue;
    window.Battle = Battle;
    window.Save = Save;
    window.Story = {
      beginChapter1() { return Game.beginChapterOpening(); },
      advance(eventId) { Game.showDialogue(eventId); return Game.state; },
      getCurrentQuest() { return { ...World.quests }; }
    };
    window.GameCanvas = canvas;
    window.GameRender = render;
    window.GameStep = step;
    window.drawActorSprite = drawActorSprite;

    document.addEventListener('keydown', (event) => {
      if (event.repeat) return;
      const action = keyActions[event.key] || keyActions[event.code];
      if (!action) return;
      event.preventDefault();
      Input.enqueue(action);
    });
    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const action = button.getAttribute('data-action');
        if (Input.enqueue(action)) { tone(320, .035); step(action); }
      });
      button.addEventListener('click', () => {
        const action = button.getAttribute('data-action');
        if (Input.enqueue(action)) step(action);
      });
    });
    let gamepadLastState = {};
    function gamepadPoll() {
      let gamepads;
      try { gamepads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (_) { return; }
      if (!gamepads) return;
      for (let i = 0; i < gamepads.length; i++) {
        const gp = gamepads[i];
        if (!gp) continue;
        const axisThreshold = 0.4;
        const prev = gamepadLastState[i] || {};
        const cur = { axes: gp.axes.slice(), buttons: gp.buttons.map((b) => b.pressed) };
        const lx = gp.axes[0] || 0; const ly = gp.axes[1] || 0;
        if (lx < -axisThreshold && !(prev.axes && prev.axes[0] < -axisThreshold)) Input.enqueue('left');
        if (lx > axisThreshold && !(prev.axes && prev.axes[0] > axisThreshold)) Input.enqueue('right');
        if (ly < -axisThreshold && !(prev.axes && prev.axes[1] < -axisThreshold)) Input.enqueue('up');
        if (ly > axisThreshold && !(prev.axes && prev.axes[1] > axisThreshold)) Input.enqueue('down');
        if (gp.buttons[0] && gp.buttons[0].pressed && !(prev.buttons && prev.buttons[0])) Input.enqueue('confirm');
        if (gp.buttons[1] && gp.buttons[1].pressed && !(prev.buttons && prev.buttons[1])) Input.enqueue('cancel');
        if (gp.buttons[2] && gp.buttons[2].pressed && !(prev.buttons && prev.buttons[2])) Input.enqueue('battle-1');
        if (gp.buttons[3] && gp.buttons[3].pressed && !(prev.buttons && prev.buttons[3])) Input.enqueue('battle-2');
        if (gp.buttons[4] && gp.buttons[4].pressed && !(prev.buttons && prev.buttons[4])) Input.enqueue('battle-3');
        if (gp.buttons[5] && gp.buttons[5].pressed && !(prev.buttons && prev.buttons[5])) Input.enqueue('battle-4');
        if (gp.buttons[8] && gp.buttons[8].pressed && !(prev.buttons && prev.buttons[8])) Input.enqueue('cancel');
        gamepadLastState[i] = cur;
      }
    }
    function gamepadLoop() {
      gamepadPoll();
      step();
      requestAnimationFrame(gamepadLoop);
    }
    render();
    try { requestAnimationFrame(gamepadLoop); } catch (_) { /* gamepad loop is optional */ }
  })();
  </script>
</body>
