<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="43200">
  <title>墨屏小站 · 闲置屏幕</title>
  <style>
    /* ================================================================
    * 墨屏小站 v0.4(像素级参考 Kindle Noodle)
     * 兼容目标:Kindle Paperwhite 3 实验浏览器(2015 年 WebKit)
     * 约束:ES5、Flexbox(老 WebKit 支持良好)、固定 758px 宽
     * ================================================================ */

    /* 基础重置(老 WebKit 兼容) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-animation: none !important;
      animation: none !important;
      -webkit-transition: none !important;
      transition: none !important;
    }

    html { height: 100%; overflow: hidden; }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: stretch;
      -webkit-align-items: stretch;
      align-items: stretch;
      -webkit-box-pack: start;
      -webkit-justify-content: flex-start;
      justify-content: flex-start;
    }

    /* ===== 舞台层(竖屏铺满视口,横屏 rotate 90°) ===== */
    #rotate-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
    }

    /* 主容器(弹性伸缩填满剩余高度) */
    #main {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      padding: 8px 8px 8px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    /* ===== 时钟卡片(顶部弹性区) ===== */
    .clock-card {
      background: #fff;
      border-radius: 60px;
      border: 1px solid #ddd;
      border-bottom: 3px solid #ddd;
      padding: 18px 28px 12px;
      height: auto;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      margin-bottom: 8px;
      overflow: hidden;
      position: relative;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    .clock-digits {
      width: 100%;
      overflow: hidden;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: stretch;
      -webkit-align-items: stretch;
      align-items: stretch;
    }

    .digit-card {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      background: #000;
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }

    .clock-colon + .digit-card {
      margin-left: 20px;
    }

    .digit-number {
      font-weight: 900;
      font-size: 200px;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    /* 数字中间分割线(模拟数码管效果) */
    .digit-line {
      position: absolute;
      top: 50%;
      left: 34px;
      right: 34px;
      height: 6px;
      margin-top: -3px;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2;
    }

    /* 时间冒号 */
    .clock-colon {
      display: none;
      font-size: 100px;
      font-weight: bold;
      color: #ccc;
      line-height: 1;
      text-align: center;
      -webkit-box-flex: 0;
      -webkit-flex: none;
      flex: none;
      -webkit-box-align: center;
      align-items: center;
      margin-left: 12px;
    }

    /* 时钟设置按钮 */
    .clock-style-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      -webkit-box-align: center;
      align-items: center;
    }

    /* ===== 天气横条(块级两行,兼容老 WebKit) ===== */
    .weather-strip {
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 40px;
      border: 1px solid #ddd;
      border-bottom: 3px solid #ddd;
      padding: 8px 20px 8px;
      display: block;
    }

    /* 第一行:城市 + 天气 + 温度(全宽,永不被截) */
    .weather-main {
      display: block;
      font-size: 36px;
      font-weight: 700;
      color: #000;
      letter-spacing: 1px;
      line-height: 1.2;
      white-space: normal;
      overflow: visible;
      width: 100%;
    }

    /* 第二行:湿度风速 + 右侧按钮 */
    .weather-sub-row {
      display: table;
      width: 100%;
      table-layout: fixed;
      margin-top: 6px;
    }

    .weather-sub {
      display: table-cell;
      vertical-align: middle;
      font-size: 27px;
      color: #000;
      font-weight: 700;
      white-space: nowrap;
    }

    .weather-btns {
      display: table-cell;
      text-align: right;
      white-space: nowrap;
    }

    .weather-refresh-btn {
      background: none;
      border: 2px solid #000;
      border-radius: 24px;
      padding: 4px 16px;
      font-size: 22px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* 设置按钮(城市输入) */
    .weather-settings-btn {
      background: none;
      border: 2px solid #000;
      border-radius: 24px;
      padding: 4px 14px;
      font-size: 22px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      margin-left: 8px;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ===== 底部双卡片行 ===== */
    .bottom-row {
      height: auto;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      margin-bottom: 8px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
    }

    /* 日期卡片 & 语录卡片(各半宽) */
    .date-card,
    .quote-card {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
      background: #fff;
      border-radius: 60px;
      border: 1px solid #ddd;
      border-bottom: 3px solid #ddd;
      padding: 28px;
      height: auto;
    }

    .date-card {
      margin-right: 8px;
      text-align: center;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    .date-weekday {
      font-size: 30px;
      font-weight: 900;
      color: #000;
      margin-bottom: 8px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .date-rule {
      height: 1px;
      background: #e0e0e0;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .date-rule { height: 1px; background: #e0e0e0; flex-shrink: 0; margin: 8px 0; }
    .date-day-wrap {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }

    .date-day {
      font-size: 96px;
      font-weight: bold;
      color: #000;
      line-height: 1;
    }

    .date-lunar {
      font-size: 26px;
      color: #000;
      font-weight: 900;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      margin-top: 6px;
    }

    /* 语录卡片 */
    .quote-card {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    .quote-label {
      background: #eee;
      border-radius: 38px;
      height: 52px;
      line-height: 52px;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      color: #000;
      margin-bottom: 12px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .quote-body-wrap {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      overflow: hidden;
      padding-bottom: 8px;
    }

    .quote-body {
      font-size: 32px;
      font-weight: 900;
      color: #000;
      line-height: 1.5;
      overflow: hidden;
    }

    .quote-author {
      font-size: 22px;
      color: #000;
      font-weight: 900;
      text-align: right;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      margin-top: 8px;
    }

    /* ===== 微信读书入口(底部小条) ===== */
    .weread-strip {
      height: 52px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      background: #fff;
      border-radius: 40px;
      border: 1px solid #ddd;
      border-bottom: 3px solid #ddd;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 0 28px;
      text-align: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .weread-strip a {
      font-size: 22px;
      font-weight: 700;
      color: #000;
      text-decoration: none;
      letter-spacing: 2px;
    }

    /* ===== 多页导航 ===== */
    .page {
      display: none;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: stretch;
      -webkit-align-items: stretch;
      align-items: stretch;
      -webkit-box-pack: start;
      -webkit-justify-content: flex-start;
      justify-content: flex-start;
    }
    .page.page-active {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
    }
    .page-card {
      background: #fff;
      border-radius: 40px;
      border: 1px solid #ddd;
      border-bottom: 3px solid #ddd;
      padding: 24px;
      margin-bottom: 12px;
      text-align: center;
    }
    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #000;
      margin-bottom: 8px;
    }
    .page-sub {
      font-size: 20px;
      color: #000;
      margin-bottom: 24px;
    }

    /* 微信读书页 */
    .weread-big-btn {
      display: block;
      background: #000;
      border-radius: 30px;
      padding: 28px 20px;
      margin: 10px auto 20px;
      max-width: 420px;
      text-decoration: none;
    }
    .weread-btn-text {
      display: block;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .weread-btn-sub {
      display: block;
      color: #ccc;
      font-size: 18px;
      margin-top: 6px;
    }
    .weread-tip {
      font-size: 17px;
      color: #000;
      margin-top: 16px;
    }

    /* 番茄钟页 */
    .pomo-time {
      font-size: 88px;
      font-weight: 700;
      color: #000;
      margin: 30px 0 30px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .pomo-btns {
      display: table;
      margin: 0 auto;
      border-spacing: 16px 0;
    }
    .pomo-btn {
      display: table-cell;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 16px 40px;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }
    .pomo-tip {
      font-size: 18px;
      color: #000;
      margin-top: 20px;
    }

    /* 阅读清单页 */
    .list-input-row {
      display: table;
      width: 100%;
      margin-bottom: 16px;
    }
    #list-input {
      display: table-cell;
      width: 78%;
      font-size: 22px;
      padding: 12px 14px;
      border: 2px solid #000;
      border-radius: 12px 0 0 12px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .list-add-btn {
      display: table-cell;
      width: 22%;
      font-size: 22px;
      font-weight: 700;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0 12px 12px 0;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }
    .list-items {
      text-align: left;
      max-height: 380px;
      overflow-y: auto;
    }
    .list-item {
      display: table;
      width: 100%;
      padding: 10px 6px;
      border-bottom: 1px solid #eee;
      font-size: 22px;
      color: #000;
    }
    .list-item-text {
      display: table-cell;
      width: 85%;
      vertical-align: middle;
      padding-right: 8px;
    }
    .list-item-del {
      display: table-cell;
      width: 15%;
      text-align: right;
      font-size: 22px;
      font-weight: 700;
      color: #000;
      background: none;
      border: none;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }
    .list-empty {
      font-size: 20px;
      color: #000;
      text-align: center;
      padding: 30px 0;
    }

    /* 设置页 */
    .set-row {
      display: table;
      width: 100%;
      margin-bottom: 16px;
    }
    .set-label {
      display: table-cell;
      width: 28%;
      font-size: 24px;
      font-weight: 700;
      color: #000;
      vertical-align: middle;
    }
    #set-city-input {
      display: table-cell;
      width: 46%;
      font-size: 22px;
      padding: 10px 12px;
      border: 2px solid #000;
      border-radius: 10px 0 0 10px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .set-save-btn, .set-btn {
      display: table-cell;
      width: 26%;
      font-size: 20px;
      font-weight: 700;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0 10px 10px 0;
      padding: 10px 8px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }
    .set-about {
      font-size: 18px;
      color: #000;
      margin-top: 30px;
    }

    /* 底部导航栏(流内,flex 贴底,随 rotate-wrap 一起旋转) */
    #bottom-nav {
      display: table;
      width: 100%;
      table-layout: fixed;
      background: #fff;
      border-radius: 40px;
      border: 2px solid #000;
      border-bottom: 4px solid #000;
      padding: 14px 8px 16px;
      box-sizing: border-box;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      z-index: 100;
      margin-top: 8px;
    }
    .nav-item {
      display: table-cell;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      padding: 10px 2px;
    }
    .nav-ico {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto;
      line-height: 0;
    }
    .nav-ico svg {
      width: 100%;
      height: 100%;
    }
    .nav-txt {
      display: block;
      font-size: 32px;
      font-weight: 700;
      color: #000;
      margin-top: 4px;
    }
    .nav-item-active .nav-ico,
    .nav-item-active .nav-txt {
      color: #000;
      font-weight: 700;
    }
    .nav-item-active {
      background: #ddd;
      border-radius: 26px;
    }

    /* ===== 设置面板 ===== */
    #settings-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 5000;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 20px 28px 28px;
    }

    #settings-panel p {
      font-size: 18px;
      color: #555;
      margin-bottom: 10px;
    }

    #settings-panel input {
      font-size: 20px;
      padding: 8px 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
      width: 280px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #settings-panel button {
      font-size: 18px;
      padding: 8px 18px;
      border: 1px solid #555;
      border-radius: 20px;
      background: #000;
      color: #fff;
      cursor: pointer;
      margin-left: 10px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #settings-panel .close-btn {
      background: none;
      border: 1px solid #aaa;
      color: #555;
      margin-left: 8px;
    }

    /* ===== 极简模式(黑底白字时钟) ===== */
    body.clock-simple .digit-card {
      background: #fff;
      border: 3px solid #000;
      border-bottom: 5px solid #000;
    }

    body.clock-simple .digit-number {
      color: #000;
    }

    body.clock-simple .digit-line {
      display: none;
    }

    body.clock-simple .clock-colon {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      margin-left: 8px;
    }

    body.clock-simple .clock-colon + .digit-card {
      margin-left: 8px;
    }

    /* ===== 加载状态 ===== */
    .loading {
      color: #999 !important;
      font-size: 22px !important;
    }

    /* ===== 矮屏/横屏适配(Kindle 横屏 1024x615 等) ===== */
    /* 横屏/矮屏(≤800px 高,Kindle 横屏 758 触发) */
    @media (max-height: 800px) {
      body:not(.orient-landscape) #bottom-nav { padding: 8px 6px 10px; border-radius: 30px; }
      body:not(.orient-landscape) .nav-ico { width: 42px; height: 42px; }
      body:not(.orient-landscape) .nav-txt { font-size: 22px; margin-top: 2px; }
      body:not(.orient-landscape) .clock-card { padding: 14px 20px 10px; height: 240px; }
      body:not(.orient-landscape) .digit-number { font-size: 130px; }
      body:not(.orient-landscape) .digit-line { left: 24px; right: 24px; height: 5px; }
      body:not(.orient-landscape) .clock-style-btn { top: 10px; right: 14px; }
      body:not(.orient-landscape) .weather-strip { margin-bottom: 6px; padding: 8px 20px 8px; }
      body:not(.orient-landscape) .weather-main { font-size: 28px; }
      body:not(.orient-landscape) .weather-sub { font-size: 20px; color: #000; font-weight: 700; }
      body:not(.orient-landscape) .weather-sub-row { margin-top: 6px; }
      body:not(.orient-landscape) .weather-refresh-btn, .weather-settings-btn { font-size: 18px; padding: 4px 12px; }
      body:not(.orient-landscape) .orient-btn { font-size: 16px; padding: 2px 8px; }
      body:not(.orient-landscape) .bottom-row { height: 190px; margin-bottom: 6px; }
      body:not(.orient-landscape) .date-card, .quote-card { width: 365px; height: 190px; padding: 14px 18px; }
      body:not(.orient-landscape) .date-weekday { font-size: 24px; margin-bottom: 6px; }
      body:not(.orient-landscape) .date-day { font-size: 76px; }
      body:not(.orient-landscape) .date-lunar { font-size: 20px; margin-top: 4px; color: #000; font-weight: 900; }
      body:not(.orient-landscape) .quote-label { height: 34px; line-height: 34px; font-size: 18px; margin-bottom: 6px; }
      body:not(.orient-landscape) .quote-body { font-size: 22px; }
      body:not(.orient-landscape) .quote-author { font-size: 16px; margin-top: 4px; }
      body:not(.orient-landscape) .weread-strip { height: 46px; }
      body:not(.orient-landscape) .weread-strip a { font-size: 18px; font-weight: 700; }
    }

    /* 超矮屏(<650px 高,极窄设备) */
    @media (max-height: 650px) {
      body:not(.orient-landscape) #bottom-nav { padding: 6px 4px 8px; border-radius: 24px; }

<script>
/* ================================================================
 * 墨屏小站 v0.4 - ES5 兼容版
 * ================================================================ */

/* ---------- 配置 ---------- */
  var WEATHER_API = 'https://wttr.in/';
  var CITY_COOKIE = 'mpxz_city';
  var ORIENT_COOKIE = 'mpxz_orient';
  var CITY_DEFAULT = '上海';
  var QUOTE_SEED_COOKIE = 'mpxz_quote_seed';
  var CLOCK_STYLE_COOKIE = 'mpxz_clock_style';
  var tzOffsetMs = 8 * 3600000; /* 时区偏移(毫秒),默认东八区,可被 ip-api 覆盖 */
  var currentCity = '';

  /* ---------- 工具函数 ---------- */
  function getCookie(name) {
    var cookies = document.cookie.split('; ');
    for (var i = 0; i < cookies.length; i++) {
      var parts = cookies[i].split('=');
      if (parts[0] === name) {
        return decodeURIComponent(parts[1] || '');
      }
    }
    return '';
  }

  function setCookie(name, value, days) {
    var exp = new Date();
    exp.setTime(exp.getTime() + (days || 365) * 86400000);
    document.cookie = name + '=' + encodeURIComponent(value) +
      '; expires=' + exp.toGMTString() +
      '; path=/';
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  /* 获取本地时间(含时区偏移) */
  function getLocalDate() {
    return new Date(Date.now() + tzOffsetMs);
  }

  /* XHR 封装(ES5 兼容) */
  function xhrGet(url, callback, timeout) {
    timeout = timeout || 8000;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = timeout;
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        var ok = xhr.status === 200 || xhr.status === 0;
        callback(ok ? null : xhr.status, ok ? xhr.responseText : '');
      }
    };
    xhr.onerror = function() { callback(-1, ''); };
    xhr.ontimeout = function() { callback(-2, ''); };
    xhr.send();
  }

  /* ---------- 墨水屏刷新(切换视图时去残影) ---------- */
  function einkRefresh(callback) {
    var base = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;pointer-events:none;';
    var black = document.createElement('div');
    black.style.cssText = base + 'background:#000;';
    var white = document.createElement('div');
    white.style.cssText = base + 'background:#fff;';
    document.body.appendChild(black);
    setTimeout(function() {
      document.body.removeChild(black);
      document.body.appendChild(white);
      setTimeout(function() {
        if (callback) callback();
        document.body.removeChild(white);
      }, 120);
    }, 120);
  }

  /* ---------- 时钟 ---------- */
  function updateClock() {
    var now = getLocalDate();
    var h = pad(now.getUTCHours());
    var m = pad(now.getUTCMinutes());
    var dow = now.getUTCDay();   /* 0=周日 */
    var month = now.getUTCMonth(); /* 0=一月 */
    var day = now.getUTCDate();

    document.getElementById('hour').textContent = h;
    document.getElementById('minute').textContent = m;
    document.getElementById('weekday-month').textContent =
      WEEKDAYS[dow] + '  ' + MONTHS[month];
    document.getElementById('day-number').textContent = pad(day);
    document.getElementById('lunar-date').textContent = toLunarLabel(now);
  }

  /* ---------- 日期/农历 ---------- */
  var WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var MONTHS   = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  /* ---------- 农历查表(1900-2100,标准数据) ---------- */
  var LUNAR_INFO = [
      0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
      0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
      0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
      0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
      0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
      0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
      0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
      0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
      0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
      0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
      0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
      0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
      0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
      0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
      0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
      0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
      0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
      0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
      0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
      0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
      0x0d520
    ];

  var LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  var LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
    '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
    '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

  var _lunarCache = { day: -1, label: '' };

  function lLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
  function lLeapDays(y) { return lLeapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
  function lMonthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function lYearDays(y) {
    var sum = 348, i;
    for (i = 0x8000; i > 0x8; i >>= 1) { sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0; }
    return sum + lLeapDays(y);
  }

  function toLunarLabel(date) {
    var y = date.getUTCFullYear(), mo = date.getUTCMonth(), d = date.getUTCDate();
    var key = d + mo * 31 + y * 372;
    if (_lunarCache.day === key) { return _lunarCache.label; }
    var offset = Math.round((Date.UTC(y, mo, d) - Date.UTC(1900, 0, 31)) / 86400000);
    var temp = 0, ly, leap, isLeap = false, lm;
    for (ly = 1900; ly < 2101 && offset > 0; ly++) { temp = lYearDays(ly); offset -= temp; }
    if (offset < 0) { offset += temp; ly--; }
    leap = lLeapMonth(ly);
    for (lm = 1; lm < 13 && offset > 0; lm++) {
      if (leap > 0 && lm === leap + 1 && isLeap === false) { --lm; isLeap = true; temp = lLeapDays(ly); }
      else { temp = lMonthDays(ly, lm); }
      if (isLeap === true && lm === leap + 1) { isLeap = false; }
      offset -= temp;
    }
    if (offset === 0 && leap > 0 && lm === leap + 1) {
      if (isLeap) { isLeap = false; } else { isLeap = true; --lm; }
    }
    if (offset < 0) { offset += temp; --lm; }
    _lunarCache.day = key;
    _lunarCache.label = (isLeap ? '闰' : '') + LUNAR_MONTHS[lm - 1] + '月' + LUNAR_DAYS[offset];
    return _lunarCache.label;
  }

  /* ---------- 天气 ---------- */
  var weatherTimer = null;

  function refreshWeather() {
    var elMain = document.getElementById('weather-main');
    var elSub = document.getElementById('weather-sub');
    elMain.textContent = '刷新中...';
    elMain.className = 'weather-main loading';
    elSub.textContent = '';

    var city = currentCity || getCookie(CITY_COOKIE) || CITY_DEFAULT;
    if (!currentCity && city) currentCity = city;

    /* wttr.in j1 JSON 接口(字段稳定,适合老浏览器) */
    xhrGet(WEATHER_API + encodeURIComponent(city) + '?format=j1&m', function(err, text) {
      if (!err && text) {
        try {
          var data = JSON.parse(text);
          var cur = data.current_condition[0];
          /* 城市名优先用用户设置值(cookie/默认),wttr.in 的 nearest_area 中文解析不稳 */
          var cityName = city;
          var tempC = cur.temp_C;
          var humid = cur.humidity;
          var descEn = cur.weatherDesc && cur.weatherDesc[0] ? cur.weatherDesc[0].value : '';
          var windKmph = cur.windspeedKmph;
          var desc = weatherDescCN(descEn);
          elMain.textContent = cityName + '  ' + desc + '  ' + tempC + '°C';
          elMain.className = 'weather-main';
          elSub.textContent = '湿度 ' + humid + '% · 风速 ' + windKmph + 'km/h';
          einkRefresh(null);
          if (typeof fitScreen === 'function') fitScreen();
          return;
        } catch (e) { /* JSON 解析失败,走文本接口 */ }
      }
      /* 回退:文本接口 */
      xhrGet(WEATHER_API + encodeURIComponent(city) + '?format=%l+%c+%t+%h+%w&m', function(err2, text2) {
        if (!err2 && text2) {
          var clean = text2.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
          elMain.textContent = clean;
          elMain.className = 'weather-main';
          elSub.textContent = '';
          einkRefresh(null);
          if (typeof fitScreen === 'function') fitScreen();
        } else {
          elMain.textContent = city + ' · 天气获取失败';
          elMain.className = 'weather-main';
          elSub.textContent = '请检查网络或设置城市';
          if (typeof fitScreen === 'function') fitScreen();
        }
      }, 8000);
    }, 8000);
  }

  function getQuoteOfDay() {
    var seed = getCookie(QUOTE_SEED_COOKIE);
    if (!seed) { seed = Math.floor(Math.random() * QUOTES.length); setCookie(QUOTE_SEED_COOKIE, String(seed)); }
    var idx = parseInt(seed, 10) || 0;
    /* 按日期轮换(同一天同一句) */
    var today = new Date();
    var dateSeed = Math.floor(today.getTime() / 86400000);
    idx = (dateSeed + parseInt(seed, 10)) % QUOTES.length;
    return QUOTES[idx];
  }

  function updateQuote() {
    var q = getQuoteOfDay();
    document.getElementById('quote-body').textContent = q.text;
    document.getElementById('quote-author').textContent = '- ' + q.author;
    fitQuote();
  }

  /* 每日一句自适应字号(长文本自动缩小,防止溢出) */
  function fitQuote() {
    var el = document.getElementById('quote-body');
    var wrap = el.parentNode;
    if (!el || !wrap) return;
    var maxH = wrap.clientHeight;
    if (maxH <= 0) return;
    var size = 32;
    el.style.fontSize = size + 'px';
    /* 逐级降字号直到放下 */
    while (size > 14 && el.scrollHeight > maxH) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }

  /* ---------- 设置面板 ---------- */
  function openSettings() {
    var panel = document.getElementById('settings-panel');
    panel.style.display = 'block';
    document.getElementById('city-input').value = currentCity || getCookie(CITY_COOKIE) || '';
    document.getElementById('city-input').focus();
    einkRefresh(null);
  }

  function closeSettings() {
    document.getElementById('settings-panel').style.display = 'none';
  }

  function saveCity() {
    var input = document.getElementById('city-input');
    var city = input.value.replace(/^\s+|\s+$/g, '');
    if (!city) city = CITY_DEFAULT;
    setCookie(CITY_COOKIE, city);
    currentCity = city;
    closeSettings();
    syncSetCity();
    refreshWeather();
  }

  /* 回车保存 */
  function setupCityInput() {
    var input = document.getElementById('city-input');
    if (input.addEventListener) {
      input.addEventListener('keypress', function(e) {
        if (e.keyCode === 13 || e.which === 13) saveCity();
      });
    }
    var setInput = document.getElementById('set-city-input');
    if (setInput && setInput.addEventListener) {
      setInput.addEventListener('keypress', function(e) {
        if (e.keyCode === 13 || e.which === 13) {
          document.getElementById('city-input').value = setInput.value;
          saveCity();
        }
      });
    }
  }

  /* ---------- 横竖屏切换 ---------- */
  function toggleOrient() {
    var isLand = document.body.className.indexOf('orient-landscape') >= 0;
    if (isLand) {
      document.body.className = document.body.className.replace(/orient-landscape/g, '').replace(/\s+/g, ' ').trim();
      setCookie(ORIENT_COOKIE, 'portrait');
    } else {
      document.body.className += ' orient-landscape';
      setCookie(ORIENT_COOKIE, 'landscape');
    }
    if (typeof fitScreen === 'function') fitScreen();
    einkRefresh(null);
  }

  /* ---------- 一屏适配:动态缩放 ---------- */
  function fitScreen() {
    var rotateWrap = document.getElementById('rotate-wrap');
    if (!rotateWrap) return;

    var isLand = document.body.className.indexOf('orient-landscape') >= 0;
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;

    if (!isLand) {
      /* ===== 竖屏:铺满视口,不缩放(内容 flex 弹性自适应) ===== */
      rotateWrap.style.position = 'relative';
      rotateWrap.style.left = 'auto';
      rotateWrap.style.top = 'auto';
      rotateWrap.style.width = '100%';
      rotateWrap.style.height = '100%';
      rotateWrap.style.webkitTransformOrigin = '0 0';
      rotateWrap.style.transformOrigin = '0 0';
      rotateWrap.style.webkitTransform = 'none';
      rotateWrap.style.transform = 'none';
    } else {
      /* ===== 横屏:整体旋转 90°,铺满视口 =====
       * 布局宽=vh(旋转后成视觉高), 布局高=vw(旋转后成视觉宽)
       * origin(0,0) rotate(90deg): (x,y)->(-y,x), 盒子跑到 x∈[-vw,0]
       * 用 translateX(vw) rotate(90deg) 平移到 x∈[0,vw] */
      rotateWrap.style.position = 'absolute';
      rotateWrap.style.left = '0px';
      rotateWrap.style.top = '0px';
      rotateWrap.style.width = vh + 'px';
      rotateWrap.style.height = vw + 'px';
      rotateWrap.style.webkitTransformOrigin = '0 0';
      rotateWrap.style.transformOrigin = '0 0';
      rotateWrap.style.webkitTransform = 'translateX(' + vw + 'px) rotate(90deg)';
      rotateWrap.style.transform = 'translateX(' + vw + 'px) rotate(90deg)';
    }
  }

  function initOrient() {
    var saved = getCookie(ORIENT_COOKIE);
    if (saved === 'landscape') {
      document.body.className += ' orient-landscape';
    }
  }

  /* ---------- 时钟样式切换 ---------- */
  function toggleClockStyle() {
    var isSimple = document.body.className.indexOf('clock-simple') >= 0;
    if (isSimple) {
      document.body.className = '';
      setCookie(CLOCK_STYLE_COOKIE, '');
    } else {
      document.body.className = 'clock-simple';
      setCookie(CLOCK_STYLE_COOKIE, 'simple');
    }
    einkRefresh(null);
  }

  /* ---------- 初始化 ---------- */
  function init() {
    /* 时钟样式 */
    var savedStyle = getCookie(CLOCK_STYLE_COOKIE);
    if (savedStyle === 'simple') document.body.className = 'clock-simple';

    /* 方向 */
    initOrient();

    /* 城市 */
    currentCity = getCookie(CITY_COOKIE) || CITY_DEFAULT;

    /* 时钟 + 日期 */
    updateClock();
    setInterval(updateClock, 60000);

    /* 天气 */
    refreshWeather();

    /* 语录 */
    updateQuote();

    /* 设置输入 */
    setupCityInput();

    /* 导航页初始化 */
    renderList();
    syncSetCity();

    /* 一屏适配 */
    fitScreen();
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fitScreen(); if (typeof fitQuote === 'function') fitQuote(); });
    } else {
      window.onresize = function () { fitScreen(); if (typeof fitQuote === 'function') fitQuote(); };
    }
    /* 缩放后再校准每日一句字号 */
    if (typeof fitQuote === 'function') setTimeout(fitQuote, 50);
  }

  /* 页面加载后启动 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* ---------- 多页导航 ---------- */
  var PAGE_NAMES = ['home', 'weread', 'pomo', 'list', 'settings'];

  function switchPage(name) {
    var pages = ['home', 'weread', 'pomo', 'list', 'settings'];
    for (var i = 0; i < pages.length; i++) {
      var pg = document.getElementById('page-' + pages[i]);
      if (pg) {
        pg.style.display = '';
        if (pages[i] === name) pg.className = 'page page-active';
        else pg.className = 'page';
      }
    }
    var main = document.getElementById('main');
    if (main) main.style.display = (name === 'home') ? '' : 'none';
    for (var j = 0; j < pages.length; j++) {
      var nav = document.getElementById('nav-' + pages[j]);
      if (nav) {
        if (pages[j] === name) nav.className = 'nav-item nav-item-active';
        else nav.className = 'nav-item';
      }
    }
    if (typeof einkRefresh === 'function') einkRefresh(null);
    if (typeof fitScreen === 'function') fitScreen();
  }

  /* ---------- 番茄钟 ---------- */
  var POMO_COOKIE = 'mpxz_pomo';
  var pomoTotal = 25 * 60;
  var pomoLeft = pomoTotal;
  var pomoTimer = null;
  var pomoRunning = false;

  function pomoStart() {
    if (pomoRunning) { pausePomo(); return; }
    pomoRunning = true;
    document.getElementById('pomo-start-btn').textContent = '暂停';
    pomoTimer = setInterval(pomoTick, 1000);
  }

  function pomoTick() {
    pomoLeft--;
    if (pomoLeft <= 0) {
      pomoLeft = 0;
      pomoDone();
      return;
    }
    renderPomo();
  }

  function pausePomo() {
    pomoRunning = false;
    clearInterval(pomoTimer);
    document.getElementById('pomo-start-btn').textContent = '继续';
  }

  function pomoReset() {
    pomoRunning = false;
    clearInterval(pomoTimer);
    pomoLeft = pomoTotal;
    document.getElementById('pomo-start-btn').textContent = '开始';
    renderPomo();
  }

  function pomoDone() {
    pomoRunning = false;
    clearInterval(pomoTimer);
    document.getElementById('pomo-start-btn').textContent = '开始';
    document.getElementById('pomo-tip').textContent = '专注完成!休息 5 分钟吧';
    renderPomo();
  }

  function renderPomo() {
    var m = Math.floor(pomoLeft / 60);
    var s = pomoLeft % 60;
    document.getElementById('pomo-time').textContent =
      (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  /* ---------- 阅读清单 ---------- */
  var LIST_COOKIE = 'mpxz_list';

  function getList() {
    var raw = getCookie(LIST_COOKIE);
    if (!raw) return [];
    try {
      var arr = JSON.parse(raw);
      return arr && arr.length !== undefined ? arr : [];
    } catch (e) { return []; }
  }

  function saveList(arr) {
    setCookie(LIST_COOKIE, JSON.stringify(arr));
  }

  function renderList() {
    var box = document.getElementById('list-items');
    var arr = getList();
    if (!arr.length) {
      box.innerHTML = '<div class="list-empty">清单是空的,添加一本想读的书吧</div>';
      return;
    }
    var h = '';
    for (var i = 0; i < arr.length; i++) {
      h += '<div class="list-item"><span class="list-item-text">' +
        escapeHtml(arr[i]) + '</span>' +
        '<button class="list-item-del" onclick="listDel(' + i + ')">✕</button></div>';
    }
    box.innerHTML = h;
  }

  function listAdd() {
    var input = document.getElementById('list-input');
    var val = input.value.replace(/^\s+|\s+$/g, '');
    if (!val) return;
    var arr = getList();
    arr.push(val);
    saveList(arr);
    input.value = '';
    renderList();
  }

  function listDel(i) {
    var arr = getList();
    arr.splice(i, 1);
    saveList(arr);
    renderList();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 设置页城市输入同步 */
  function syncSetCity() {
    var el = document.getElementById('set-city-input');
    if (el) el.value = currentCity || getCookie(CITY_COOKIE) || CITY_DEFAULT;
  }

</script>
