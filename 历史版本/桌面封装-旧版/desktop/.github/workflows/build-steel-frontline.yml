name: Build Steel Frontline Desktop

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: build:mac
          - os: windows-latest
            command: build:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 坦克大战/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: 坦克大战/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: steel-frontline-${{ matrix.os }}
          path: 坦克大战/desktop/dist/*
